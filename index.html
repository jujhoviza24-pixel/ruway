      var m = Math.floor(n / r), s = new Float32Array(m);
      for (k = 0; k < m; k++) {
        var x = k * r, i = Math.floor(x), f = x - i, t = 0;
        for (c = 0; c < ch; c++) {
          var v0 = can[c][i], v1 = i + 1 < n ? can[c][i + 1] : v0;
          t += v0 + (v1 - v0) * f;
        }
        s[k] = t / ch;
      }
      return s;
    }

    /* Iguala el volumen (una canción bajita y otra fuerte suenan parecido) y
       suaviza la entrada y la salida, para que al dar la vuelta en el
       universo no se oiga un corte. */
    function pulir(pcm, gananciaMax, entra, sale) {
      var n = pcm.length, pico = 0, k;
      for (k = 0; k < n; k++) { var v = pcm[k] < 0 ? -pcm[k] : pcm[k]; if (v > pico) pico = v; }
      var g = pico > 0.01 ? Math.min(gananciaMax, 0.93 / pico) : 1;
      var fi = Math.max(1, Math.floor(entra * FREC)), fo = Math.max(1, Math.floor(sale * FREC));
      for (k = 0; k < n; k++) {
        var q = g;
        if (k < fi) q *= k / fi;
        if (k > n - fo) q *= (n - k) / fo;
        pcm[k] *= q;
      }
      return pcm;
    }

    function aBase64(blob, listo) {
      var lec = new FileReader();
      lec.onload = function (e) { listo(String(e.target.result).split(',')[1] || ''); };
      lec.onerror = function () { listo(''); };
      lec.readAsDataURL(blob);
    }

    function nombreMp3(n) {
      n = String(n || 'cancion').replace(/\.[a-z0-9]{2,5}$/i, '');
      return (n || 'cancion') + '.mp3';
    }

    /* Cuando un audio termina de prepararse (bien o mal) se avisa a quien
       lo estuviera esperando: el envío, si el cliente ya le dio a enviar. */
    function terminaPrep(cual) {
      if (cual === 'voz') VOZP.prep = false; else CANC.prep = false;
      escribirEstado();
      if (cual !== 'voz') pintarCancion();
      var q = ESPERAN; ESPERAN = [];
      q.forEach(function (fn) { try { fn(cual); } catch (e) {} });
    }

    /* ---- la canción ---- */
    document.getElementById('picksong').addEventListener('change', function (ev) {
      var f = ev.target.files && ev.target.files[0];
      ev.target.value = '';
      if (!f) return;
      /* Arriba de esto el teléfono se puede quedar sin memoria al abrirla. */
      if (f.size > 20 * 1024 * 1024) { aviso('Esa canción pesa demasiado; prueba con otra'); return; }
      prepararCancion(f);
    });

    function olvidarSubidaCancion() {
      UNI.cancionLista = false; UNI.cancionParte = 0;
      UNI.cancionSubida = ''; UNI.cancionHechos = [];
    }
    function soltarUrlCancion() {
      if (cancion && cancion.url) { try { URL.revokeObjectURL(cancion.url); } catch (e) {} }
    }

    function prepararCancion(f) {
      var t = ++CANC.turno;
      pararCancionDemo();
      if (CANC.obrero) { CANC.obrero.parar(); CANC.obrero = null; }
      if (CANC.url) { try { URL.revokeObjectURL(CANC.url); } catch (e) {} }
      CANC.pcm = null; CANC.dur = 0; CANC.url = ''; CANC.vista = 0;
      CANC.nombre = f.name || 'cancion'; CANC.archivo = f; CANC.fallo = false;
      CANC.prep = true; CANC.pc = 0;
      soltarUrlCancion();
      cancion = null; olvidarSubidaCancion();
      borQuitar('cancion'); escribirEstado();
      pintarCancion();

      var lec = new FileReader();
      lec.onerror = function () { if (t === CANC.turno) cancionCruda(f, t); };
      lec.onload = function (e) {
        if (t !== CANC.turno) return;
        decodificar(e.target.result, function (b) {
          if (t !== CANC.turno) return;
          try { CANC.pcm = aMono(b); } catch (err) { cancionCruda(f, t); return; }
          CANC.dur = CANC.pcm.length / FREC;
          try { CANC.url = URL.createObjectURL(f); } catch (err) { CANC.url = ''; }
          cortarCancion(0);
        }, function () { if (t === CANC.turno) cancionCruda(f, t); });
      };
      lec.readAsArrayBuffer(f);
    }

    /* Rehace el mp3 desde el segundo que eligió el cliente. */
    function cortarCancion(desde) {
      if (!CANC.pcm) return;
      var t = ++CANC.turno;
      if (CANC.obrero) { CANC.obrero.parar(); CANC.obrero = null; }
      var total = CANC.pcm.length;
      /* Si la canción es apenas más larga que el tramo, va entera. */
      var largo = CANC.dur <= LARGO_CANCION + 10 ? CANC.dur : LARGO_CANCION;
      desde = Math.max(0, Math.min(Math.round(Number(desde) || 0), Math.floor(CANC.dur - largo)));
      CANC.vista = desde;
      var a = Math.floor(desde * FREC), n = Math.min(total - a, Math.floor(largo * FREC));
      /* Copia aparte: el obrero se la lleva y la original sigue para mover el tramo. */
      var trozo = pulir(CANC.pcm.slice(a, a + n), 2.5,
                        desde > 0 ? 0.7 : 0.03,              /* entra suave si no es el inicio */
                        a + n < total - FREC ? 2.2 : 0.3);   /* y se apaga si no es el final */
      CANC.prep = true; CANC.pc = 0;
      pintarCancion();
      CANC.obrero = aMp3(trozo, 96, function (pc) {
        if (t !== CANC.turno) return;
        CANC.pc = pc; pintarPcCancion();
      }, function (mp3) {
        if (t !== CANC.turno) return;
        CANC.obrero = null;
        aBase64(mp3, function (b64) {
          if (t !== CANC.turno) return;
          if (!b64) { cancionCruda(CANC.archivo, t); return; }
          soltarUrlCancion();
          cancion = { nombre: nombreMp3(CANC.nombre), mime: 'audio/mpeg', b64: b64,
                      desde: desde, largo: Math.round(n / FREC) };
          olvidarSubidaCancion();
          borPoner('cancion', { b64: b64, mime: 'audio/mpeg' });
          terminaPrep('cancion');
        });
      }, function () {
        if (t !== CANC.turno) return;
        CANC.obrero = null;
        cancionCruda(CANC.archivo, t);
      });
    }

    /* Si no se pudo rehacer, se sube como venía, con el tope de siempre. */
    function cancionCruda(f, t) {
      if (t !== CANC.turno) return;
      /* Falló al cambiar de parte, pero la parte de antes sigue sana: se
         queda esa, que pesa poco, en vez de subir la canción entera. */
      if (cancion && cancion.largo && cancion.mime === 'audio/mpeg') {
        CANC.vista = cancion.desde || 0;
        aviso('No pudimos cambiar la parte; se queda la que tenías');
        terminaPrep('cancion');
        return;
      }
      CANC.pcm = null;
      soltarUrlCancion();
      if (!f || f.size > CRUDA_MAX) {
        cancion = null; CANC.fallo = true;
        aviso('No pudimos preparar esa canción. Prueba con otra en mp3 de menos de 6 MB.');
        terminaPrep('cancion');
        return;
      }
      var lec = new FileReader();
      lec.onload = function (e) {
        if (t !== CANC.turno) return;
        cancion = { nombre: f.name, mime: f.type || 'audio/mpeg',
                    b64: String(e.target.result).split(',')[1] || '', desde: 0, largo: 0 };
        olvidarSubidaCancion();
        borPoner('cancion', { b64: cancion.b64, mime: cancion.mime });
        terminaPrep('cancion');
      };
      lec.onerror = function () {
        if (t !== CANC.turno) return;
        cancion = null; CANC.fallo = true;
        aviso('No pudimos leer esa canción; prueba con otra');
        terminaPrep('cancion');
      };
      lec.readAsDataURL(f);
    }

    function cuerpoCancion() {
      if (CANC.prep && !cancion) {
        return '<div class="vozlista cancion"><span class="ruedita"></span>'
          + '<div class="onda"><b class="c-nom">' + esc(CANC.nombre || 'Tu canción') + '</b>'
          + '<small id="cancPc">Preparando tu canción… ' + CANC.pc + '%</small></div></div>'
          + '<p class="nota">Puedes seguir con lo demás mientras tanto.</p>';
      }
      if (!cancion) {
        return '<button class="fantasma" onclick="elegirCancion()">+ Elegir una canción</button>'
          + '<p class="nota">Opcional. Eliges la parte que más te gusta y suena al abrir '
          + 'el universo.</p>';
      }
      var largo = cancion.largo || 0, desde = CANC.pcm ? CANC.vista : (cancion.desde || 0);
      var tramo = !!CANC.pcm && CANC.dur > LARGO_CANCION + 10;
      var h = '<div class="vozlista cancion">'
        + '<button class="play" id="cancPlay" onclick="oirCancion()">▶</button>'
        + '<div class="onda"><b class="c-nom">🎵 ' + esc(cancion.nombre) + '</b>'
        + '<small id="cancPc">' + (CANC.prep ? 'Preparando… ' + CANC.pc + '%'
            : largo ? 'Suenan ' + reloj(largo) + (tramo ? ', desde el ' + reloj(desde) : '')
            : 'Lista') + '</small></div>'
        + '<button class="x" onclick="quitarCancion()" title="Quitar">×</button></div>';
      if (tramo) {
        var tope = Math.floor(CANC.dur - LARGO_CANCION);
        h += '<div class="tramo"><div class="tramo-t"><span>¿Desde dónde empieza?</span>'
          + '<b id="cancTramo">' + reloj(desde) + ' – ' + reloj(desde + LARGO_CANCION) + '</b></div>'
          + '<input type="range" id="cancDesde" min="0" max="' + tope + '" step="1" value="'
          + desde + '" oninput="moverTramo(this.value)" onchange="fijarTramo(this.value)">'
          + '<p class="nota">Muévelo hasta tu parte favorita. Suena en bucle, '
          + 'con entrada y salida suaves.</p></div>';
      }
      h += '<button class="fantasma" onclick="elegirCancion()">↺ Cambiar de canción</button>';
      return h;
    }

    function pintarCancion() {
      var c = document.getElementById('cajaCancion');
      if (c) c.innerHTML = cuerpoCancion();
      pintarPlayCancion();
    }
    function pintarPcCancion() {
      var p = document.getElementById('cancPc');
      if (p) p.textContent = (cancion ? 'Preparando… ' : 'Preparando tu canción… ') + CANC.pc + '%';
      var e = document.getElementById('env-paso');
      if (e && ENV.esperaCancion) e.textContent = 'Preparando tu canción · ' + CANC.pc + '%';
    }

    window.elegirCancion = function () { document.getElementById('picksong').click(); };

    window.quitarCancion = function () {
      if (!confirm('¿Quitar la canción?')) return;
      CANC.turno++;
      pararCancionDemo();
      if (CANC.obrero) { CANC.obrero.parar(); CANC.obrero = null; }
      if (CANC.url) { try { URL.revokeObjectURL(CANC.url); } catch (e) {} }
      CANC.pcm = null; CANC.dur = 0; CANC.url = ''; CANC.archivo = null;
      CANC.fallo = false;
      soltarUrlCancion();
      cancion = null; olvidarSubidaCancion();
      borQuitar('cancion');
      terminaPrep('cancion');
    };

    window.moverTramo = function (v) {
      var d = Math.round(Number(v) || 0);
      var b = document.getElementById('cancTramo');
      if (b) b.textContent = reloj(d) + ' – ' + reloj(d + LARGO_CANCION);
    };
    window.fijarTramo = function (v) {
      var d = Math.round(Number(v) || 0);
      if (!CANC.pcm || d === CANC.vista) return;
      cortarCancion(d);
      /* Suena al soltar, desde donde quedó: así sabe qué parte eligió sin
         tener que buscar el botón. Viene de su dedo, así que el teléfono
         deja que suene. */
      oirCancion(true);
    };

    /* ---- escucharla antes de mandarla ---- */
    var REPC = null;
    function pintarPlayCancion() {
      var b = document.getElementById('cancPlay');
      if (b) b.textContent = (REPC && !REPC.paused) ? '⏸' : '▶';
    }
    function pararCancionDemo() {
      if (REPC && !REPC.paused) { try { REPC.pause(); } catch (e) {} }
    }
    function oirCancion(desdeTramo) {
      if (!cancion && !CANC.url) return;
      pararRepro();
      if (!REPC) {
        REPC = new Audio();
        REPC.addEventListener('timeupdate', function () {
          if (REPC.__fin && REPC.currentTime >= REPC.__fin) REPC.pause();
        });
        ['play', 'pause', 'ended'].forEach(function (ev) {
          REPC.addEventListener(ev, pintarPlayCancion);
        });
      }
      if (!REPC.paused && !desdeTramo) { REPC.pause(); return; }
      /* Con la canción original a mano se escucha desde el punto elegido al
         instante, sin esperar a que se rehaga; si no (volvió de un borrador),
         se escucha lo que se va a subir. */
      var src, desde = 0, fin = 0;
      if (CANC.url && CANC.pcm) {
        src = CANC.url; desde = CANC.vista;
        fin = desde + Math.min(LARGO_CANCION, CANC.dur);
      } else {
        if (!cancion.url) {
          try { cancion.url = URL.createObjectURL(aBlob(cancion.b64, cancion.mime)); }
          catch (e) { return; }
        }
        src = cancion.url;
      }
      REPC.__fin = fin;
      if (REPC.src !== src) REPC.src = src;
      function ir() { try { REPC.currentTime = desde; } catch (e) {} }
      if (REPC.readyState >= 1) ir();
      else REPC.addEventListener('loadedmetadata', function una() {
        REPC.removeEventListener('loadedmetadata', una); ir();
      });
      var p = REPC.play();
      if (p && p.catch) p.catch(function () {});
    }
    window.oirCancion = function () { oirCancion(false); };

    /* ================= la nota de voz =================
       Se graba con el micrófono del propio celular. Nada de subir archivos:
       el cliente toca, habla y suelta. Lo que grabe pesa poco (unos 15 KB por
       segundo) y va al universo como va la canción. */
    var GRAB = { rec: null, trozos: [], pista: null, desde: 0, reloj: null };

    function alternarVoz() {
      if (GRAB.rec) { pararVoz(); return; }
      pararRepro(); pararCancionDemo();
      if (!navigator.mediaDevices || !window.MediaRecorder) {
        aviso('Este navegador no deja grabar. Puedes mandarnos el audio por WhatsApp.');
        return;
      }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (pista) {
        GRAB.pista = pista;
        /* Cada teléfono graba en lo suyo: Android y PC en webm, el iPhone en
           mp4. Se le deja elegir al navegador y se guarda lo que diga. */
        var tipos = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
        var tipo = '';
        for (var i = 0; i < tipos.length; i++) {
          if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(tipos[i])) {
            tipo = tipos[i]; break;
          }
        }
        /* 64 kbps es de sobra para una voz y pesa la mitad de lo que el
           teléfono pone por su cuenta. Si el teléfono no acepta pedírselo,
           graba con lo suyo. */
        var opc = { audioBitsPerSecond: 64000 };
        if (tipo) opc.mimeType = tipo;
        try { GRAB.rec = new MediaRecorder(pista, opc); }
        catch (e) { GRAB.rec = tipo ? new MediaRecorder(pista, { mimeType: tipo }) : new MediaRecorder(pista); }
        GRAB.trozos = [];
        GRAB.desde = Date.now();
        GRAB.rec.ondataavailable = function (e) { if (e.data && e.data.size) GRAB.trozos.push(e.data); };
        GRAB.rec.onstop = guardarVoz;
        GRAB.rec.start();

        /* Un minuto de tope, y el botón contando: sin eso la gente graba tres
           minutos y luego la subida tarda una eternidad. */
        var b = document.getElementById('btnVoz');
        GRAB.reloj = setInterval(function () {
          var seg = Math.floor((Date.now() - GRAB.desde) / 1000);
          if (b) b.textContent = '⏹ Detener · ' + seg + 's';
          if (seg >= 60) pararVoz();
        }, 250);
        if (b) { b.classList.add('grabando'); b.textContent = '⏹ Detener · 0s'; }
      }).catch(function () {
        aviso('No nos diste permiso para el micrófono');
      });
    }

    function pararVoz() {
      clearInterval(GRAB.reloj);
      if (GRAB.rec && GRAB.rec.state !== 'inactive') GRAB.rec.stop();
      if (GRAB.pista) GRAB.pista.getTracks().forEach(function (t) { t.stop(); });
      GRAB.pista = null;
    }

    function guardarVoz() {
      var seg = (Date.now() - GRAB.desde) / 1000;
      var tipo = (GRAB.rec && GRAB.rec.mimeType) || 'audio/webm';
      var blob = new Blob(GRAB.trozos, { type: tipo });
      GRAB.rec = null;
      if (seg < 1 || !blob.size) { aviso('Muy cortito, inténtalo de nuevo'); pintar(); return; }

      var lec = new FileReader();
      lec.onload = function (e) {
        voz = { mime: tipo.split(';')[0], seg: seg,
                b64: String(e.target.result).split(',')[1],
                url: URL.createObjectURL(blob) };
        olvidarSubidaVoz();
        borPoner('voz', { b64: voz.b64, mime: voz.mime });
        guardarEstado();
        pintar();
        /* Y por detrás, a mp3, para que suene en cualquier teléfono. Si no
           se puede, se queda la grabación tal cual. */
        convertirVoz(blob);
      };
      lec.readAsDataURL(blob);
    }

    function olvidarSubidaVoz() {
      UNI.vozLista = false; UNI.vozParte = 0;
      UNI.vozSubida = ''; UNI.vozHechos = [];
    }

    function convertirVoz(blob) {
      var t = ++VOZP.turno;
      if (VOZP.obrero) { VOZP.obrero.parar(); VOZP.obrero = null; }
      VOZP.prep = true;
      function queda() { if (t === VOZP.turno) terminaPrep('voz'); }
      var lec = new FileReader();
      lec.onerror = queda;
      lec.onload = function (e) {
        if (t !== VOZP.turno) return;
        decodificar(e.target.result, function (b) {
          if (t !== VOZP.turno) return;
          var pcm;
          /* La voz se graba bajita casi siempre: se sube hasta tres veces. */
          try { pcm = pulir(aMono(b), 3, 0.04, 0.12); } catch (err) { queda(); return; }
          VOZP.obrero = aMp3(pcm, 64, function () {}, function (mp3) {
            if (t !== VOZP.turno) return;
            VOZP.obrero = null;
            aBase64(mp3, function (b64) {
              if (t !== VOZP.turno) return;
              if (b64 && voz) {
                voz.b64 = b64; voz.mime = 'audio/mpeg';
                olvidarSubidaVoz();
                borPoner('voz', { b64: b64, mime: 'audio/mpeg' });
              }
              terminaPrep('voz');
            });
          }, queda);
        }, queda);
      };
      lec.readAsArrayBuffer(blob);
    }

    /* ---- escucharlo antes de mandarlo ----
       Nadie manda una nota de voz sin oírla primero. Y casi nadie acierta a
       la primera: por eso "volver a grabarlo" tiene su propio botón y no hay
       que adivinar que la × sirve para eso. */
    var REPRO = null;

    function reloj(s) {
      s = Math.max(0, Math.round(s || 0));
      return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
    }

    function pintarVoz() {
      var b = document.getElementById('vozPlay');
      if (!b || !REPRO) return;
      b.textContent = REPRO.paused ? '▶' : '⏸';
      /* Chrome le pone duración "infinita" a lo que acaba de grabar, así que
         se usa lo que medimos nosotros mientras grababa. */
      var dur = (isFinite(REPRO.duration) && REPRO.duration) ? REPRO.duration
                                                             : (voz ? voz.seg : 0);
      var barra = document.getElementById('vozBarra');
      if (barra) barra.style.width = dur ? Math.min(100, (REPRO.currentTime / dur) * 100) + '%' : '0%';
      var t = document.getElementById('vozT');
      if (t) t.textContent = reloj(REPRO.currentTime);
    }

    function pararRepro() {
      if (REPRO && !REPRO.paused) { try { REPRO.pause(); } catch (e) {} }
      if (REPRO) REPRO.currentTime = 0;
    }

    window.alternarVoz = alternarVoz;

    window.oirVoz = function () {
      if (!voz) return;
      pararCancionDemo();
      if (!REPRO) {
        REPRO = new Audio();
        ['timeupdate', 'play', 'pause'].forEach(function (ev) {
          REPRO.addEventListener(ev, pintarVoz);
        });
        REPRO.addEventListener('ended', function () { REPRO.currentTime = 0; pintarVoz(); });
      }
      if (REPRO.src !== voz.url) REPRO.src = voz.url;
      if (REPRO.paused) {
        REPRO.play().catch(function () { aviso('No se pudo reproducir acá'); });
      } else REPRO.pause();
    };

    window.borrarVoz = function (otra) {
      if (!confirm(otra ? '¿Borrar este mensaje y grabar uno nuevo?'
                        : '¿Borrar tu mensaje grabado?')) return;
      pararRepro();
      if (voz && voz.url) { try { URL.revokeObjectURL(voz.url); } catch (e) {} }
      voz = null; REPRO = null;
      /* Si todavía se estaba pasando a mp3, eso ya no sirve. */
      VOZP.turno++;
      if (VOZP.obrero) { VOZP.obrero.parar(); VOZP.obrero = null; }
      olvidarSubidaVoz();
      borQuitar('voz');
      terminaPrep('voz');
      pintar();
      /* "Volver a grabarlo" arranca a grabar de una: es lo que quería hacer
         quien tocó ese botón, y pedirle un toque más sobra. */
      if (otra) setTimeout(alternarVoz, 150);
    };

    /* ---------- enviar ---------- */
    function enviar() {
      var l = lineas();
      if (!hayAlgo()) {
        aviso(MODO === 'catalogo' ? 'Elige al menos un diseño 🌻' : 'Elige al menos una flor 🌻');
        return;
      }

      var nom = G('nom').trim(), tel = G('tel').trim();
      if (nom.length < 2) { aviso('Escribe tu nombre para poder ubicarte'); return; }
      if (tel.replace(/\D/g, '').length < 6) { aviso('Falta tu número de teléfono'); return; }
      var entrega = G('entrega').trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(entrega)) { aviso('Elige para qué día lo necesitas'); return; }
      if (entrega < entregaMinima()) { aviso('Para ese día no llegamos. Elige desde el ' + fechaLarga(entregaMinima())); return; }
      var correo = G('correo').trim();
      if (correo && !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(correo)) { aviso('Revisa tu correo, parece que le falta algo'); return; }
      if (lleno(entrega)) { aviso('Ese día ya está lleno 😔 Elige otro o escríbenos por WhatsApp'); return; }
      /* Si va a tener tarjeta con nombres, que los haya revisado. */
      if ((G('para').trim() || G('de').trim() || G('msg').trim()) && !NOMBRES_OK) {
        aviso('Revisa cómo se va a leer tu tarjeta y marca la casilla 🙂');
        var pt = document.getElementById('prevTarjeta');
        if (pt && pt.scrollIntoView) pt.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      RETOMA = false;
      var btn = document.getElementById('btnSig');
      btn.disabled = true; btn.textContent = 'Enviando…';
      var atras = document.getElementById('btnAtras');
      if (atras) atras.disabled = true;
      /* La barra avanza por lo que PESA cada cosa, no por cuántas son: una
         foto son ciento cincuenta mil letras y un pedazo de canción,
         setecientas mil. Contando cosas, la barra corría con las fotos y se
         clavaba justo en la canción, que es lo más largo, y parecía colgada.
         Se cuenta lo que FALTA: si vuelve con cinco fotos ya subidas, la barra
         no arranca de cero otra vez. */
      var conUni = conFotos() && fotos.length;
      var pesoCan = conUni ? pesoAudio('cancion') : 0, pesoVoz = conUni ? pesoAudio('voz') : 0;
      abrirEnvio((conUni ? pesoPendiente() + (UNI.codigo ? 0 : PESO_CREAR) : 0) + PESO_PEDIDO);

      if (!UNI.marca) UNI.marca = marcaNueva();
      var ctx = {
        n: ++TANDA,
        /* El código va en el ctx desde el principio, no solo cuando hay
           fotos: si el cliente vuelve con universo ya creado pero acaba
           mandando el pedido sin fotos, antes el pedido se guardaba sin
           mencionarlo y el universo quedaba huérfano, sin que nadie supiera
           de quién era. */
        codigo: UNI.codigo,
        precio: total(),
        lineas: l.map(function (x) { return x.t; }),
        /* Los incluidos no viajan: los pone el servidor a partir de la
           presentación elegida, que es la única fuente fiable. */
        items: l.filter(function (x) { return x.tipo; })
                .map(function (x) { return { tipo: x.tipo, k: x.k, n: x.n }; }),
        color: color,
        nom: nom, tel: tel, msg: G('msg').trim(), entrega: entrega, correo: correo,
        para: G('para').trim(), de: G('de').trim(),
        tar: D.tarjetas[tarjeta] ? D.tarjetas[tarjeta].nombre : '',
        recordar: fechasARecordar(entrega),
        btn: btn,
        /* Lo que la barra contó para cada audio: si todavía se estaba
           preparando, al terminar se corrige con lo que pesa de verdad. */
        pesoCancion: pesoCan, pesoVoz: pesoVoz
      };
      if (ctx.color) ctx.lineas.push('Color: ' + ctx.color);

      if (conFotos() && fotos.length) {
        /* Si ya se creó antes (un reintento), se reanuda: crear otro dejaría
           un universo huérfano y le cambiaría el código al cliente. */
        if (UNI.codigo) { subirTodo(ctx); return; }
        acomodarNivel();       /* lo elegido, dentro de lo que trae su arreglo */
        google.script.run.withSuccessHandler(function (r) {
          if (ctx.n !== TANDA) return;
          UNI.codigo = r && r.codigo ? r.codigo : r;
          UNI.permiso = r && r.permiso ? r.permiso : '';
          UNI.hechas = 0;
          ctx.codigo = UNI.codigo;
          /* Sin esperar al siguiente rato: si se cae la señal justo acá, al
             volver se sigue con ESTE universo y no se crea otro. */
          escribirEstado();
          pasoEnvio('Tu ' + expeTxt().tu.slice(3) + ' ya existe', PESO_CREAR);
          subirTodo(ctx);
        }).withFailureHandler(function (e) { falla(ctx, e); })
          .crearUniverso({ cliente: ctx.nom, telefono: ctx.tel, para: ctx.para,
                           de: ctx.de, titulo: '', msg: ctx.msg,
                           tema: (D.temas && D.temas[tema]) ? D.temas[tema].nombre : '',
                           figuras: (juego >= 0 && D.juegos && D.juegos[juego] && expe === 'universo')
                                      ? D.juegos[juego].nombre : '',
                           tipo: expe, extra: (function () { var ex = {}; if ((expe === 'bitacora' || pase.indexOf('bitacora') >= 0) && desde) ex.desde = desde; if (publico) ex.publico = publico; if (pase.length) ex.pase = pase.slice(0, PASE_N - 1);
                             return Object.keys(ex).length ? ex : null; })(),
                           abre: abre, correo: ctx.correo });
      } else {
        cerrar(ctx);
      }
    }

    /* ============ la pantalla de "ya va, aguanta un poquito" ============
       Subir ocho fotos y una canción desde un celular tarda. Sin nada en
       pantalla, el cliente cree que se colgó, cierra y pierde el pedido a
       medio subir. Así ve que pasa algo, cuánto falta, y de paso se le
       agradece, que es el único momento en que uno tiene su atención. */
    var ENV = { frase: 0, reloj: null, pasos: 0, hecho: 0, esperaCancion: false };

    var FRASES = [
      'Tu detalle ya va en camino 🌻',
      'Cada flor se hace a mano, una por una.',
      'Gracias por confiarnos algo tan tuyo.',
      'Estamos guardando tus fotos con cuidado.',
      'Un ratito más y listo.',
      'Detrás de esto hay un chico armando flores.',
      'Vale la pena esperar lo que se hace despacio.',
      'Ya casi. No cierres la pantalla.'
    ];

    /* Cerrar la pestaña a media subida se puede recuperar —el borrador está
       guardado— pero conviene que el cliente sepa que va a costarle. El aviso
       solo sale mientras hay un envío en curso. */
    window.addEventListener('beforeunload', function (ev) {
      if (!ENV.reloj) return;
      ev.preventDefault();
      ev.returnValue = '';
    });

    function abrirEnvio(cuantos) {
      ENV.pasos = cuantos; ENV.hecho = 0; ENV.frase = 0;
      var caja = document.getElementById('enviando');
      caja.classList.add('on');
      document.getElementById('barra').style.display = 'none';
      pasoEnvio('Preparando tu pedido');
      document.getElementById('env-frase').textContent = FRASES[0];

      clearInterval(ENV.reloj);
      ENV.reloj = setInterval(function () {
        var f = document.getElementById('env-frase');
        if (!f) return;
        f.classList.add('va');
        setTimeout(function () {
          ENV.frase = (ENV.frase + 1) % FRASES.length;
          f.textContent = FRASES[ENV.frase];
          f.classList.remove('va');
        }, 450);
      }, 3400);
    }

    function pasoEnvio(texto, peso) {
      if (peso) ENV.hecho += peso;
      var p = document.getElementById('env-paso');
      if (p) p.textContent = texto;
      var b = document.getElementById('env-barra');
      /* Nunca llega al 100% hasta que de verdad terminó: una barra llena que
         sigue esperando es peor que no tener barra. */
      if (b) b.style.width = Math.min(94, 6 + (ENV.hecho / Math.max(1, ENV.pasos)) * 88) + '%';
    }

    function cerrarEnvio(lleno) {
      clearInterval(ENV.reloj);
      ENV.reloj = null;   /* y con eso se apaga el aviso de "no cierres" */
      var b = document.getElementById('env-barra');
      if (b && lleno) b.style.width = '100%';
      setTimeout(function () {
        document.getElementById('enviando').classList.remove('on');
      }, lleno ? 420 : 0);
    }

    /* Los errores del servidor están escritos para quien programa. Al cliente
       hay que decirle qué le pasa a ÉL y qué puede hacer. */
    function enCristiano(e) {
      var m = String((e && e.message) || '');
      if (/ya fue revisad/i.test(m))
        return 'Ya estábamos preparando este detalle, así que no admite cambios. '
             + 'Escríbenos por WhatsApp y lo vemos.';
      if (/permiso/i.test(m) || /No encontré el universo/i.test(m))
        return 'Perdimos el hilo de este envío. Toca "Empezar de nuevo" y lo mandamos limpio.';
      if (/8 fotos/i.test(m))
        return 'Ya llegaron todas tus fotos. Toca "Empezar de nuevo" si quieres cambiarlas.';
      if (/ocupado/i.test(m) || /muchos pedidos/i.test(m))
        return 'Hay mucha gente pidiendo ahora mismo. Espera un momento y vuelve a darle.';
      if (/pesa demasiado/i.test(m)) return 'Uno de tus archivos pesa demasiado.';
      return 'No se pudo enviar. Revisa tu conexión y vuelve a darle.';
    }

    /* Errores de los que no se sale reintentando con el mismo universo: por
       más veces que le dé, va a leer siempre lo mismo. En vez de dejarlo
       encerrado, se suelta el universo viejo y el siguiente intento empieza
       uno nuevo con sus mismas fotos. */
    function sinSalida(e) {
      var m = String((e && e.message) || '');
      return /ya fue revisad/i.test(m) || /permiso/i.test(m)
          || /No encontré el universo/i.test(m) || /8 fotos/i.test(m);
    }

    function soltarUniverso() {
      UNI.codigo = ''; UNI.permiso = '';
      UNI.cancionLista = false; UNI.vozLista = false;
      UNI.cancionParte = 0; UNI.vozParte = 0;
      UNI.cancionSubida = ''; UNI.cancionHechos = [];
      UNI.vozSubida = ''; UNI.vozHechos = [];
      UNI.marca = marcaNueva();
      fotos.forEach(function (f) { f.subida = false; });
      escribirEstado();
    }

    function falla(ctx, e) {
      if (ctx.n !== TANDA) return;
      TANDA++;                 /* lo que siguiera en el aire ya no cuenta */
      cerrarEnvio(false);
      document.getElementById('barra').style.display = '';
      ctx.btn.disabled = false; ctx.btn.textContent = 'Reintentar';
      var atras = document.getElementById('btnAtras');
      if (atras) atras.disabled = false;
      if (sinSalida(e)) soltarUniverso();
      else { UNI.fallos++; if (UNI.fallos >= 3) soltarUniverso(); escribirEstado(); }
      RETOMA = true;           /* para que salga el cartel con "Empezar de nuevo" */
      pintar();
      aviso(enCristiano(e));
    }

    /* El botón de tirarlo todo y empezar limpio. Sin esto, un borrador que
       por lo que sea no se puede mandar deja al cliente encerrado tres días:
       vuelve, le sale el mismo error, y no tiene ninguna forma de salir. */
    window.empezarDeNuevo = function () {
      if (!confirm('¿Empezar tu pedido de cero? Se borra lo que tenías guardado.')) return;
      borVaciar();
      try { location.reload(); } catch (e) {}
    };

    /* ============ subir: todo a la vez, por cuatro carriles ============
       Antes iba en fila: las fotos de tres en tres, después la canción pedazo
       por pedazo esperando cada respuesta, después la voz. Una canción de
       doce pedazos eran doce viajes de ida y vuelta a Google uno detrás de
       otro, y eso era casi todo el "demora demasiado".

       Ahora fotos y pedazos de audio salen juntos, cuatro a la vez, y cuando
       un audio tiene todos sus pedazos arriba se le pide al servidor que los
       junte. Más de cuatro no ayuda: el cuello pasa a ser la subida del propio
       celular. Si la canción todavía se está preparando cuando el cliente le
       da a enviar, las fotos no la esperan: van subiendo mientras tanto. */
    var TROZO = 700000;
    var A_LA_VEZ = 4;
    var PESO_CREAR = 90000, PESO_JUNTAR = 90000, PESO_PEDIDO = 60000;
    /* Lo que pesa una canción que todavía se está preparando (minuto y medio
       en mp3, en letras); se corrige cuando se sabe lo de verdad. */
    var PESO_CANCION_EST = 1500000;

    function nuevaSubida() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function pesoAudio(cual) {
      var a = cual === 'voz' ? voz : cancion;
      if (UNI[cual + 'Lista']) return 0;
      if (!a) return (cual === 'cancion' && CANC.prep) ? PESO_CANCION_EST + PESO_JUNTAR : 0;
      var partes = Math.max(1, Math.ceil(a.b64.length / TROZO)), p = PESO_JUNTAR;
      var hechos = UNI[cual + 'Hechos'] || [];
      for (var i = 0; i < partes; i++) {
        if (hechos.indexOf(i) < 0) p += Math.min(TROZO, a.b64.length - i * TROZO);
      }
      return p;
    }

    function pesoPendiente() {
      var p = 0;
      fotos.forEach(function (f) { if (!f.subida) p += f.b64.length; });
      return p + pesoAudio('cancion') + pesoAudio('voz');
    }

    function subirTodo(ctx) {
      ctx.codigo = UNI.codigo;
      var cod = UNI.codigo;
      var cola = [], enVuelo = 0, roto = false;
      var AUD = {};
      var nFotos = 0, fotosListas = 0;

      fotos.forEach(function (f, i) {
        if (f.subida) return;
        nFotos++;
        /* El orden en que las puso: como suben a la vez, la que llega
           primero no tiene por qué ser la primera. */
        cola.push({ foto: f, orden: i });
      });

      /* Un audio entra a la cola cuando está listo para subir. Si todavía
         se está preparando, entra cuando termine. */
      function ponerAudio(cual) {
        if (AUD[cual]) return;
        var a = cual === 'voz' ? voz : cancion;
        if (!a || !a.b64 || UNI[cual + 'Lista']) return;
        if (!UNI[cual + 'Subida']) UNI[cual + 'Subida'] = nuevaSubida();
        var st = AUD[cual] = { a: a, sub: UNI[cual + 'Subida'], faltan: 0, rondas: 0,
                               total: Math.max(1, Math.ceil(a.b64.length / TROZO)),
                               listo: false, fallo: false, juntando: false };
        var hechos = UNI[cual + 'Hechos'];
        for (var i = 0; i < st.total; i++) {
          if (hechos.indexOf(i) < 0) { cola.push({ cual: cual, i: i }); st.faltan++; }
        }
        escribirEstado();
        /* Todos arriba de una vuelta anterior: solo falta juntarlos. */
        if (!st.faltan) juntar(cual);
      }

      function pesoDe(x) {
        if (x.foto) return x.foto.b64.length;
        var a = AUD[x.cual].a;
        return Math.min(TROZO, a.b64.length - x.i * TROZO);
      }

      function rotulo() {
        if (nFotos && fotosListas < nFotos) return 'Fotos · ' + fotosListas + ' de ' + nFotos;
        if (CANC.prep && !AUD.cancion) return 'Preparando tu canción · ' + CANC.pc + '%';
        if (AUD.cancion && !AUD.cancion.listo && !AUD.cancion.fallo) return 'Guardando tu canción';
        if (VOZP.prep && !AUD.voz) return 'Preparando tu mensaje';
        if (AUD.voz && !AUD.voz.listo && !AUD.voz.fallo) return 'Guardando tu mensaje';
        return 'Ya casi';
      }
      function avanza(peso) {
        ENV.esperaCancion = CANC.prep && !AUD.cancion;
        pasoEnvio(rotulo(), peso);
      }

      function lanzar() {
        if (roto || ctx.n !== TANDA) return;
        while (enVuelo < A_LA_VEZ && cola.length) mandar(cola.shift());
        revisar();
      }

      function mandar(x) {
        enVuelo++;
        if (x.foto) {
          var f = x.foto;
          google.script.run.withSuccessHandler(function () {
            enVuelo--;
            /* Si el universo sigue siendo el mismo, la foto ya está arriba
               aunque esta tanda se haya dado por perdida: no se vuelve a
               mandar en el reintento. */
            if (UNI.codigo === cod && !f.subida) { f.subida = true; escribirEstado(); }
            if (ctx.n !== TANDA) return;
            fotosListas++;
            UNI.hechas = fotosListas;
            avanza(f.b64.length);
            lanzar();
          }).withFailureHandler(function (e) {
            enVuelo--;
            if (roto || ctx.n !== TANDA) return;
            roto = true;
            falla(ctx, e);
          }).subirFotoUniverso(cod, f.b64, f.txt, UNI.permiso,
                               /* la marca de ESTA foto: si el reenvío la trae
                                  otra vez, el servidor la reconoce y no la
                                  duplica */
                               cod + ':' + f.id, x.orden);
          return;
        }
        var st = AUD[x.cual], a = st.a;
        var trozo = a.b64.slice(x.i * TROZO, (x.i + 1) * TROZO);
        google.script.run.withSuccessHandler(function () {
          enVuelo--;
          var hechos = UNI[x.cual + 'Hechos'];
          if (UNI[x.cual + 'Subida'] === st.sub && hechos.indexOf(x.i) < 0) {
            hechos.push(x.i); escribirEstado();
          }
          if (ctx.n !== TANDA) return;
          st.faltan--;
          avanza(trozo.length);
          if (st.faltan <= 0 && !st.fallo) juntar(x.cual);
          lanzar();
        }).withFailureHandler(function () {
          enVuelo--;
          if (ctx.n !== TANDA) return;
          fallaAudio(x.cual);
          lanzar();
        }).subirTrozoAudio(cod, x.i, st.total, trozo, a.mime, a.nombre || '',
                           UNI.permiso, x.cual, st.sub);
      }

      /* Si un audio no sube, NO se tira el pedido abajo: se avisa y se sigue.
         Vale más un pedido sin música que ningún pedido. */
      function fallaAudio(cual) {
        var st = AUD[cual];
        if (!st || st.fallo || st.listo) return;
        st.fallo = true;
        if (cual === 'voz') ctx.sinVoz = true; else ctx.sinCancion = true;
        var sobra = PESO_JUNTAR;
        for (var k = cola.length - 1; k >= 0; k--) {
          if (cola[k].cual === cual) { sobra += pesoDe(cola[k]); cola.splice(k, 1); }
        }
        avanza(sobra);
      }

      function juntar(cual) {
        var st = AUD[cual];
        if (!st || st.juntando || st.listo || st.fallo) return;
        st.juntando = true;
        enVuelo++;
        google.script.run.withSuccessHandler(function (r) {
          enVuelo--;
          st.juntando = false;
          var hecho = !!r && !r.faltan;
          if (hecho && UNI[cual + 'Subida'] === st.sub) { UNI[cual + 'Lista'] = true; escribirEstado(); }
          if (ctx.n !== TANDA) return;
          if (!hecho) {
            /* Al servidor le faltan pedazos: se mandan solo esos, otra vez.
               Dos vueltas como mucho; si no, se sigue sin este audio. */
            var faltan = (r && r.faltan) || [];
            if (++st.rondas > 2 || !faltan.length) { fallaAudio(cual); lanzar(); return; }
            var hechos = UNI[cual + 'Hechos'], extra = 0;
            faltan.forEach(function (i) {
              i = Math.round(Number(i));
              if (!(i >= 0 && i < st.total)) return;
              var p = hechos.indexOf(i);
              if (p >= 0) hechos.splice(p, 1);
              cola.push({ cual: cual, i: i }); st.faltan++;
              extra += Math.min(TROZO, st.a.b64.length - i * TROZO);
            });
            ENV.pasos += extra;
            escribirEstado();
            lanzar();
            return;
          }
          st.listo = true;
          avanza(PESO_JUNTAR);
          lanzar();
        }).withFailureHandler(function () {
          enVuelo--;
          st.juntando = false;
          if (ctx.n !== TANDA) return;
          fallaAudio(cual);
          lanzar();
        }).juntarAudio(cod, st.total, st.a.mime, st.a.nombre || '', UNI.permiso, cual, st.sub);
      }

      function revisar() {
        if (roto || ctx.n !== TANDA || ctx.cerrando) return;
        if (enVuelo || cola.length) return;
        /* Un audio que todavía se prepara: se espera, con la barra diciendo
           qué pasa, en vez de cerrar el pedido sin él. */
        if ((CANC.prep && !AUD.cancion) || (VOZP.prep && !AUD.voz)) { avanza(0); return; }
        for (var k in AUD) if (!AUD[k].listo && !AUD[k].fallo) return;
        ctx.cerrando = true;
        ENV.esperaCancion = false;
        cerrar(ctx);
      }

      /* Cuando termine de prepararse un audio, entra a la cola. */
      function alPreparar(cual) {
        if (roto || ctx.n !== TANDA || ctx.cerrando) return;
        /* La barra contaba con un tamaño estimado; ahora se sabe el real. */
        if (cual === 'cancion') {
          ENV.pasos += pesoAudio('cancion') - ctx.pesoCancion;
          if (!cancion && CANC.fallo) ctx.sinCancion = true;
        } else {
          ENV.pasos += pesoAudio('voz') - ctx.pesoVoz;
        }
        ponerAudio(cual);
        if ((cual === 'cancion' && VOZP.prep && !AUD.voz) ||
            (cual === 'voz' && CANC.prep && !AUD.cancion)) ESPERAN.push(alPreparar);
        lanzar();
      }

      if (CANC.prep || VOZP.prep) ESPERAN.push(alPreparar);
      if (!CANC.prep) ponerAudio('cancion');
      if (!VOZP.prep) ponerAudio('voz');

      avanza(0);
      lanzar();
    }

    function cerrar(ctx) {
      if (ctx.n !== TANDA) return;
      if (UNI.enviado) { exito(ctx, ctx.precio); return; }
      if (!ctx.codigo) ctx.codigo = UNI.codigo;
      pasoEnvio('Anotando tu pedido');
      /* Antes se mandaba y se daba por bueno sin esperar respuesta: si fallaba,
         el cliente veía "¡Pedido enviado!" y el pedido no existía en ningún lado. */
      google.script.run.withSuccessHandler(function (r) {
        if (ctx.n !== TANDA) return;
        UNI.enviado = true;
        ctx.seg = urlSeguimiento((r && r.id) || UNI.marca, r && r.seg);
        /* Se acabó: el borrador se tira entero. Dejarlo sería ofrecerle al
           cliente retomar un pedido que ya está hecho. */
        borVaciar();
        exito(ctx, r && r.precio ? r.precio : ctx.precio);
      }).withFailureHandler(function (e) { falla(ctx, e); })
        .guardarPedido({
          /* La marca la decide el navegador y viaja con cada reintento: el
             servidor reconoce el pedido y no lo anota dos veces. El detalle y
             la coletilla del universo los arma el servidor. */
          marca: UNI.marca, codigo: ctx.codigo, permiso: UNI.permiso, entrega: ctx.entrega, correo: ctx.correo,
          fecha: '', cliente: ctx.nom, telefono: ctx.tel,
          precio: ctx.precio, tarjeta: ctx.tar, color: ctx.color, items: ctx.items,
          origen: ORIGEN, recordar: ctx.recordar
        });
    }

    function exito(ctx, precio) {
      cerrarEnvio(true);
      var texto = 'Hola Ruway! Armé mi pedido:\n' + ctx.lineas.join('\n')
        + (ctx.tar ? '\nTarjeta: ' + ctx.tar : '')
        + (ctx.codigo ? '\nCódigo de mi ' + expeTxt().tu.slice(3) + ': ' + ctx.codigo : '')
        + (ctx.codigo && abre ? '\nSe abre el ' + fechaLarga(abre) : '')
        + (ctx.entrega ? '\nPara el: ' + fechaLarga(ctx.entrega) : '')
        + '\nEstimado: ' + S(precio)
        + (ctx.para ? '\n\nPara: ' + ctx.para : '')
        + (ctx.msg ? '\nDedicatoria: ' + ctx.msg : '')
        + (ctx.nom ? '\n\nSoy ' + ctx.nom : '')
        + (ORIGEN && /^[A-Z]{2,3}-/.test(ORIGEN) ? '\nVengo de un regalo (' + ORIGEN + ')' : '')
        + (ctx.seg ? '\n\nMi seguimiento: ' + ctx.seg : '');
      var enlace = 'https://wa.me/' + (D.whatsapp || '') + '?text=' + encodeURIComponent(texto);

      document.getElementById('barra').style.display = 'none';
      document.getElementById('pasos').style.display = 'none';
      document.getElementById('lema').textContent = '¡Gracias!';
      /* El botón de WhatsApp es un enlace que el cliente toca. Abrirlo solo,
         después de subir seis fotos, lo bloquean todos los navegadores del
         celular porque ya no viene de un gesto suyo. */
      document.getElementById('app').innerHTML =
        '<div class="fin"><span class="em">🌻</span><b>¡Pedido enviado!</b>'
        + (ctx.codigo
            ? 'Guarda el código de ' + expeTxt().tu + ':<div class="cod">' + ctx.codigo + '</div>'
              + (abre ? '<p class="nota">Se abre el <b>' + fechaLarga(abre)
                  + '</b>. Hasta entonces solo verá la cuenta regresiva.</p>' : '')
              + '<p class="nota">Vamos a revisar que tus fotos se vean bien antes de imprimir la tarjeta.</p>'
            : '')
        + (ctx.seg
            ? '<div class="seg-caja"><b>📦 Sigue tu pedido</b><span>En este enlace ves en qué va, y '
              + 'cuando esté listo, la foto de cómo quedó. Guárdalo.</span>'
              + '<a href="' + esc(ctx.seg) + '" target="_blank" rel="noopener">Abrir mi seguimiento</a></div>'
            : '')
        + (ctx.sinCancion
            ? '<p class="nota">La canción no se pudo subir; la coordinamos por WhatsApp.</p>' : '')
        + (ctx.sinVoz
            ? '<p class="nota">Tu mensaje de voz no se pudo subir; lo coordinamos por WhatsApp.</p>' : '')
        + (D.whatsapp
            ? '<a class="wa-fin" href="' + enlace + '" target="_blank" rel="noopener">'
              + 'Mandarnos el pedido por WhatsApp</a>'
              + '<p class="nota">Ya lo tenemos anotado. Este mensaje es para que quede en tu chat.</p>'
            : '<p class="nota">Ya lo tenemos anotado. Te escribimos para confirmar.</p>')
        + '</div>';
    }

    /* ---------- arrancar ---------- */
    (function () {
      var cab = document.querySelector('header img');
      var dst = document.getElementById('env-logo');
      if (cab && cab.src && dst) {
        dst.src = cab.src; dst.style.display = '';
        var flor = document.getElementById('env-flor');
        if (flor) flor.style.display = 'none';
      }
    })();

    if (!D.cats.length && !D.agr.length) {
      document.getElementById('app').innerHTML =
        '<div class="vacio">Estamos preparando el catálogo.<br>Escríbenos por WhatsApp '
        + 'y lo armamos contigo.</div>';
      document.getElementById('barra').style.display = 'none';
    } else {
      /* Primero se mira si quedó algo a medias en este teléfono. Y hay un
         perro guardián de tres segundos: leer ocho fotos y una canción de
         IndexedDB tarda en un teléfono viejo, y si una lectura se queda sin
         contestar —pasa al volver de segundo plano en iPhone— la pantalla se
         quedaba vacía para siempre. Pasados los tres segundos se pinta el
         formulario igual y el cliente al menos puede trabajar. */
      var yaPinte = false;
      function arrancar(habia) {
        if (yaPinte) return;
        yaPinte = true;
        pintar();
        if (!habia) return;
        if (RETOMA) aviso('Seguimos donde lo dejaste 🌻');
        else aviso('Te devolvimos tu pedido a medio armar');
      }
      setTimeout(function () { arrancar(false); }, 3000);
      restaurar(arrancar);
    }
  
}
arrancar();
</script>
</body>
</html>
