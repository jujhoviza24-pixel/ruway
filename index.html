<script>

/* ---------------- el puente con Apps Script ----------------
   Esta página está en GitHub y los datos están en Google. Un navegador no
   deja leer de otro dominio así como así, con dos excepciones que acá se
   aprovechan:

   · Una etiqueta <script> puede cargar de donde sea. Por eso lo que se LEE
     viene como JavaScript que llama a una función nuestra (se le dice
     JSONP, y funciona en todos los teléfonos, viejos incluidos).

   · Un POST con el cuerpo en texto plano se manda sin pedir permiso
     previo. Por eso lo que se ESCRIBE (el pedido, las fotos, la canción)
     va por ahí: una foto no cabe en una dirección.
   ------------------------------------------------------------ */
var API = "https://script.google.com/macros/s/AKfycbym_HuTN7HjpEy3IkKwvdamuJtExLvVnUJt83-vWxhhUR1kNx_hfNzd6GC53nNc-jYOGQ/exec";
var _n = 0;

function pedirJSONP(fn, args, ok, mal) {
  var nombre = '__ruway' + (++_n);
  var t = document.createElement('script');
  var reloj = setTimeout(function () { limpiar(); mal && mal(new Error('Sin respuesta')); }, 25000);

  function limpiar() {
    clearTimeout(reloj);
    try { delete window[nombre]; } catch (e) { window[nombre] = undefined; }
    if (t.parentNode) t.parentNode.removeChild(t);
  }
  window[nombre] = function (r) {
    limpiar();
    if (r && r.ok) ok && ok(r.r);
    else mal && mal(new Error((r && r.error) || 'Error'));
  };
  t.onerror = function () { limpiar(); mal && mal(new Error('No se pudo conectar')); };
  t.src = API + (API.indexOf('?') >= 0 ? '&' : '?')
    + 'vista=api&rfn=' + encodeURIComponent(fn)
    + '&rargs=' + encodeURIComponent(JSON.stringify(args || []))
    + '&rcb=' + nombre;
  document.head.appendChild(t);
}

function mandarPOST(fn, args, ok, mal) {
  fetch(API, {
    method: 'POST',
    /* texto plano a propósito: con 'application/json' el navegador pide
       permiso antes y Apps Script no sabe contestar a esa pregunta */
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args || [] })
  })
    .then(function (r) { return r.json(); })
    .then(function (r) {
      if (r && r.ok) ok && ok(r.r);
      else mal && mal(new Error((r && r.error) || 'Error'));
    })
    .catch(function (e) { mal && mal(e); });
}

/* Imita a google.script.run para que el resto de la página no cambie. */
function runner() {
  var r = { ok: null, mal: null };
  r.withSuccessHandler = function (f) { r.ok = f; return r; };
  r.withFailureHandler = function (f) { r.mal = f; return r; };

  var porPOST = ['crearUniverso', 'subirFotoUniverso', 'subirCancionUniverso', 'guardarPedido'];
  porPOST.forEach(function (fn) {
    r[fn] = function () {
      var args = Array.prototype.slice.call(arguments);
      mandarPOST(fn, args, function (x) { r.ok && r.ok(x); },
                           function (e) { r.mal && r.mal(e); });
    };
  });
  return r;
}
var google = { script: { get run() { return runner(); } } };

/* ---------------- la puerta de entrada ----------------
   Esta misma dirección atiende tres cosas, según lo que traiga detrás:

     sin nada        el formulario de pedidos
     ?c=MMALSQ       el universo de esa tarjeta  ->  u.html, acá al lado
     ?cat=Navidad    ese catálogo

   Va así porque los QR de las tarjetas ya impresas apuntan acá, y un archivo
   que solo supiera hacer una cosa las dejaría muertas.
   -------------------------------------------------------- */
var D = null;

function irseA(destino, aviso) {
  var c = document.getElementById('cargando');
  if (c) c.querySelector('p').textContent = aviso;
  location.replace(destino);
}

function arrancar() {
  var q = new URLSearchParams(location.search);

  /* El universo se abre en u.html, que está en este mismo GitHub: no lleva el
     cartel de "denunciar abuso" de Apps Script, que es de lo último que uno
     quiere ver en un regalo. */
  var pide = ['c', 'cod', 'rcod', 'para', 'rpara', 'msg', 'rmsg',
              'de', 'rde', 'tit', 'rtit', 'tem', 'rtem'];
  for (var i = 0; i < pide.length; i++) {
    if (q.get(pide[i])) {
      irseA('u.html' + location.search, 'Abriendo tu universo');
      return;
    }
  }

  var cat = q.get('cat');
  if (cat) {
    irseA(API + '?vista=catalogo&rcod=' + encodeURIComponent(cat), 'Abriendo el catálogo');
    return;
  }
  pedirJSONP('datos', [], function (d) {
    D = d;
    document.getElementById('cargando').style.display = 'none';
    prender();
  }, function () {
    document.getElementById('cargando').innerHTML =
      '<p>No pudimos cargar el catálogo.<br>Revisa tu conexión y vuelve a intentar.</p>'
      + '<button onclick="location.reload()">Reintentar</button>';
  });
}

</script>
<script>
function prender(){

    /* ---------- lo que el cliente va eligiendo ---------- */
    var sel = {};        /* código de flor  -> cuántas   */
    var op = {};         /* nombre agregado -> cuántos   */
    var abierto = {};    /* categoría -> acordeón abierto */
    var catFlor = 0;     /* pestaña de flores activa      */
    var color = '', tarjeta = 0, fotos = [], cancion = null, paso = 0, ultimoPaso = -1;
    var tema = 0;        /* qué diseño de universo eligió */
    var MAX = 8;

    var ICONO = { 'Presentación': '🎁', 'Forro': '📄', 'Cintas y lazos': '🎀',
                  'Peluches': '🧸', 'Adornos': '✨', 'Personalizado': '✍️' };
    var ICONO_FLOR = { 'Girasoles': '🌻', 'Tulipanes': '🌷', 'Margaritas': '🌼',
                       'Rosas': '🌹', 'Hojas y ramitas': '🌿', 'Otras': '💐' };

    /* la presentación va sola en su propio paso; el resto, en el acordeón */
    var PRES = null, RESTO = [];
    D.agr.forEach(function (a) {
      if (a.cat === 'Presentación') PRES = a; else RESTO.push(a);
    });

    var PASOS = [];
    if (PRES && PRES.items.length) PASOS.push('pres');
    if (D.cats.length) PASOS.push('flores');
    if (RESTO.length) PASOS.push('detalles');
    if (D.tarjetas.length) PASOS.push('tarjeta');
    PASOS.push('final');

    var S = function (n) { return 'S/ ' + (Number(n) || 0).toFixed(2); };
    var esc = function (t) {
      return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
    };
    var ico = function (cat) { return ICONO[cat] || '✨'; };
    var icoF = function (cat) { return ICONO_FLOR[cat] || '🌸'; };

    function aviso(m) {
      var t = document.getElementById('toast');
      t.textContent = m; t.classList.add('on');
      clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('on'); }, 2600);
    }
    function conFotos() {
      var t = D.tarjetas[tarjeta];
      return !!(t && /foto/i.test(t.nombre));
    }
    function catDe(nombre) {
      for (var i = 0; i < D.agr.length; i++)
        for (var j = 0; j < D.agr[i].items.length; j++)
          if (D.agr[i].items[j].k === nombre) return D.agr[i];
      return null;
    }

    /* ---------- dibujar una tarjeta con foto ---------- */
    /* Toda la tarjeta suma: el dedo casi nunca cae justo en el botón. */
    function tarjetaHtml(it, n, unica, fn, emoji) {
      var mas = fn + '(\'' + esc(it.k) + '\',1)';
      var h = '<div class="tarj' + (n ? ' on' : '') + '" onclick="' + mas + '">';
      h += '<div class="im">';
      h += it.f ? '<img src="' + esc(it.f) + '" loading="lazy" alt="' + esc(it.n) + '">'
                : (emoji || '🎁');
      if (n) h += '<span class="bg">' + (unica ? '✓' : n) + '</span>';
      if (it.f) h += '<button class="zoom" onclick="event.stopPropagation();lupa(\''
        + esc(it.f) + '\')">🔍</button>';
      h += '</div>';
      h += '<div class="nb"><b>' + esc(it.n) + '</b><small>'
        + (it.p > 0 ? '+ ' + S(it.p) : 'sin costo extra') + '</small>'
        + (it.d ? '<em>' + esc(it.d) + '</em>' : '') + '</div>';
      if (unica) {
        h += '<button class="add">' + (n ? '✓ Elegido' : 'Elegir') + '</button>';
      } else if (n) {
        h += '<div class="mm" onclick="event.stopPropagation()">'
          + '<button onclick="' + fn + '(\'' + esc(it.k) + '\',-1)">−</button>'
          + '<span>' + n + '</span>'
          + '<button onclick="' + mas + '">+</button></div>';
      } else {
        h += '<button class="add">+ Agregar</button>';
      }
      return h + '</div>';
    }

    /* ---------- cada paso ---------- */
    function pintarPres() {
      var h = '<div class="titulo">¿Cómo lo quieres?</div>'
        + '<p class="bajada">Elige la presentación. Después escoges las flores.</p>'
        + '<div class="rej">';
      PRES.items.forEach(function (it) {
        h += tarjetaHtml(it, op[it.k] ? 1 : 0, true, 'elegirUnica', ico('Presentación'));
      });
      return h + '</div>';
    }

    function pintarFlores() {
      var g = D.cats[catFlor] || D.cats[0];
      var h = '<div class="titulo">Elige tus flores</div>'
        + '<p class="bajada">Toca la foto para agregar. Puedes mezclar las que quieras.</p>';

      if (D.cats.length > 1) {
        h += '<div class="chips">';
        D.cats.forEach(function (c, i) {
          var n = 0;
          c.items.forEach(function (it) { n += sel[it.k] || 0; });
          h += '<button class="chip' + (i === catFlor ? ' on' : '') + '" onclick="verCat(' + i + ')">'
            + icoF(c.cat) + ' ' + esc(c.cat) + (n ? ' · ' + n : '') + '</button>';
        });
        h += '</div>';
      }

      h += '<div class="rej">';
      g.items.forEach(function (it) {
        h += tarjetaHtml(it, sel[it.k] || 0, false, 'masFlor', icoF(g.cat));
      });
      h += '</div>';

      if (D.colores.length) {
        h += '<h2>Color principal</h2><div class="chips">';
        D.colores.forEach(function (c) {
          h += '<button class="chip' + (color === c ? ' on' : '') + '" onclick="setColor(\''
            + esc(c) + '\')">' + esc(c) + '</button>';
        });
        h += '</div><p class="nota">Opcional. Si no eliges, lo armamos con los colores de la foto.</p>';
      }
      return h;
    }

    function pintarDetalles() {
      var h = '<div class="titulo">Dale tu toque</div>'
        + '<p class="bajada">Todo esto es opcional. Abre solo lo que te interese.</p>';
      RESTO.forEach(function (g) {
        var elegidos = [];
        g.items.forEach(function (it) {
          var n = op[it.k] || 0;
          if (n) elegidos.push(n > 1 ? n + ' × ' + it.n : it.n);
        });
        var ab = !!abierto[g.cat];
        h += '<div class="acc' + (ab ? ' on' : '') + '">'
          + '<button class="cab" onclick="abrir(\'' + esc(g.cat) + '\')">'
          + '<span class="ic">' + ico(g.cat) + '</span>'
          + '<span class="t"><b>' + esc(g.cat) + '</b><small' + (elegidos.length ? ' class="si"' : '')
          + '>' + (elegidos.length ? esc(elegidos.join(', '))
                                   : g.items.length + ' opciones') + '</small></span>'
          + '<span class="fl">▾</span></button>'
          + '<div class="cuerpo">';

        g.items.forEach(function (it) {
          var n = op[it.k] || 0;
          h += '<div class="opt' + (n ? ' on' : '') + '">'
            + '<div class="mini"' + (it.f ? ' onclick="lupa(\'' + esc(it.f) + '\')"' : '') + '>'
            + (it.f ? '<img src="' + esc(it.f) + '" loading="lazy" alt="">' : ico(g.cat))
            + '</div>'
            + '<div class="t" onclick="' + (g.unica ? 'elegirUnica' : 'masOp') + '(\''
            + esc(it.k) + '\',1)"><b>' + esc(it.n) + '</b>'
            + '<small>' + (it.d ? esc(it.d) : '')
            + '<i>' + (it.p > 0 ? '+ ' + S(it.p) : 'sin costo extra') + '</i></small></div>';
          if (g.unica) {
            h += '<div class="marca-si" onclick="elegirUnica(\'' + esc(it.k) + '\',1)">✓</div>';
          } else {
            h += '<div class="cont"><button onclick="masOp(\'' + esc(it.k) + '\',-1)">−</button>'
              + '<span>' + n + '</span>'
              + '<button onclick="masOp(\'' + esc(it.k) + '\',1)">+</button></div>';
          }
          h += '</div>';
        });
        h += '</div></div>';
      });
      return h;
    }

    function pintarTarjeta() {
      var h = '<div class="titulo">Tarjeta virtual</div>'
        + '<p class="bajada">Un QR en la tarjeta. Al escanearlo se abre un universo animado '
        + 'con tu dedicatoria.</p><div class="chips">';
      D.tarjetas.forEach(function (t, i) {
        h += '<button class="chip' + (tarjeta === i ? ' on' : '') + '" onclick="setTarjeta(' + i + ')">'
          + esc(t.nombre) + (t.precio ? ' +' + S(t.precio) : '') + '</button>';
      });
      h += '</div>';

      if (conFotos()) {
        h += '<h2>Tus fotos (hasta ' + MAX + ')</h2>';
        if (fotos.length) {
          h += '<div class="card">';
          fotos.forEach(function (f, i) {
            h += '<div class="foto"><img src="' + f.url + '" onclick="lupa(\'\',' + i + ')">'
              + '<div class="d"><textarea placeholder="¿Qué quieres que diga esta foto?" '
              + 'oninput="txt(' + i + ',this.value)">' + esc(f.txt) + '</textarea></div>'
              + '<button class="x" onclick="quitarFoto(' + i + ')">×</button></div>';
          });
          h += '</div>';
        }
        if (fotos.length < MAX)
          h += '<button class="fantasma" onclick="document.getElementById(\'pick\').click()">'
            + (fotos.length ? '+ Agregar más fotos' : '+ Elegir mis fotos') + '</button>';
        h += '<p class="nota">Puede ser una sola o las ocho. A cada una le escribes su frase.</p>';

        /* El diseño del universo. Se ve antes de elegirlo: cada muestra está
           pintada con los tres colores de verdad de ese tema, así que lo que
           el cliente toca es lo que va a recibir. Si solo hay un diseño
           cargado no se pregunta nada, se usa ese y punto. */
        var TE = D.temas || [];
        if (TE.length > 1) {
          h += '<h2>El diseño de tu universo</h2>'
            + '<p class="nota">Así se va a ver al escanear el QR. Toca el que más te guste.</p>'
            + '<div class="temas">';
          TE.forEach(function (t, i) {
            h += '<button class="tema' + (tema === i ? ' on' : '') + '" onclick="setTema(' + i + ')">'
              + '<span class="cielo" style="background:radial-gradient(circle at 50% 60%,'
              + esc(t.c1) + ' 0%,' + esc(t.c3) + ' 55%,#0b0e14 100%)">'
              + '<i style="background:' + esc(t.c2) + '"></i>'
              + '<i style="background:' + esc(t.c1) + '"></i>'
              + '<i style="background:' + esc(t.c3) + '"></i></span>'
              + '<b>' + esc(t.nombre) + '</b>'
              + '<small>' + esc(t.portada || '') + '</small></button>';
          });
          h += '</div>';
        }

        h += '<h2>Canción de fondo</h2>'
          + '<button class="fantasma" onclick="document.getElementById(\'picksong\').click()">'
          + (cancion ? '🎵 ' + esc(cancion.nombre) : '+ Elegir una canción') + '</button>'
          + '<p class="nota">Opcional, hasta 6 MB. Suena al abrir el universo.</p>'
          + '<div class="aviso"><b>Antes de imprimir</b>Revisamos que tus fotos se vean bien '
          + 'y te avisamos. Nadie más que nosotros ve el enlace hasta que te lo entregamos.</div>';
      }
      return h;
    }

    function pintarFinal() {
      var l = lineas();
      var h = '<div class="titulo">Tu detalle</div>';
      if (!l.length) {
        h += '<div class="vacio">Todavía no elegiste nada.<br>Vuelve atrás y arma tu detalle.</div>';
      } else {
        h += '<div class="res">';
        l.forEach(function (x) {
          h += '<div class="r"><span>' + esc(x.t) + '</span><b>' + S(x.p) + '</b></div>';
        });
        h += '<div class="r tt"><span>Total estimado</span><b>' + S(total()) + '</b></div></div>';
      }

      h += '<h2>Para quién es</h2>'
        + '<input type="text" id="para" placeholder="Para mamá" value="' + esc(G('para')) + '">'
        + '<input type="text" id="de" placeholder="De parte de..." style="margin-top:10px" value="'
        + esc(G('de')) + '">'
        + '<label>Dedicatoria</label>'
        + '<textarea id="msg" placeholder="Lo que quieres que diga la tarjeta">'
        + esc(G('msg')) + '</textarea>';

      h += '<h2>Tus datos</h2>'
        + '<input type="text" id="nom" placeholder="Tu nombre" value="' + esc(G('nom')) + '">'
        + '<input type="tel" id="tel" inputmode="numeric" placeholder="Tu WhatsApp" '
        + 'style="margin-top:10px" value="' + esc(G('tel')) + '">'
        + '<p class="nota">El precio es una estimación. Te confirmamos por WhatsApp antes de empezar.</p>';
      return h;
    }

    /* los campos de texto se guardan al salir del paso, para no perderlos */
    var campos = {};
    function G(id) { return campos[id] || ''; }
    function recordar() {
      ['para', 'de', 'msg', 'nom', 'tel'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) campos[id] = el.value;
      });
    }

    /* ---------- el pedido, en líneas ---------- */
    function lineas() {
      var l = [];
      D.cats.forEach(function (g) {
        g.items.forEach(function (it) {
          var n = sel[it.k] || 0;
          if (n) l.push({ t: n + ' × ' + it.n, p: it.p * n, tipo: 'flor', k: it.k, n: n });
        });
      });
      D.agr.forEach(function (g) {
        g.items.forEach(function (it) {
          var n = op[it.k] || 0;
          if (n) l.push({ t: (n > 1 ? n + ' × ' : '') + it.n, p: it.p * n,
                          tipo: 'opcion', k: it.k, n: n });
        });
      });
      if (D.tarjetas[tarjeta] && D.tarjetas[tarjeta].precio)
        l.push({ t: D.tarjetas[tarjeta].nombre, p: D.tarjetas[tarjeta].precio,
                 tipo: 'tarjeta', k: D.tarjetas[tarjeta].nombre, n: 1 });
      return l;
    }
    function total() {
      var t = 0;
      lineas().forEach(function (x) { t += x.p; });
      return Math.round(t * 100) / 100;
    }
    function hayFlores() {
      var n = 0;
      for (var k in sel) n += sel[k] || 0;
      return n > 0;
    }

    /* ---------- pintar todo ---------- */
    function pintar() {
      var q = PASOS[paso], h = '';
      if (q === 'pres') h = pintarPres();
      else if (q === 'flores') h = pintarFlores();
      else if (q === 'detalles') h = pintarDetalles();
      else if (q === 'tarjeta') h = pintarTarjeta();
      else h = pintarFinal();

      document.getElementById('app').innerHTML = h;
      /* Solo al cambiar de paso. Antes subía en CADA toque: agregabas la
         tercera flor y la página te devolvía arriba del todo. */
      if (paso !== ultimoPaso) { window.scrollTo(0, 0); ultimoPaso = paso; }

      var p = '';
      PASOS.forEach(function (x, i) {
        p += '<i class="' + (i === paso ? 'on' : (i < paso ? 'hecho' : '')) + '"></i>';
      });
      document.getElementById('pasos').innerHTML = p;

      document.getElementById('tot').textContent = S(total());
      document.getElementById('rot').textContent = (q === 'final') ? 'Total estimado' : 'Va quedando';
      var atras = document.getElementById('btnAtras');
      atras.hidden = (paso === 0);
      var sig = document.getElementById('btnSig');
      sig.textContent = (q === 'final') ? 'Enviar mi pedido' : 'Continuar';
    }

    /* ---------- acciones ---------- */
    window.verCat = function (i) { catFlor = i; pintar(); };
    window.masFlor = function (k, d) { sel[k] = Math.max(0, (sel[k] || 0) + d); pintar(); };
    window.masOp = function (k, d) { op[k] = Math.max(0, (op[k] || 0) + d); pintar(); };
    window.elegirUnica = function (k) {
      var g = catDe(k);
      if (g) g.items.forEach(function (it) { if (it.k !== k) delete op[it.k]; });
      if (op[k]) delete op[k]; else op[k] = 1;
      pintar();
    };
    window.abrir = function (c) { abierto[c] = !abierto[c]; pintar(); };
    window.setColor = function (c) { color = (color === c ? '' : c); pintar(); };
    window.setTarjeta = function (i) { tarjeta = i; pintar(); };
    window.setTema = function (i) { tema = i; pintar(); };
    window.txt = function (i, v) { fotos[i].txt = v; };
    window.quitarFoto = function (i) { fotos.splice(i, 1); pintar(); };

    window.lupa = function (url, i) {
      var src = (i === undefined) ? url : fotos[i].url;
      if (!src) return;
      document.getElementById('lupaImg').src = src;
      document.getElementById('lupa').classList.add('on');
    };
    window.cerrarLupa = function () { document.getElementById('lupa').classList.remove('on'); };

    window.irA = function (d) {
      recordar();
      if (d > 0 && PASOS[paso] === 'flores' && !hayFlores()) {
        aviso('Elige al menos una flor 🌻'); return;
      }
      if (d > 0 && PASOS[paso] === 'final') { enviar(); return; }
      paso = Math.max(0, Math.min(PASOS.length - 1, paso + d));
      pintar();
    };

    /* ---------- fotos y canción ---------- */
    document.getElementById('pick').addEventListener('change', function (ev) {
      var fs = Array.prototype.slice.call(ev.target.files || []);
      fs.slice(0, MAX - fotos.length).forEach(leerFoto);
      ev.target.value = '';
    });

    function leerFoto(file) {
      var lec = new FileReader();
      lec.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          var k = Math.min(1, 900 / Math.max(img.width, img.height));
          var cv = document.createElement('canvas');
          cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          var url = cv.toDataURL('image/jpeg', 0.78);
          fotos.push({ url: url, b64: url.split(',')[1], txt: '' });
          pintar();
        };
        img.src = e.target.result;
      };
      lec.readAsDataURL(file);
    }

    document.getElementById('picksong').addEventListener('change', function (ev) {
      var f = ev.target.files && ev.target.files[0];
      ev.target.value = '';
      if (!f) return;
      if (f.size > 6 * 1024 * 1024) { aviso('La canción pesa más de 6 MB'); return; }
      var lec = new FileReader();
      lec.onload = function (e) {
        cancion = { nombre: f.name, mime: f.type || 'audio/mpeg',
                    b64: String(e.target.result).split(',')[1] };
        pintar();
      };
      lec.readAsDataURL(f);
    });

    /* Lo que ya se logró, para que un reintento reanude en vez de repetir. */
    var UNI = { codigo: '', permiso: '', hechas: 0, cancionLista: false, enviado: false };

    /* ---------- enviar ---------- */
    function enviar() {
      var l = lineas();
      if (!hayFlores()) { aviso('Elige al menos una flor 🌻'); return; }

      var nom = G('nom').trim(), tel = G('tel').trim();
      if (nom.length < 2) { aviso('Escribe tu nombre para poder ubicarte'); return; }
      if (tel.replace(/\D/g, '').length < 6) { aviso('Falta tu número de teléfono'); return; }

      var btn = document.getElementById('btnSig');
      btn.disabled = true; btn.textContent = 'Enviando…';
      var atras = document.getElementById('btnAtras');
      if (atras) atras.disabled = true;

      var ctx = {
        precio: total(),
        lineas: l.map(function (x) { return x.t; }),
        items: l.map(function (x) { return { tipo: x.tipo, k: x.k, n: x.n }; }),
        color: color,
        nom: nom, tel: tel, msg: G('msg').trim(),
        para: G('para').trim(), de: G('de').trim(),
        tar: D.tarjetas[tarjeta] ? D.tarjetas[tarjeta].nombre : '',
        btn: btn
      };
      if (ctx.color) ctx.lineas.push('Color: ' + ctx.color);

      if (conFotos() && fotos.length) {
        /* Si ya se creó antes (un reintento), se reanuda: crear otro dejaría
           un universo huérfano y le cambiaría el código al cliente. */
        if (UNI.codigo) { subirFotoUni(ctx, UNI.hechas); return; }
        google.script.run.withSuccessHandler(function (r) {
          UNI.codigo = r && r.codigo ? r.codigo : r;
          UNI.permiso = r && r.permiso ? r.permiso : '';
          UNI.hechas = 0;
          subirFotoUni(ctx, 0);
        }).withFailureHandler(function (e) { falla(ctx, e); })
          .crearUniverso({ cliente: ctx.nom, telefono: ctx.tel, para: ctx.para,
                           de: ctx.de, titulo: '',
                           tema: (D.temas && D.temas[tema]) ? D.temas[tema].nombre : '' });
      } else {
        cerrar(ctx);
      }
    }

    function falla(ctx, e) {
      ctx.btn.disabled = false; ctx.btn.textContent = 'Reintentar';
      var atras = document.getElementById('btnAtras');
      if (atras) atras.disabled = false;
      aviso('No se pudo enviar: ' + (e && e.message ? e.message : ''));
    }

    function subirFotoUni(ctx, i) {
      ctx.codigo = UNI.codigo;
      if (i >= fotos.length) { subirCancion(ctx); return; }
      ctx.btn.textContent = 'Subiendo foto ' + (i + 1) + ' de ' + fotos.length + '…';
      google.script.run.withSuccessHandler(function () {
        UNI.hechas = i + 1; subirFotoUni(ctx, i + 1);
      }).withFailureHandler(function (e) { falla(ctx, e); })
        .subirFotoUniverso(ctx.codigo, fotos[i].b64, fotos[i].txt, UNI.permiso);
    }

    function subirCancion(ctx) {
      if (!cancion || UNI.cancionLista) { cerrar(ctx); return; }
      ctx.btn.textContent = 'Subiendo la canción…';
      google.script.run.withSuccessHandler(function () {
        UNI.cancionLista = true; cerrar(ctx);
      }).withFailureHandler(function () {
        ctx.sinCancion = true; cerrar(ctx);
      }).subirCancionUniverso(ctx.codigo, cancion.b64, cancion.mime,
                              cancion.nombre, UNI.permiso);
    }

    function cerrar(ctx) {
      if (UNI.enviado) { exito(ctx, ctx.precio); return; }
      ctx.btn.textContent = 'Guardando tu pedido…';
      /* Antes se mandaba y se daba por bueno sin esperar respuesta: si fallaba,
         el cliente veía "¡Pedido enviado!" y el pedido no existía en ningún lado. */
      google.script.run.withSuccessHandler(function (r) {
        UNI.enviado = true;
        exito(ctx, r && r.precio ? r.precio : ctx.precio);
      }).withFailureHandler(function (e) { falla(ctx, e); })
        .guardarPedido({
          fecha: '', cliente: ctx.nom, telefono: ctx.tel,
          detalle: ctx.lineas.join(', ')
            + (ctx.codigo ? ' · universo ' + ctx.codigo
                + ((D.temas && D.temas[tema]) ? ' (' + D.temas[tema].nombre + ')' : '') : ''),
          precio: ctx.precio, tarjeta: ctx.tar, color: ctx.color, items: ctx.items
        });
    }

    function exito(ctx, precio) {
      var texto = 'Hola Ruway! Armé mi pedido:\n' + ctx.lineas.join('\n')
        + (ctx.tar ? '\nTarjeta: ' + ctx.tar : '')
        + (ctx.codigo ? '\nCódigo de mi universo: ' + ctx.codigo : '')
        + '\nEstimado: ' + S(precio)
        + (ctx.para ? '\n\nPara: ' + ctx.para : '')
        + (ctx.msg ? '\nDedicatoria: ' + ctx.msg : '')
        + (ctx.nom ? '\n\nSoy ' + ctx.nom : '');
      var enlace = 'https://wa.me/' + (D.whatsapp || '') + '?text=' + encodeURIComponent(texto);

      document.getElementById('barra').style.display = 'none';
      document.getElementById('pasos').style.display = 'none';
      document.getElementById('lema').textContent = '¡Gracias!';
      /* El botón de WhatsApp es un enlace que el cliente toca. Abrirlo solo,
         después de subir seis fotos, lo bloquean todos los navegadores del
         celular porque ya no viene de un gesto suyo. */
      document.getElementById('app').innerHTML =
        '<div class="fin"><span class="em">🌻</span><b>¡Pedido enviado!</b>'
        + (ctx.codigo
            ? 'Guarda el código de tu universo:<div class="cod">' + ctx.codigo + '</div>'
              + '<p class="nota">Vamos a revisar que tus fotos se vean bien antes de imprimir la tarjeta.</p>'
            : '')
        + (ctx.sinCancion
            ? '<p class="nota">La canción no se pudo subir; la coordinamos por WhatsApp.</p>' : '')
        + (D.whatsapp
            ? '<a class="wa-fin" href="' + enlace + '" target="_blank" rel="noopener">'
              + 'Mandarnos el pedido por WhatsApp</a>'
              + '<p class="nota">Ya lo tenemos anotado. Este mensaje es para que quede en tu chat.</p>'
            : '<p class="nota">Ya lo tenemos anotado. Te escribimos para confirmar.</p>')
        + '</div>';
    }

    /* ---------- arrancar ---------- */
    if (!D.cats.length && !D.agr.length) {
      document.getElementById('app').innerHTML =
        '<div class="vacio">Estamos preparando el catálogo.<br>Escríbenos por WhatsApp '
        + 'y lo armamos contigo.</div>';
      document.getElementById('barra').style.display = 'none';
    } else {
      pintar();
    }
  
}
arrancar();
</script>
</body>
</html>
