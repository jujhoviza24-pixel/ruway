   · Una etiqueta <script> puede cargar de donde sea. Por eso lo que se LEE
     viene como JavaScript que llama a una función nuestra (se le dice
     JSONP, y funciona en todos los teléfonos, viejos incluidos).

   · Un POST con el cuerpo en texto plano se manda sin pedir permiso
     previo. Por eso lo que se ESCRIBE (el pedido, las fotos, la canción)
     va por ahí: una foto no cabe en una dirección.
   ------------------------------------------------------------ */
var API = "https://script.google.com/macros/s/AKfycbym_HuTN7HjpEy3IkKwvdamuJtExLvVnUJt83-vWxhhUR1kNx_hfNzd6GC53nNc-jYOGQ/exec";
var _n = 0;

/* Cuarenta segundos, no veinticinco. Google apaga el script cuando lleva
   rato sin usarse, y la primera visita del día tiene que esperar a que
   vuelva a encenderse: con veinticinco segundos se cortaba justo antes de
   tiempo y salía "revisa tu conexión" aunque la conexión estuviera bien. */
/* Pide algo y no se rinde a la primera.
   Desde el celular pasaba constantemente: la página se quedaba colgada, uno
   le daba a "Reintentar" y entraba al instante. Eso quiere decir que la
   petición no llegó nunca, no que no hubiera internet. Así que acá se hace
   solo lo que uno hacía a mano: a los doce segundos manda otra, sin cancelar
   la primera, y se queda con la que conteste antes. */
function pedirJSONP(fn, args, ok, mal) {
  var hecho = false, vivos = 0, fallos = 0;

  function terminar(bien, dato) {
    if (hecho) return;
    hecho = true;
    if (bien) ok && ok(dato); else mal && mal(dato);
  }

  function intento(esUltimo) {
    vivos++;
    var nombre = '__ruway' + (++_n);
    var t = document.createElement('script');

    function limpiar() {
      clearTimeout(refuerzo); clearTimeout(rendirse);
      try { delete window[nombre]; } catch (e) { window[nombre] = undefined; }
      if (t.parentNode) t.parentNode.removeChild(t);
    }
    function murio(e) {
      limpiar(); fallos++;
      /* Solo se da por perdido cuando han muerto TODOS los intentos: si uno
         falló pero otro sigue en camino, todavía hay esperanza. */
      if (fallos >= vivos) {
        if (!esUltimo) { setTimeout(function () { intento(true); }, 900); return; }
        terminar(false, e);
      }
    }

    window[nombre] = function (r) {
      limpiar();
      if (r && r.ok) terminar(true, r.r);
      else terminar(false, new Error((r && r.error) || 'Error'));
    };
    t.onerror = function () { murio(new Error('No se pudo conectar')); };

    /* El refuerzo: otra petición en paralelo, por si la primera se perdió. */
    var refuerzo = esUltimo ? 0 : setTimeout(function () { intento(true); }, 12000);
    var rendirse = setTimeout(function () { murio(new Error('Sin respuesta')); }, 45000);

    t.src = API + (API.indexOf('?') >= 0 ? '&' : '?')
      + 'vista=api&rfn=' + encodeURIComponent(fn)
      + '&rargs=' + encodeURIComponent(JSON.stringify(args || []))
      + '&rcb=' + nombre;
    document.head.appendChild(t);
  }

  intento(false);
}

/* Lo que se ESCRIBE (fotos, canción, nota de voz, el pedido).

   Tres cosas que antes no estaban y por las que el envío se quedaba colgado
   y luego decía "no se pudo enviar":

     · Un plazo. Sin AbortController, un fetch que se pierde en una red móvil
       no falla nunca: se queda esperando para siempre y el cliente ve la
       pantalla de envío sin avanzar hasta que se cansa y cierra.

     · Reintentos. Una subida que falla por un bache de red se reintenta sola
       tres veces, esperando cada vez un poco más. Casi todos los fallos de
       verdad son eso, un bache, y se arreglan al segundo intento.

     · Distinguir el fallo de red del fallo del servidor. Si el servidor dice
       "esa foto pesa demasiado", reintentar es perder el tiempo: eso se
       cuenta tal cual. Solo se reintenta lo que puede salir bien. */
function mandarPOST(fn, args, ok, mal, intento) {
  intento = intento || 1;
  var cuerpo = JSON.stringify({ fn: fn, args: args || [] });
  /* El plazo según lo que pesa: una foto no puede esperar dos minutos a que
     la den por perdida, y un pedazo de canción en una señal floja sí
     necesita su tiempo. Juntar la canción es trabajo del servidor y tarda
     aunque lo que viaje sea poco. */
  var plazo = fn === 'guardarPedido' ? 45000
            : fn === 'juntarAudio' ? 90000
            : Math.min(120000, 35000 + Math.round(cuerpo.length / 10));
  var corta = null, reloj = null;

  try { corta = new AbortController(); } catch (e) {}
  if (corta) reloj = setTimeout(function () { try { corta.abort(); } catch (e) {} }, plazo);

  function otraVez(e) {
    if (reloj) clearTimeout(reloj);
    if (intento >= 3) { mal && mal(e); return; }
    /* 1,5 s, luego 4 s: darle tiempo a la red a recomponerse */
    setTimeout(function () {
      mandarPOST(fn, args, ok, mal, intento + 1);
    }, intento === 1 ? 1500 : 4000);
  }

  fetch(API, {
    method: 'POST',
    /* texto plano a propósito: con 'application/json' el navegador pide
       permiso antes y Apps Script no sabe contestar a esa pregunta */
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: cuerpo,
    signal: corta ? corta.signal : undefined
  })
    .then(function (r) {
      if (!r.ok) throw new Error('El servidor contestó ' + r.status);
      return r.json();
    })
    .then(function (r) {
      if (reloj) clearTimeout(reloj);
      /* Los avisos salen FUERA de la cadena de promesas, a propósito.
         Estando dentro, cualquier tropiezo del código que recibe la respuesta
         caía en el .catch de abajo y se tomaba por un fallo de red: se
         reenviaba una petición que YA había salido bien, y con eso se
         duplicaba la foto, el pedido o el universo. Con el setTimeout(0) lo
         que pase al recibir es problema de quien recibe, no de la red. */
      if (r && r.ok) { var f = ok; setTimeout(function () { f && f(r.r); }, 0); return; }
      /* Esto lo dijo el servidor a propósito: no se reintenta. */
      var g = mal, fallo = new Error((r && r.error) || 'Error');
      setTimeout(function () { g && g(fallo); }, 0);
    })
    .catch(otraVez);
}

/* Imita a google.script.run para que el resto de la página no cambie. */
function runner() {
  var r = { ok: null, mal: null };
  r.withSuccessHandler = function (f) { r.ok = f; return r; };
  r.withFailureHandler = function (f) { r.mal = f; return r; };

  var porPOST = ['crearUniverso', 'subirFotoUniverso', 'subirCancionUniverso',
                 'subirVozUniverso', 'subirTrozoAudio', 'juntarAudio', 'guardarPedido'];
  porPOST.forEach(function (fn) {
    r[fn] = function () {
      var args = Array.prototype.slice.call(arguments);
      mandarPOST(fn, args, function (x) { r.ok && r.ok(x); },
                           function (e) { r.mal && r.mal(e); });
    };
  });
  return r;
}
var google = { script: { get run() { return runner(); } } };

/* ---------------- la puerta de entrada ----------------
   Esta misma dirección atiende tres cosas, según lo que traiga detrás:

     sin nada        el formulario de pedidos
     ?c=MMALSQ       el universo de esa tarjeta  ->  u.html, acá al lado
     ?cat=Navidad    ese catálogo

   Va así porque los QR de las tarjetas ya impresas apuntan acá, y un archivo
   que solo supiera hacer una cosa las dejaría muertas.

var D = null;

function irseA(destino, aviso) {
  var c = document.getElementById('cargando');
  if (c) c.querySelector('p').textContent = aviso;
  location.replace(destino);
}

function mostrarCatalogo(cat) {
  var aviso = document.querySelector('#cargando p');

  var t0 = Date.now();
  var contando = setInterval(function () {
    var seg = Math.round((Date.now() - t0) / 1000);
    if (!aviso) return;
    if (seg > 26) aviso.innerHTML = 'Está tardando más de lo normal<br>pero seguimos intentando';
    else if (seg > 12) aviso.innerHTML = 'Despertando el catálogo<br>un momentito más';
  }, 1000);
  pedirJSONP('catalogo', [cat], function (r) {
    clearInterval(contando);
    if (!r || !r.html) { sinCatalogo(); return; }
    /* Se reemplaza la página entera por el catálogo: es un documento completo,
       con su propio diseño para imprimir, y así se ve exactamente igual. */
    document.open(); document.write(r.html); document.close();
  }, function () { clearInterval(contando); sinCatalogo(); });

  function sinCatalogo() {
    var c = document.getElementById('cargando');
    if (!c) return;

      + '<button onclick="location.reload()">Reintentar</button>';

/* ---------------- el seguimiento del pedido ----------------
   Lo que más reclaman los clientes de florerías no es el precio: es no saber
   nada mientras esperan. Acá ven en qué va su pedido, la foto de cómo quedó
   y, si llevaba universo, si ya lo abrieron. */
var PASOS_SEG = [
  { e: 'Recibido', t: 'Recibimos tu pedido', i: '📥' },
  { e: 'Confirmado', t: 'Lo estamos haciendo a mano', i: '🌻' },
  { e: 'Listo', t: 'Listo · así quedó', i: '📷' },
  { e: 'En camino', t: 'En camino', i: '🛵' },
  { e: 'Entregado', t: 'Entregado', i: '✅' }
];
function escS(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function cuandoSeg(iso) {
  var d = new Date(iso);
  if (!iso || isNaN(d.getTime())) return '';
  try {
    return d.toLocaleString('es-PE', { timeZone: 'America/Lima', weekday: 'short', day: 'numeric',
                                       month: 'short', hour: 'numeric', minute: '2-digit' });
  } catch (e) { return d.toLocaleString(); }
}
function diaSeg(t) {
  /* [0-9] y no la barra con d: esto va dentro de una plantilla de texto y
     la barra se perdería al construir la página. */
  var m = /^([0-9]{4})-([0-9]{2})-([0-9]{2})$/.exec(String(t || ''));
  if (!m) return '';
  var MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto',
             'septiembre', 'octubre', 'noviembre', 'diciembre'];
  return (+m[3]) + ' de ' + MES[+m[2] - 1];
}
function mostrarSeguimiento(ref) {
  var c = document.getElementById('cargando');
  if (c) c.querySelector('p').textContent = 'Buscando tu pedido';
  document.getElementById('barra').style.display = 'none';
  document.getElementById('lema').textContent = 'Tu pedido';
  pedirJSONP('seguimiento', [ref], function (r) {
    if (!r || !r.ok) { sinSeguimiento(); return; }
    if (c) c.style.display = 'none';
    var hechos = {};
    (r.pasos || []).forEach(function (p) { hechos[p.e] = p; });
    var ultimo = -1;
    PASOS_SEG.forEach(function (p, i) { if (hechos[p.e]) ultimo = i; });
    var h = '<div class="seg"><p class="seg-hola">Hola' + (r.cliente ? ' ' + escS(r.cliente) : '') + ' 🌻</p>'
      + (r.entrega ? '<p class="seg-sub">Tu pedido es para el <b>' + diaSeg(r.entrega) + '</b></p>' : '')
      + '<ol class="seg-pasos">';
    PASOS_SEG.forEach(function (p, i) {
      var hecho = hechos[p.e];
      /* "En camino" y "Listo" son opcionales: si ya se entregó y no se
         marcaron, no se enseñan como pendientes. */
      if (!hecho && i < ultimo && (p.e === 'Listo' || p.e === 'En camino')) return;
      var clase = hecho ? (i === ultimo ? 'ahora' : 'hecho') : 'falta';
      h += '<li class="' + clase + '"><span class="ic">' + (hecho ? p.i : '·') + '</span><div>'
        + '<b>' + p.t + '</b>' + (hecho && hecho.t ? '<small>' + escS(cuandoSeg(hecho.t)) + '</small>' : '')
        + (p.e === 'Listo' && hecho && r.foto
            ? '<img class="seg-foto" src="' + escS(r.foto) + '" alt="Así quedó tu detalle">' : '')
        + '</div></li>';
    });
    h += '</ol>';
    if (r.foto && !hechos['Listo']) h += '<img class="seg-foto" src="' + escS(r.foto) + '" alt="">';
    h += '<div class="seg-caja"><b>Lo que pediste</b><span>' + escS(r.detalle || '—') + '</span></div>';
    var u = r.universo;
    if (u) {
      /* El universo, el árbol o la vela: cada uno dicho con sus palabras. */
      var vela = u.tipo === 'vela';
      h += '<div class="seg-caja uni"><b>' + (vela ? '🕯️ Tu vela' : u.tipo === 'arbol' ? '🎄 Tu árbol' : '🌌 Tu universo') + '</b>';
      if (!u.aprobado) h += '<span>' + (vela ? 'La' : 'Lo') + ' estamos revisando para que las fotos se vean perfectas.</span>';
      else {
        h += u.abierto ? '<span>💌 ' + (vela ? 'La abrieron' : 'Lo abrió') + ' el ' + escS(cuandoSeg(u.abierto)) + '</span>'
                       : '<span>' + (vela ? 'Todavía nadie la abre.' : 'Todavía no lo abre.') + ' Te avisamos cuando pase.</span>';
        if (u.corazones) h += '<span>' + (vela
          ? '🕯️ ' + u.corazones + (u.corazones === 1 ? ' vela encendida' : ' velas encendidas')
          : '❤️ Te mandó ' + u.corazones + (u.corazones === 1 ? ' corazón' : ' corazones')) + '</span>';
        if (u.ver) h += '<a href="' + escS(u.ver) + '" target="_blank" rel="noopener">Ver cómo quedó</a>';
      }
      h += '</div>';
    }
    if (r.whatsapp) h += '<a class="seg-wa" target="_blank" rel="noopener" href="https://wa.me/' + escS(r.whatsapp)
      + '?text=' + encodeURIComponent('Hola Ruway! Tengo una consulta sobre mi pedido') + '">¿Alguna duda? Escríbenos</a>';
    h += '<a class="seg-otro" href="' + escS(location.pathname) + '">Hacer otro pedido</a></div>';
    document.getElementById('app').innerHTML = h;
  }, sinSeguimiento);
  function sinSeguimiento() {
    var c2 = document.getElementById('cargando');
    if (!c2) return;
    c2.style.display = '';
    c2.innerHTML = '<p>No encontramos ese pedido.<br>Revisa el enlace o escríbenos por WhatsApp.</p>'
      + '<button onclick="location.reload()">Reintentar</button>';
  }
}

function arrancar() {
  var q = new URLSearchParams(location.search);

  /* El universo se abre en u.html, que está en este mismo GitHub: no lleva el
     cartel de "denunciar abuso" de Apps Script, que es de lo último que uno
     quiere ver en un regalo. */
  var pide = ['c', 'cod', 'rcod', 'para', 'rpara', 'msg', 'rmsg',
              'de', 'rde', 'tit', 'rtit', 'tem', 'rtem'];
  for (var i = 0; i < pide.length; i++) {
    if (q.get(pide[i])) {
      irseA('u.html' + location.search, 'Abriendo tu regalo');
      return;
    }
  }

  /* El catálogo también se queda en GitHub. Antes mandaba a la página de Apps
     Script, con su cartel de "Denunciar abuso" encima de cada foto; ahora se
     pide el catálogo ya armado y se dibuja acá mismo. Sus botones "Lo quiero"
     y "Hacer mi pedido" vuelven a esta misma página con ?pedir=. */
  var cat = q.get('cat');
  if (cat) { mostrarCatalogo(cat); return; }
  /* El seguimiento de un pedido: "?seg=PD-xxx.firma". */
  var seg = q.get('seg');
  if (seg) { mostrarSeguimiento(seg); return; }
  /* Google apaga el script cuando lleva rato sin usarse y la primera visita
     tiene que esperar a que despierte. Desde el celular eso se nota mucho más
     que desde una computadora. En vez de dejar al cliente mirando una flor
     que late, se le va contando: la espera se aguanta cuando uno sabe que
     algo está pasando. */
  var aviso = document.querySelector('#cargando p');
  var t0 = Date.now();
  var contando = setInterval(function () {
    var seg = Math.round((Date.now() - t0) / 1000);
    if (!aviso) return;
    if (seg > 26) aviso.innerHTML = 'Está tardando más de lo normal<br>pero seguimos intentando';
    else if (seg > 14) aviso.innerHTML = 'Despertando el catálogo<br>un momentito más';
    else if (seg > 6) aviso.textContent = 'Casi listo';
  }, 1000);

  pedirJSONP('datos', [], function (d) {
    clearInterval(contando);
    /* Si el catálogo llega vacío o a medias, prender() revienta en la primera
       línea — y para entonces la pantalla de carga ya se quitó, así que el
       cliente se queda mirando una página muerta sin nada que tocar. */
    if (!d || !d.cats || !d.agr) { noHayCatalogo(); return; }
    D = d;
    document.getElementById('cargando').style.display = 'none';
    try { prender(); } catch (e) { noHayCatalogo(); }
  }, noHayCatalogo);

  function noHayCatalogo() {
    clearInterval(contando);
    var c = document.getElementById('cargando');
    c.style.display = '';
    c.innerHTML =
      '<p>No pudimos cargar el catálogo.<br>Revisa tu conexión y vuelve a intentar.</p>'
      + '<button onclick="location.reload()">Reintentar</button>';
  }
}

      function salir(ok) {
        if (yaFue) return; yaFue = true; clearTimeout(corte);
        if (ok) BOR.db = pet.result; else BOR.roto = true;
        listo();
      }
      /* Si el navegador se queda pensando —pasa en modo privado y con el
         almacenamiento bloqueado— se sigue sin borrador antes que dejar al
         cliente mirando una pantalla en blanco. */
      var corte = setTimeout(function () { salir(false); }, 1500);
      pet.onupgradeneeded = function () {
        try { pet.result.createObjectStore('cosas'); } catch (e) {}
      };
      pet.onsuccess = function () { salir(true); };
      pet.onerror = function () { salir(false); };
      pet.onblocked = function () { salir(false); };
    }

    function borPoner(clave, valor) {
      if (!BOR.db) return;
      try {
        var tx = BOR.db.transaction('cosas', 'readwrite');
        var q = tx.objectStore('cosas').put(valor, clave);
        /* Que no haya sitio NO llega como excepción: llega después, en el
           propio pedido. Con el try/catch a secas la escritura se perdía sin
           que nadie se enterara, y al volver el cliente encontraba su pedido
           "guardado" pero sin fotos. Si no cabe, se apaga el borrador y se le
           dice que no cierre la pantalla, que es lo único que puede hacer. */
        q.onerror = tx.onabort = function () {
          var n = (q.error && q.error.name) || '';
          if (n === 'QuotaExceededError' || !n) {
            BOR.db = null; BOR.roto = true;
            aviso('No hay espacio en tu teléfono para guardar el borrador. '
                + 'No cierres esta pantalla hasta enviar.');
          }
        };
      } catch (e) {}
    }
    function borQuitar(clave) {
      if (!BOR.db) return;
      try { BOR.db.transaction('cosas', 'readwrite').objectStore('cosas')['delete'](clave); }
      catch (e) {}
    }
    function borLeer(clave, listo) {
      if (!BOR.db) { listo(null); return; }
      var p;
      try { p = BOR.db.transaction('cosas', 'readonly').objectStore('cosas').get(clave); }
      catch (e) { listo(null); return; }
      p.onsuccess = function () { listo(p.result || null); };
      p.onerror = function () { listo(null); };
    }
    function borVaciar() {
      clearTimeout(BOR.reloj);
      if (!BOR.db) return;
      try { BOR.db.transaction('cosas', 'readwrite').objectStore('cosas').clear(); }
      catch (e) {}
    }

    /* El estado pesa nada y cambia mucho: se junta un momento para no
       escribir veinte veces mientras alguien teclea su nombre. */
    function guardarEstado() {
      if (!BOR.db) return;
      clearTimeout(BOR.reloj);
      BOR.reloj = setTimeout(escribirEstado, 280);
    }
    function escribirEstado() {
      /* Se cancela lo que estuviera esperando: si no, tras cada foto se
         escribía dos veces, acá y 280 ms después. */
      clearTimeout(BOR.reloj);
      if (!BOR.db) return;
      leerCampos();
      borPoner('estado', {
        v: 1, cuando: Date.now(), paso: paso,
        sel: sel, op: op, color: color, tarjeta: tarjeta,
        temaN: (D.temas && D.temas[tema]) ? D.temas[tema].nombre : '',
        juegoN: (juego >= 0 && D.juegos && D.juegos[juego]) ? D.juegos[juego].nombre : '',
        expe: expe, desde: desde, publico: publico, pase: pase,
        campos: campos, marca: UNI.marca, abre: abre,
        modo: MODO, prod: prod, campSel: campSel,
        codigo: UNI.codigo, permiso: UNI.permiso, enviado: UNI.enviado,
        cancionLista: UNI.cancionLista, vozLista: UNI.vozLista,
        cancionParte: UNI.cancionParte, vozParte: UNI.vozParte,
        cancionSubida: UNI.cancionSubida, cancionHechos: UNI.cancionHechos,
        vozSubida: UNI.vozSubida, vozHechos: UNI.vozHechos,
        fotos: fotos.map(function (f) {
          return { id: f.id, txt: f.txt || '', subida: !!f.subida };
        }),
        cancion: cancion ? { nombre: cancion.nombre, mime: cancion.mime,
                             desde: cancion.desde || 0, largo: cancion.largo || 0 } : null,
        origen: ORIGEN, rec: REC, nombresOk: !!NOMBRES_OK,
        voz: voz ? { mime: voz.mime, seg: voz.seg } : null
      });
    }

    /* ---- volver ---- */
    function restaurar(listo) {
      borAbrir(function () {
        borLeer('estado', function (e) {
          var viejo = !e || e.v !== 1 || e.enviado ||
                      (Date.now() - (e.cuando || 0)) > BOR_DIAS * 86400000;
          if (viejo) { if (e) borVaciar(); listo(false); return; }

          sel = e.sel || {}; op = e.op || {};
          /* El catálogo pudo cambiar en estos días: si el taller quitó o
             renombró una flor, esa clave ya no existe. Dejarla puesta hacía
             que hayFlores() dijera que sí y lineas() no encontrara nada: el
             cliente veía "todavía no elegiste nada" con el botón de enviar
             activo, se creaba el universo, subía todo, y al final el servidor
             contestaba que el pedido llegó vacío. */
          sel = soloLasQueExisten(sel, D.cats);
          op  = soloLasQueExisten(op,  D.agr);
          color = e.color || ''; tarjeta = e.tarjeta || 0;
          /* Guardados por NOMBRE, no por posición: si el taller reordena los
             diseños, lo que eligió el cliente sigue siendo lo que eligió. */
          tema = porNombre(D.temas, e.temaN, 0);
          juego = porNombre(D.juegos, e.juegoN, -1);
          /* Si entró desde un árbol o una vela ("?x="), eso manda sobre el
             borrador: es lo que acaba de ver y le gustó. Y con ella sus
             colores, salvo que el borrador ya fuera de esa misma experiencia
             (ahí los colores los eligió él). Sin esto, una vela en memoria
             podía salir con los colores de "Flores Amarillas". */
          desde = /^\d{4}-\d{2}-\d{2}$/.test(String(e.desde || '')) ? e.desde : '';
          publico = PUBLICO_TXT[String(URLQ.get('seccion') || '').toLowerCase()] ? String(URLQ.get('seccion')).toLowerCase() : (PUBLICO_TXT[e.publico] ? e.publico : '');
          var xUrl = String(URLQ.get('x') || '').toLowerCase();
          if (EXPES.indexOf(xUrl) >= 0) { if (e.expe !== xUrl) temaDeExpe(); }
          else if (EXPES.indexOf(e.expe) >= 0) expe = e.expe;
          pase = (Array.isArray(e.pase) ? e.pase : []).filter(function (x, i, l) { return EXPES.indexOf(x) >= 0 && x !== expe && l.indexOf(x) === i; }).slice(0, PASE_N - 1);
          campos = e.campos || {};
          /* El camino que eligió y sus diseños, contra el catálogo de hoy. */
          MODO = (e.modo === 'catalogo' || e.modo === 'armar') ? e.modo : '';
          prod = {};
          Object.keys(e.prod || {}).forEach(function (k) {
            if (PRODS.some(function (x) { return x.k === k; }) && e.prod[k]) prod[k] = e.prod[k];
          });
          campSel = e.campSel || campSel;
          /* Si entró por el botón "Lo quiero" de un diseño, ese diseño manda
             sobre lo que tuviera guardado: es lo que acaba de elegir. */
          var pre = URLQ.get('p') || '';
          if (PRODS.some(function (x) { return x.k === pre; })) {
            MODO = 'catalogo';
            if (!prod[pre]) prod[pre] = 1;
          }
          armarPasos();
          /* Si la fecha guardada ya pasó mientras estaba fuera, se olvida: el
             servidor la rechazaría igual. */
          abre = (e.abre && e.abre > hoyLocal()) ? e.abre : '';
          paso = Math.max(0, Math.min(PASOS.length - 1, e.paso || 0));
          UNI.codigo = e.codigo || ''; UNI.permiso = e.permiso || '';
          UNI.cancionLista = !!e.cancionLista; UNI.vozLista = !!e.vozLista;
          UNI.cancionParte = e.cancionParte || 0; UNI.vozParte = e.vozParte || 0;
          UNI.cancionSubida = String(e.cancionSubida || '');
          UNI.vozSubida = String(e.vozSubida || '');
          UNI.cancionHechos = soloNumeros(e.cancionHechos, 24);
          UNI.vozHechos = soloNumeros(e.vozHechos, 4);
          UNI.marca = e.marca || '';
          if (!ORIGEN && e.origen) ORIGEN = String(e.origen).slice(0, 40);
          if (e.rec && typeof e.rec === 'object') {
            REC = { acepto: e.rec.acepto === true, que: String(e.rec.que || '').slice(0, 40),
                    extra: (Array.isArray(e.rec.extra) ? e.rec.extra : []).slice(0, 2).map(function (x) {
                      return { que: String((x && x.que) || '').slice(0, 40),
                               fecha: String((x && x.fecha) || '').slice(0, 10) }; }) };
          }
          NOMBRES_OK = !!e.nombresOk;

          var guardadas = (e.fotos || []).slice(0, MAX);
          /* El contador de identificadores se saca de las fotos que hay, no de
             lo que dijera el estado: si esa escritura se perdió, el contador
             volvía a 1 y la siguiente foto pisaba el archivo de una que ya
             estaba guardada; borrar una borraba las dos. */
          guardadas.forEach(function (f) {
            var n = Number(f.id) || 0;
            if (n >= BOR.id) BOR.id = n + 1;
          });
          var faltan = guardadas.length + (e.cancion ? 1 : 0) + (e.voz ? 1 : 0);
          if (!faltan) { rematar(); return; }

          function menos() { if (--faltan <= 0) rematar(); }

          guardadas.forEach(function (f) {
            var hueco = { id: f.id, txt: f.txt || '', subida: !!f.subida,
                          url: '', b64: '' };
            fotos.push(hueco);
            borLeer('foto:' + f.id, function (d) {
              if (d && d.b64) {
                hueco.b64 = d.b64;
                hueco.url = 'data:image/jpeg;base64,' + d.b64;
              }
              menos();
            });
          });
          /* El tipo de archivo se lee de lo guardado junto al audio y no del
             estado: el audio se rehace en mp3 un rato después de elegirlo, y
             si el teléfono se apagaba entre las dos escrituras, al volver se
             subía un mp3 con nombre de otra cosa que el iPhone no tocaba. */
          if (e.cancion) borLeer('cancion', function (d) {
            if (d && d.b64) cancion = { nombre: e.cancion.nombre, mime: d.mime || e.cancion.mime,
                                        b64: d.b64, desde: e.cancion.desde || 0,
                                        largo: e.cancion.largo || 0 };
            menos();
          });
          if (e.voz) borLeer('voz', function (d) {
            if (d && d.b64) {
              voz = { mime: d.mime || e.voz.mime, seg: e.voz.seg, b64: d.b64, url: '' };
              try {
                /* El blob: de antes murió al cerrar la página; se rehace desde
                   lo guardado para que se pueda volver a escuchar. */
                voz.url = URL.createObjectURL(aBlob(d.b64, voz.mime));
              } catch (err) {}
            }
            menos();
          });

          function rematar() {
            /* Si algún archivo no se pudo recuperar, fuera: vale más una foto
               menos que un hueco negro que además se subiría vacío. */
            for (var i = fotos.length - 1; i >= 0; i--) if (!fotos[i].b64) fotos.splice(i, 1);
            if (cancion && !cancion.b64) cancion = null;
            if (voz && !voz.b64) voz = null;
            /* Quedó a medio enviar si ya había universo y todavía falta algo
               por subir. Eso es lo que hay que ofrecer retomar. */
            RETOMA = !!UNI.codigo && (
              fotos.some(function (f) { return !f.subida; }) ||
              (!!cancion && !UNI.cancionLista) ||
              (!!voz && !UNI.vozLista) || !UNI.enviado);
            if (RETOMA) paso = PASOS.length - 1;
            else if (URLQ.get('p') && PASOS.indexOf('catalogo') >= 0) paso = PASOS.indexOf('catalogo');
            listo(fotos.length > 0 || !!cancion || !!voz || hayFlores() || hayProd());
          }
        });
      });
    }

    /* Los pedazos ya subidos, tal como quedaron guardados: solo números
       enteros, sin repetir y dentro del tope. */
    function soloNumeros(lista, tope) {
      var r = [];
      (Array.isArray(lista) ? lista : []).forEach(function (x) {
        var n = Math.round(Number(x));
        if (n >= 0 && n < tope && r.indexOf(n) < 0) r.push(n);
      });
      return r;
    }

    function soloLasQueExisten(cuentas, grupos) {
      var vivas = {};
      (grupos || []).forEach(function (g) {
        (g.items || []).forEach(function (it) { vivas[it.k] = 1; });
      });
      var r = {};
      for (var k in cuentas) if (vivas[k] && cuentas[k]) r[k] = cuentas[k];
      return r;
    }

    function porNombre(lista, nombre, siNo) {
      if (!nombre || !lista) return siNo;
      for (var i = 0; i < lista.length; i++) if (lista[i].nombre === nombre) return i;
      return siNo;
    }

    function aBlob(b64, mime) {
      var bin = atob(b64), n = bin.length, u = new Uint8Array(n);
      for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
      return new Blob([u], { type: mime || 'application/octet-stream' });
    }

    var ICONO = { 'Presentación': '🎁', 'Forro': '📄', 'Cintas y lazos': '🎀',
                  'Peluches': '🧸', 'Adornos': '✨', 'Personalizado': '✍️' };
    var ICONO_FLOR = { 'Girasoles': '🌻', 'Tulipanes': '🌷', 'Margaritas': '🌼',
                       'Rosas': '🌹', 'Hojas y ramitas': '🌿', 'Otras': '💐' };

    /* la presentación va sola en su propio paso; el resto, en el acordeón */
    var PRES = null, RESTO = [];
    D.agr.forEach(function (a) {
      if (a.cat === 'Presentación') PRES = a; else RESTO.push(a);
    });

    /* ---------- dos caminos: el catálogo o armarlo a su gusto ----------
       Hay quien quiere elegir un diseño ya hecho y listo, y quien quiere ir
       flor por flor. Antes solo existía el segundo camino y el catálogo era un
       PDF aparte que terminaba en "escríbenos por WhatsApp". Ahora los dos
       acaban igual: en la tarjeta con su universo y en el pedido anotado. */
    var PRODS = D.productos || [];
    var MODO = '';        /* '' sin elegir · 'armar' · 'catalogo' */
    var prod = {};        /* código de diseño -> cuántos */
    var campSel = '';     /* la campaña del catálogo que está mirando */
    var URLQ = (function () { try { return new URLSearchParams(location.search); }
                              catch (e) { return { get: function () { return ''; } }; } })();

    /* De dónde viene el pedido: de un universo que alguien recibió ("?ref=
       DE-ABC123", el botón "regala uno tú también") o de un catálogo. Se
       anota con el pedido para saber qué trae clientes. */
    var ORIGEN = (function () {
      var r = String(URLQ.get('ref') || '').trim().toUpperCase();
      if (/^[A-Z]{2,3}-[A-Z0-9]{4,10}$/.test(r)) return r;
      /* El enlace de cada red ("?ref=ig" en la bio de Instagram, "?ref=tt" en
         la de TikTok…): así se sabe qué red trae clientes de verdad. */
      var RED = { IG: 'instagram', INSTAGRAM: 'instagram', TT: 'tiktok', TIKTOK: 'tiktok',
                  FB: 'facebook', FACEBOOK: 'facebook', WA: 'whatsapp', WHATSAPP: 'whatsapp',
                  ESTADO: 'estado', MK: 'marketplace', MARKETPLACE: 'marketplace',
                  AD: 'anuncio', ANUNCIO: 'anuncio' };
      if (RED.hasOwnProperty(r)) return 'red:' + RED[r];
      var c = String(URLQ.get('pedir') || '').trim();
      if (c) return ('catalogo:' + c.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                                    .replace(/[^\w\-]/g, '')).slice(0, 40);
      return '';
    })();

    /* Las experiencias que el taller ofrece esta temporada (en Ajustes). Si el
       cliente llega desde un \u00e1rbol o una vela que recibi\u00f3 ("?x=vela"), empieza
       con esa misma ya elegida. */
    var EXPES = (D.experiencias && D.experiencias.length) ? D.experiencias : ['universo'];
    /* Si esta temporada no se ofrece el universo (solo el árbol, por ejemplo),
       se empieza por la primera que sí, con sus colores. */
    if (EXPES.indexOf(expe) < 0) { expe = EXPES[0]; temaDeExpe(); }
    (function () {
      var x = String(URLQ.get('x') || '').toLowerCase();
      if (EXPES.indexOf(x) >= 0) { expe = x; temaDeExpe(); }
      /* enlaces por sección: ?seccion=mama abre el pedido ya pensado para mamá */
      var sc = String(URLQ.get('seccion') || '').toLowerCase();
      if (PUBLICO_TXT[sc]) publico = sc;
    })();
    /* El \u00e1rbol pide los colores de Navidad y la vela los de "En memoria". Se
       ponen solos al elegirlos; si quiere otros, los cambia. */
    function temaDeExpe() {
      var quiere = expe === 'arbol' ? 'navidad' : expe === 'vela' ? 'en memoria' : '';
      if (!quiere || !D.temas) return;
      for (var i = 0; i < D.temas.length; i++) {
        if (String(D.temas[i].nombre || '').trim().toLowerCase() === quiere) { tema = i; return; }
      }
    }
    var EXPE_TXT = {
      universo: { ic: '\ud83c\udf0c', nom: 'Universo', sub: 'Tus fotos girando entre estrellas',
                  tu: 'tu universo', abre: 'se abre un universo animado con tus fotos y tu dedicatoria' },
      arbol:    { ic: '\ud83c\udf84', nom: '\u00c1rbol que se enciende', sub: 'Cada esfera es una foto; al abrirlas, se enciende',
                  tu: 'tu \u00e1rbol', abre: 'se abre un \u00e1rbol de Navidad que se enciende foto por foto' },
      vela:     { ic: '\ud83d\udd6f\ufe0f', nom: 'Vela que no se apaga', sub: 'Para recordar a alguien: tus fotos en su luz',
                  tu: 'tu vela', abre: 'se abre una vela que se enciende con tus fotos y tu dedicatoria' },
      constelaciones: { ic: '\u2728', nom: 'Constelaciones', sub: 'Une las estrellas: cada una guarda una foto',
                  tu: 'tu constelación', abre: 'se abre un cielo donde cada estrella guarda una foto' },
      planeta:  { ic: '\ud83e\ude90', nom: 'Planeta propio', sub: 'Un planeta 3D con sus nombres; cada bandera, una foto',
                  tu: 'tu planeta', abre: 'se abre un planeta 3D con sus nombres y sus fotos' },
      laberinto:{ ic: '\ud83e\uddf8', nom: 'Laberinto 3D', sub: 'Un juego: su personaje busca los recuerdos en un laberinto',
                  tu: 'tu laberinto', abre: 'se abre un laberinto 3D donde cada regalito guarda una foto' },
      carrito:  { ic: '\ud83c\udfc1', nom: 'La gran carrera', sub: 'Carrera retro de 3 vueltas: cada arco de coraz\u00f3n abre una foto',
                  tu: 'tu juego', abre: 'se abre una carrera donde cada arco de coraz\u00f3n abre una foto' },
      isla:     { ic: '\ud83c\udfdd\ufe0f', nom: 'Nuestra isla de bloques', sub: 'Exploran, encuentran 6 corazones y construyen juntos',
                  tu: 'tu isla', abre: 'se abre una isla de bloques: 6 corazones con sus recuerdos, una flor que crece y lo que construyan los dos' },
      match:    { ic: '\ud83d\udc95', nom: 'El regalo secreto', sub: 'Junta 3 corazones, flores o besos y abre su mensaje',
                  tu: 'tu regalo secreto', abre: 'se abre un juego de juntar 3 corazones, flores y besos: al ganar, se abre tu mensaje' },
      corre:    { ic: '\ud83c\udfc3', nom: 'Corre hasta m\u00ed', sub: 'Esquiva los problemas y junta corazones hasta llegar',
                  tu: 'tu juego', abre: 'se abre un juego donde corre esquivando problemas hasta llegar a ti' },
      bitacora: { ic: '\ud83d\udcd6', nom: 'Bitácora 3D de pareja', sub: 'Su historia en 3D: los dos agregan fotos, notas y citas',
                  tu: 'tu bitácora', abre: 'se abre su bitácora 3D: días juntos, sus recuerdos, y los dos pueden agregar fotos, notas y citas' },
      cartas:   { ic: '\ud83d\udc8c', nom: 'Cartas para abrir cuando…', sub: 'Un sobre para cada momento',
                  tu: 'tu caja de cartas', abre: 'se abren sus cartas "para abrir cuando…"' }
    };
    /* Cómo se ordenan en el formulario: por secciones, como un catálogo. */
    var SECCIONES = [
      ['Universos', ['universo', 'constelaciones', 'planeta']],
      ['Videojuegos', ['isla', 'corre', 'match', 'laberinto', 'carrito']],
      ['Bitácoras y cartas', ['bitacora', 'cartas']],
      ['Fechas especiales', ['arbol', 'vela']]
    ];
    /* Los sobres de "cartas para abrir cuando…": uno por foto, en orden. */
    var SOBRES = ['Abre cuando me extrañes', 'Abre cuando estés triste', 'Abre cuando necesites reír',
                  'Abre cuando no puedas dormir', 'Abre cuando sea tu cumpleaños', 'Abre cuando pelees conmigo',
                  'Abre cuando quieras saber cuánto te quiero', 'Abre cuando todo salga bien'];
    var desde = '';      /* bitácora: desde qué día están juntos */
    function expeNueva() { return ['universo', 'arbol', 'vela'].indexOf(expe) < 0; }
    function expeTxt() { return EXPE_TXT[expe] || EXPE_TXT.universo; }

    /* Las fechas que el cliente pide que le recordemos. La casilla empieza
       SIN marcar: sin su permiso no se le escribe (art. 58.1 e del Código
       del Consumidor). */
    var REC = { acepto: false, que: '', extra: [] };

    var PASOS = [];
    function armarPasos() {
      PASOS = [];
      /* La pregunta del principio solo existe si hay diseños con precio. */
      if (PRODS.length) PASOS.push('inicio');
      if (MODO === 'catalogo') {
        PASOS.push('catalogo');
      } else {
        if (PRES && PRES.items.length) PASOS.push('pres');
        if (D.cats.length) PASOS.push('flores');
        if (RESTO.length) PASOS.push('detalles');
      }
      if (D.tarjetas.length) PASOS.push('tarjeta');
      PASOS.push('final');
    }
    armarPasos();

    /* Viene del catálogo: "?pedir=Navidad" abre la pregunta con esa campaña a
       mano, y "&p=CÓDIGO" (el botón "Lo quiero" de un diseño) entra directo
       con ese diseño ya elegido. */
    (function () {
      var c = URLQ.get('pedir') || '';
      if (c && c !== 'Todo') campSel = c;
      var k = URLQ.get('p') || '';
      var hay = PRODS.filter(function (x) { return x.k === k; })[0];
      if (hay) {
        MODO = 'catalogo'; prod[k] = 1; armarPasos();
        paso = PASOS.indexOf('catalogo');
      }
    })();

    var S = function (n) { return 'S/ ' + (Number(n) || 0).toFixed(2); };

              + noche + '\')">🎄 En Nochebuena</button>' : '')
          + '<button class="chip' + ((abre && abre !== noche) || abreOtra ? ' on' : '')

        if ((abre && abre !== noche) || abreOtra) {
          h += '<input type="date" id="abreF" min="' + sumarDias(hoyL, 1) + '" max="'

          + (voz
              ? '<div class="vozlista">'
                  + '<button class="play" id="vozPlay" onclick="oirVoz()">▶</button>'

                  + '<small><b id="vozT">0:00</b> / ' + reloj(voz.seg) + '</small></div>'
                  + '<button class="x" onclick="borrarVoz()" title="Borrar">×</button>'

                + '<button class="fantasma" onclick="borrarVoz(true)">↺ Volver a grabarlo</button>'

          + '<p class="nota">Hasta un minuto. Escúchalo antes de mandarlo, '

          + '<h2>Canción de fondo</h2>'
          /* En su propia caja para poder repintarla sola: la canción termina
             de prepararse mientras el cliente escribe, y repintar la pantalla
             entera le cerraba el teclado a media frase. */
          + '<div id="cajaCancion">' + cuerpoCancion() + '</div>'
          + '<div class="aviso"><b>Antes de imprimir</b>Revisamos que tus fotos se vean bien '
          + 'y te avisamos. Nadie más que nosotros ve el enlace hasta que te lo entregamos.</div>';
      }
      return h;
    }

    function pintarFinal() {
      var l = lineas();
      var h = '<div class="titulo">Tu detalle</div>';
      if (RETOMA) {
        var faltan = fotos.filter(function (f) { return !f.subida; }).length;
        h += '<div class="retoma"><b>Te quedó un envío a medias</b>'
          + '<span>Guardamos todo lo tuyo en este teléfono. '
          + (faltan ? 'Faltan ' + faltan + (faltan === 1 ? ' foto' : ' fotos') + ' por subir; '
                    : '')
          + 'lo que ya subiste no se vuelve a mandar.</span>'
          /* La salida de emergencia. Sin ella, un borrador que por lo que sea
             no se deja mandar encierra al cliente tres días: vuelve, le sale
             el mismo error y no tiene forma de empezar limpio. */
          + '<button type="button" onclick="empezarDeNuevo()">Empezar de nuevo</button>'
          + '</div>';
      }
      if (!l.length) {
        h += '<div class="vacio">Todavía no elegiste nada.<br>Vuelve atrás y arma tu detalle.</div>';
      } else {
        h += '<div class="res">';
        l.forEach(function (x) {
          h += '<div class="r' + (x.incluido ? ' inc' : '') + '"><span>' + esc(x.t)
            + '</span><b>' + (x.incluido ? 'incluido' : S(x.p)) + '</b></div>';
        });
        h += '<div class="r tt"><span>Total estimado</span><b>' + S(total()) + '</b></div></div>';
      }

      h += '<h2>Para quién es</h2>'
        + '<input type="text" id="para" placeholder="Para mamá" value="' + esc(G('para')) + '" '
        + 'oninput="verTarjeta()">'
        + '<input type="text" id="de" placeholder="De parte de..." style="margin-top:10px" value="'
        + esc(G('de')) + '" oninput="verTarjeta()">'
        + '<label>Dedicatoria</label>'
        + '<textarea id="msg" placeholder="Lo que quieres que diga la tarjeta" oninput="verTarjeta()">'
        + esc(G('msg')) + '</textarea>'
        /* Tal cual se va a leer, antes de mandarlo. El reclamo que más se
           repite en florerías es el nombre mal escrito en la tarjeta, y quien
           mejor lo ve es el propio cliente, si se lo enseñamos. */
        + '<div class="prev-tarjeta" id="prevTarjeta">' + htmlPrevTarjeta() + '</div>'
        + '<label class="casilla"><input type="checkbox" id="nombresOk"' + (NOMBRES_OK ? ' checked' : '')
        + ' onchange="marcarNombres(this.checked)"> Revisé que los nombres y el mensaje '
        + 'estén bien escritos</label>';

      h += '<h2>Tus datos</h2>'
        + '<input type="text" id="nom" placeholder="Tu nombre" value="' + esc(G('nom')) + '">'
        + '<input type="tel" id="tel" inputmode="numeric" placeholder="Tu WhatsApp" '
        + 'style="margin-top:10px" value="' + esc(G('tel')) + '">'
        /* El día que lo necesita. Sin esto no hay forma de saber qué pedido
           hacer primero, y cada flor se hace a mano. */
        + '<label>¿Para qué día lo necesitas?</label>'
        + '<input type="date" id="entrega" min="' + entregaMinima() + '" max="' + sumarDias(hoyLocal(), 365)
        + '" value="' + esc(G('entrega')) + '" onchange="revisarDia(this.value)">'
        + '<p class="nota" style="margin-top:6px" id="diaNota">' + notaDia(G('entrega')) + '</p>'
        + htmlRecordar()
        + (conFotos()
            ? '<label>Tu correo <em>opcional</em></label>'
              + '<input type="email" id="correo" inputmode="email" autocomplete="email" '
              + 'placeholder="para mandarte cómo quedó tu regalo" value="' + esc(G('correo')) + '">'
            : '')
        + '<p class="nota">El precio es una estimación. Te confirmamos por WhatsApp antes de empezar.</p>';
      return h;
    }

    var NOMBRES_OK = false;

    function htmlPrevTarjeta() {
      var el = function (id) { var x = document.getElementById(id); return x ? x.value : G(id); };
      var para = String(el('para') || '').trim(), de = String(el('de') || '').trim();
      var msg = String(el('msg') || '').trim();
      if (!para && !de && !msg) return '<p class="nota">Escribe arriba y acá ves cómo se va a leer.</p>';
      return '<div class="pt-tit">Así se va a leer</div><div class="pt-carta">'
        + '<div class="pt-para">' + (para ? esc(para) : '<i>(sin "para")</i>') + '</div>'
        + (msg ? '<div class="pt-msg">' + esc(msg).replace(/\n/g, '<br>') + '</div>' : '')
        + '<div class="pt-de">' + (de ? esc(de) : '<i>(sin firma)</i>') + '</div></div>';
    }
    window.verTarjeta = function () {
      var c = document.getElementById('prevTarjeta');
      if (c) c.innerHTML = htmlPrevTarjeta();
      /* Si cambia algo después de revisarlo, hay que volver a revisarlo. */
      if (NOMBRES_OK) {
        NOMBRES_OK = false;
        var k = document.getElementById('nombresOk'); if (k) k.checked = false;
      }
    };

    /* ---- los cupos por día ---- */
    function lleno(d) { return !!(D.cupos && d && (D.cupos.lleno || []).indexOf(d) >= 0); }
    function notaDia(d) {
      var base = 'Cada pieza se hace a mano: pide con '
        + (D.diasMinimos === 1 ? 'al menos un día' : 'al menos ' + (D.diasMinimos || 0) + ' días')
        + ' de anticipación.';
      var c = D.cupos;
      if (!c) return base;
      if (d && (c.pocos || []).indexOf(d) >= 0) return '⏳ Quedan pocos cupos para ese día: pídelo ya.';
      var ll = (c.lleno || []).filter(function (x) { return x >= hoyLocal(); }).slice(0, 4);
      return base + (ll.length ? ' Ya no hay cupo para: ' + ll.map(fechaLarga).join(', ') + '.' : '');
    }
    window.revisarDia = function (v) {
      if (lleno(v)) {
        aviso('Ese día ya está lleno 😔 Elige otro o escríbenos por WhatsApp');
        var e = document.getElementById('entrega'); if (e) e.value = '';
        v = '';
      }
      var n = document.getElementById('diaNota'); if (n) n.textContent = notaDia(v);
      recordar();
      var r = document.getElementById('recordarCaja'); if (r) r.outerHTML = htmlRecordar();
    };

    /* ---- recordar la fecha el año que viene, si él quiere ---- */
    var MOTIVOS = ['Cumpleaños', 'Aniversario', 'Día de la Madre', 'San Valentín', 'Otra fecha'];
    function htmlRecordar() {
      var d = G('entrega') || (document.getElementById('entrega') || {}).value || '';
      var h = '<div class="recordar" id="recordarCaja">'
        + '<label class="casilla"><input type="checkbox" id="recOk"' + (REC.acepto ? ' checked' : '')
        + ' onchange="recordarSi(this.checked)"> ¿Te avisamos antes de esta fecha el próximo año?</label>';
      if (REC.acepto) {
        h += '<div class="rec-fila"><span>' + (d ? fechaLarga(d).replace(/ de \d{4}$/, '') : 'Tu fecha')
          + '</span><select id="recQue" onchange="recCampo(-1,\'que\',this.value)">'
          + '<option value="">¿Qué se celebra?</option>'
          + MOTIVOS.map(function (m) {
              return '<option' + (REC.que === m ? ' selected' : '') + '>' + m + '</option>'; }).join('')
          + '</select></div>';
        REC.extra.forEach(function (x, i) {
          h += '<div class="rec-fila"><input type="date" value="' + esc(x.fecha) + '" '
            + 'onchange="recCampo(' + i + ',\'fecha\',this.value)">'
            + '<input type="text" maxlength="40" placeholder="¿Qué es? (el cumple de mamá)" value="'
            + esc(x.que) + '" oninput="recCampo(' + i + ',\'que\',this.value)">'
            + '<button type="button" class="x" onclick="recQuitar(' + i + ')">×</button></div>';
        });
        if (REC.extra.length < 2) h += '<button type="button" class="fantasma" onclick="otraFecha()">'
          + '+ Otra fecha que no quieres olvidar</button>';
      }
      return h + '<p class="nota">Solo un mensaje por WhatsApp unos días antes, nada más. Lo puedes '
        + 'cancelar cuando quieras.</p></div>';
    }
    window.refrescarRecordar = function () {
      var r = document.getElementById('recordarCaja'); if (r) r.outerHTML = htmlRecordar();
      guardarEstado();
    };
    window.recordarSi = function (si) { REC.acepto = !!si; refrescarRecordar(); };
    /* Los onclick del HTML corren fuera de este código (en GitHub va todo
       dentro de prender()), así que no ven REC ni NOMBRES_OK: todo lo que
       tocan pasa por funciones puestas en window. */
    window.recCampo = function (i, campo, v) {
      v = String(v || '').slice(0, campo === 'fecha' ? 10 : 40);
      if (i < 0) REC.que = v; else if (REC.extra[i]) REC.extra[i][campo] = v;
      guardarEstado();
    };
    window.recQuitar = function (i) { REC.extra.splice(i, 1); refrescarRecordar(); };
    window.marcarNombres = function (si) { NOMBRES_OK = !!si; guardarEstado(); };
    window.otraFecha = function () {
      if (REC.extra.length < 2) REC.extra.push({ que: '', fecha: '' });
      refrescarRecordar();
    };
    function fechasARecordar(entrega) {
      if (!REC.acepto) return null;
      var l = [];
      if (/^\d{4}-\d{2}-\d{2}$/.test(entrega || '')) l.push({ que: REC.que || 'Tu fecha especial', dia: entrega.slice(5) });
      REC.extra.forEach(function (x) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(x.fecha || '')) l.push({ que: x.que || 'Una fecha especial', dia: x.fecha.slice(5) });
      });
      return l.length ? { acepto: true, fechas: l } : null;
    }

    /* El enlace para seguir el pedido, en esta misma página. */
    function urlSeguimiento(id, firma) {
      if (!id || !firma) return '';
      var base = '';
      if (/(^|\.)google(usercontent)?\.com$/.test(String(location.hostname || ''))) {
        var m = String(D.base || '').match(/^(https:\/\/[^?#]*\/)[^\/?#]*(?:[?#].*)?$/);
        base = m ? m[1] : '';
      } else base = location.origin + location.pathname;
      return base ? base + '?seg=' + encodeURIComponent(id) + '.' + firma : '';
    }

    /* los campos de texto se guardan al salir del paso, para no perderlos */
    var campos = {};
    function G(id) { return campos[id] || ''; }
    function recordar() { leerCampos(); guardarEstado(); }
    function leerCampos() {
      ['para', 'de', 'msg', 'nom', 'tel', 'entrega', 'correo'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) campos[id] = el.value;
      });
    }

    /* ---------- el pedido, en líneas ---------- */
    function lineas() {
      var l = [];
      /* Solo cuenta lo del camino que eligió: si pasó por los dos, lo que
         dejó en el otro no se le cobra. */
      if (MODO === 'catalogo') {
        PRODS.forEach(function (it) {
          var n = prod[it.k] || 0;
          if (n) l.push({ t: (n > 1 ? n + ' × ' : '') + it.n, p: it.p * n,
                          tipo: 'producto', k: it.k, n: n });
        });
        if (D.tarjetas[tarjeta] && D.tarjetas[tarjeta].precio)
          l.push({ t: D.tarjetas[tarjeta].nombre, p: D.tarjetas[tarjeta].precio,
                   tipo: 'tarjeta', k: D.tarjetas[tarjeta].nombre, n: 1 });
        return l;
      }
      D.cats.forEach(function (g) {
        g.items.forEach(function (it) {
          var n = sel[it.k] || 0;
          if (n) l.push({ t: n + ' × ' + it.n, p: it.p * n, tipo: 'flor', k: it.k, n: n });
        });
      });
      D.agr.forEach(function (g) {
        g.items.forEach(function (it) {
          var n = op[it.k] || 0;
          if (!n) return;
          l.push({ t: (n > 1 ? n + ' × ' : '') + it.n, p: it.p * n,
                   tipo: 'opcion', k: it.k, n: n });
          /* Lo incluido se enseña en el resumen para que el cliente sepa qué
             recibe, pero a precio cero: ya lo pagó dentro de la presentación.
             Y no se manda como línea propia: el servidor lo añade solo. */
          (it.inc || []).forEach(function (nom) {
            l.push({ t: '+ ' + nom, p: 0, incluido: true });
          });
        });
      });
      if (D.tarjetas[tarjeta] && D.tarjetas[tarjeta].precio)
        l.push({ t: D.tarjetas[tarjeta].nombre, p: D.tarjetas[tarjeta].precio,
                 tipo: 'tarjeta', k: D.tarjetas[tarjeta].nombre, n: 1 });
      return l;
    }
    function total() {
      var t = 0;
      lineas().forEach(function (x) { t += x.p; });
      return Math.round(t * 100) / 100;
    }
    function hayFlores() {
      var n = 0;
      for (var k in sel) n += sel[k] || 0;
      return n > 0;
    }
    function hayProd() {
      for (var k in prod) if (prod[k]) return true;
      return false;
    }
    function hayAlgo() { return MODO === 'catalogo' ? hayProd() : hayFlores(); }

    /* ---------- pintar todo ---------- */
    function pintar() {
      var q = PASOS[paso], h = '';
      /* Si se va del paso de la tarjeta, se calla lo que estuviera sonando:
         el botón de play se queda atrás y el audio seguiría solo. */
      if (q !== 'tarjeta') pararRepro();
      if (q === 'inicio') h = pintarInicio();
      else if (q === 'catalogo') h = pintarCatalogo();
      else if (q === 'pres') h = pintarPres();
      else if (q === 'flores') h = pintarFlores();
      else if (q === 'detalles') h = pintarDetalles();
      else if (q === 'tarjeta') h = pintarTarjeta();
      else h = pintarFinal();

      document.getElementById('app').innerHTML = h;
      /* Solo al cambiar de paso. Antes subía en CADA toque: agregabas la
         tercera flor y la página te devolvía arriba del todo. */
      if (paso !== ultimoPaso) { window.scrollTo(0, 0); ultimoPaso = paso; }

      var p = '';
      PASOS.forEach(function (x, i) {
        p += '<i class="' + (i === paso ? 'on' : (i < paso ? 'hecho' : '')) + '"></i>';
      });
      document.getElementById('pasos').innerHTML = p;

      document.getElementById('tot').textContent = S(total());
      /* el escalón en vivo: al sumar flores se ve cómo sube de Detalle a Premium */
      var nb = document.getElementById('nivB');
      if (nb) { var nvB = hayAlgo() ? nivelActual() : 0; nb.hidden = !ESC || !nvB || q === 'inicio';
        if (nvB) { var txtB = NIV(nvB).ic + ' ' + NIV(nvB).nom; if (nb.textContent !== txtB) { nb.textContent = txtB; nb.className = 'niv-b n' + nvB + ' sube'; } } }
      document.getElementById('rot').textContent = (q === 'final') ? 'Total estimado' : 'Va quedando';
      var atras = document.getElementById('btnAtras');
      atras.hidden = (paso === 0);
      var sig = document.getElementById('btnSig');
      sig.textContent = (q === 'final') ? 'Enviar mi pedido' : 'Continuar';
      /* En la pregunta del principio la barra de abajo sobra: los dos
         caminos son los botones grandes. */
      var barra = document.getElementById('barra');
      if (barra && !ENV.reloj) barra.style.display = (q === 'inicio') ? 'none' : '';
    }

    function pintarInicio() {
      var fotos = PRODS.filter(function (x) { return x.f; }).slice(0, 3);
      return '<div class="titulo">¿Cómo quieres tu detalle?</div>'
        + '<p class="nota" style="margin-top:-4px">Los dos terminan igual: con tu tarjeta y tu universo.</p>'
        + (ESC ? '<div class="niv-mini"><span class="n1">' + NIV(1).ic + ' ' + esc(NIV(1).nom) + '</span><i>›</i><span class="n2">' + NIV(2).ic + ' ' + esc(NIV(2).nom)
          + '</span><i>›</i><span class="n3">' + NIV(3).ic + ' ' + esc(NIV(3).nom) + '</span><small>Mientras más grande tu arreglo, más mágica su experiencia digital</small></div>' : '')
        + '<button class="camino" onclick="elegirModo(\'catalogo\')">'
        + '<span class="fotos">' + (fotos.length
            ? fotos.map(function (x) { return '<img src="' + esc(x.f) + '" alt="" loading="lazy">'; }).join('')
            : '\ud83d\udc90') + '</span>'
        + '<b>Elegir un diseño del catálogo</b>'
        + '<small>Ya armado y con su precio. Lo eliges y listo.</small></button>'
        + '<button class="camino" onclick="elegirModo(\'armar\')">'
        + '<span class="fotos">\ud83c\udf3b\ud83c\udf37\ud83c\udf3c</span>'
        + '<b>Armarlo a mi gusto</b>'
        + '<small>Tú eliges la presentación, cada flor y los detalles.</small></button>';
    }

    function pintarCatalogo() {
      /* Solo las campañas que tienen algún diseño, en el orden de tu lista. */
      var usadas = {};
      PRODS.forEach(function (x) { (x.camp || []).forEach(function (c) { usadas[c] = 1; }); });
      var camps = (D.campanas || []).filter(function (c) { return usadas[c]; });
      var ver = PRODS.filter(function (x) {
        return (!campSel || (x.camp || []).indexOf(campSel) >= 0) && (!nivSel || nivelDePrecio(x.p) === nivSel);
      });
      if (!ver.length) { ver = PRODS; nivSel = 0; }
      var h = '<div class="titulo">Nuestros diseños</div>'
        + '<p class="nota" style="margin-top:-4px">Elige uno o varios. Después le pones tu tarjeta.</p>';
      if (camps.length > 1) {
        h += '<div class="chips">'
          + '<button class="chip' + (!campSel ? ' on' : '') + '" onclick="verCampana(\'\')">Todos</button>'
          + camps.map(function (c) {
              return '<button class="chip' + (campSel === c ? ' on' : '') + '" onclick="verCampana('
                + jsCad(c) + ')">' + esc(c) + '</button>';
            }).join('') + '</div>';
      }
      /* cada diseño dice qué experiencia digital trae: es parte de lo que compra */
      if (ESC) h += '<div class="niv-leyenda">' + [1, 2, 3].map(function (n) {
          return '<button class="niv-chip n' + n + (nivSel === n ? ' on' : '') + '" onclick="verNivel(' + (nivSel === n ? 0 : n) + ')">' + NIV(n).ic + ' ' + esc(NIV(n).nom) + '</button>'; }).join('')
        + '<small>' + (nivSel ? 'Solo ' + esc(NIV(nivSel).nom) + ' · toca de nuevo para ver todos' : 'Cada diseño trae su experiencia digital') + '</small></div>';
      h += '<div class="rej">' + ver.map(function (it) {
        var n = prod[it.k] || 0, nv = nivelDePrecio(it.p);
        return '<div class="tarj' + (n ? ' on' : '') + '" onclick="masProd(' + jsCad(it.k) + ',1)">'
          + '<div class="im">' + (it.f ? '<img src="' + esc(it.f) + '" loading="lazy" alt="' + esc(it.n) + '">' : '\ud83c\udf81')
          + (n ? '<span class="bg">' + n + '</span>' : '')
          + (nv ? '<span class="niv-sello n' + nv + '">' + NIV(nv).ic + ' ' + esc(NIV(nv).nom) + '</span>' : '')
          + (it.f ? '<button class="zoom" onclick="event.stopPropagation();lupa(' + jsCad(it.f) + ')">\ud83d\udd0d</button>' : '')
          + '</div>'
          + '<div class="nb"><b>' + esc(it.n) + '</b><small>' + S(it.p) + '</small>'
          + (it.d && it.d.length ? '<em>' + esc(it.d.slice(0, 2).join(' · ')) + '</em>' : '') + '</div>'
          + (n ? '<div class="mm" onclick="event.stopPropagation()">'
                + '<button onclick="masProd(' + jsCad(it.k) + ',-1)">\u2212</button>'
                + '<span>' + n + '</span>'
                + '<button onclick="masProd(' + jsCad(it.k) + ',1)">+</button></div>'
               : '<button class="add">Lo quiero</button>')
          + '</div>';
      }).join('') + '</div>';
      return h;
    }

    /* ---------- acciones ---------- */
    window.verCat = function (i) { catFlor = i; pintar(); };
    window.elegirModo = function (m) {
      MODO = (m === 'catalogo') ? 'catalogo' : 'armar';
      armarPasos();
      paso = Math.min(1, PASOS.length - 1);
      guardarEstado();
      pintar();
    };
    window.verCampana = function (c) { campSel = c; pintar(); };
    window.masProd = function (k, d) {
      prod[k] = Math.max(0, (prod[k] || 0) + d);
      if (!prod[k]) delete prod[k];
      guardarEstado();
      pintar();
    };
    window.masFlor = function (k, d) { sel[k] = Math.max(0, (sel[k] || 0) + d); pintar(); };
    window.masOp = function (k, d) { op[k] = Math.max(0, (op[k] || 0) + d); pintar(); };
