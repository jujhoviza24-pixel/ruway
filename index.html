<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ruway</title>
<meta name="theme-color" content="#0B0E14">
<!--
  =====================================================================
  Puente del universo.

  El QR de las tarjetas apunta acá porque esta dirección es corta y hace
  un QR fácil de escanear. Esta página no hace más que pasarte al universo,
  que lo sirve Apps Script con tus fotos ya dentro.

  ¿Por qué no se dibuja el universo acá directamente? Porque desde este
  dominio el navegador no puede pedirle los datos a Apps Script: Google
  bloquea las peticiones entre dominios distintos. Sirviendo la página
  desde Apps Script no hay ninguna petición que bloquear.

  ramos.js se queda en este repositorio: el universo lo carga desde acá,
  y cargar un script de otro dominio sí está permitido.
  =====================================================================
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#0B0E14;color:#EADFC8;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:20px;text-align:center;padding:28px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .luz{width:56px;height:56px;border-radius:50%;
    background:radial-gradient(circle,#FFE9A8 0%,rgba(255,213,110,.35) 45%,rgba(255,200,80,0) 70%);
    animation:latir 1.5s ease-in-out infinite}
  @keyframes latir{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.25);opacity:1}}
  p{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:rgba(234,223,200,.6)}
  a{color:#FFD86B;font-size:13.5px;margin-top:6px}
</style>
</head>
<body>

<div class="luz"></div>
<p>Abriendo</p>
<a id="manual" href="#" style="display:none">Toca acá si no abre solo</a>

<script>
/* La dirección de tu Apps Script, la que termina en /exec.
   Va sin clave: sola no abre nada. */
var API = "https://script.google.com/macros/s/AKfycbym_HuTN7HjpEy3IkKwvdamuJtExLvVnUJt83-vWxhhUR1kNx_hfNzd6GC53nNc-jYOGQ/exec";

(function () {
  var q = new URLSearchParams(location.search);
  var partes = ['vista=universo'];
  ['c', 'para', 'msg', 'de', 'tit'].forEach(function (k) {
    var v = q.get(k);
    if (v) partes.push(k + '=' + encodeURIComponent(v));
  });

  var destino = API + (API.indexOf('?') >= 0 ? '&' : '?') + partes.join('&');

  var a = document.getElementById('manual');
  a.href = destino;
  setTimeout(function () { a.style.display = 'block'; }, 3500);

  location.replace(destino);
})();
</script>
</body>
</html>
