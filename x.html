<!DOCTYPE html>
<!-- Las experiencias del llavero con NFC. construir.js la copia a GitHub como
     x.html y le pone la dirección del servidor. Se llega desde u.html cuando
     el regalo es un juego, un planeta, una constelación, una bitácora o
     cartas. Usa los mismos datos que el universo: fotos con su frase,
     dedicatoria, canción y nota de voz. -->
<html lang="es">
<head>
<!-- GENERADO POR construir.js desde Experiencias.html · NO EDITAR A MANO -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tu regalo Ruway</title>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&family=Caveat:wght@600;700&family=Baloo+2:wght@600;800&family=Dancing+Script:wght@700&display=swap">
<style>
:root{color-scheme:dark;--noche:#140B26;--tarjeta:#231540;--borde:#3A2766;--crema:#FFF1DA;--rosa:#FF7AA8;
  --oro:#FFC94A;--lila:#B79CFF;--tenue:#A893C9}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--noche);color:var(--crema);font-family:Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
body.juego{overflow:hidden;touch-action:none}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--oro);outline-offset:2px}

/* la espera */
#espera{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;
  background:radial-gradient(ellipse at 50% 45%,#3a1f5e 0%,var(--noche) 70%);transition:opacity .6s}
#espera.fuera{opacity:0;pointer-events:none}
#espera .lazo{width:54px;height:54px;border-radius:50%;border:3px solid rgba(255,201,74,.25);border-top-color:var(--oro);animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
#espera p{margin:0;font:600 15px Nunito,sans-serif;color:#E8DCF5;text-align:center;padding:0 24px;white-space:pre-line}
#espera button{display:none;border:1px solid rgba(255,233,168,.4);background:none;color:var(--crema);border-radius:22px;padding:9px 20px}
#espera.perdido .lazo{display:none}#espera.perdido button{display:block}

/* los botones de sonido, arriba a la izquierda */
.sonidos{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;display:flex;gap:8px;z-index:6}
.sonidos button{min-width:42px;height:38px;border-radius:20px;border:1px solid rgba(255,233,168,.3);background:rgba(20,11,38,.6);
  color:var(--crema);font-size:15px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sonidos button.suena{background:var(--rosa);color:#2A0716;border-color:var(--rosa)}

/* la portada y el final con los colores de la marca: crema, verde oliva, oro y terracota */
.capa.marca{background:radial-gradient(circle at 25% 15%,rgba(255,243,217,.97),rgba(251,227,207,.96) 45%,rgba(233,211,192,.97) 100%);overflow:hidden}
.capa.marca .carta{background:#FFFBF4;border:2px solid #EAD9BD;border-radius:30px;padding:26px 22px 20px;box-shadow:0 24px 60px rgba(92,107,74,.25),0 0 0 8px rgba(255,251,244,.5);color:#23291E;position:relative;z-index:2}
.capa.marca .iso{width:74px;height:74px;object-fit:contain;display:block;margin:-6px auto 4px;filter:drop-shadow(0 4px 10px rgba(92,107,74,.25))}
.capa.marca .para{font:700 34px 'Dancing Script',Caveat,cursive;color:#C2705F}
.capa.marca h2{font:800 29px/1.1 'Baloo 2',Fredoka,sans-serif;color:#3F4A33;letter-spacing:-.01em}
.capa.marca h2::after{content:"";display:block;width:56px;height:4px;border-radius:4px;margin:10px auto 0;background:linear-gradient(90deg,#FFC531,#D2A877)}
.capa.marca p{color:#5E6655}
.capa.marca .primario{background:linear-gradient(180deg,#6E7F59,#4B5A3C);color:#FFFBF4;font:800 18px 'Baloo 2',sans-serif;box-shadow:0 10px 24px rgba(75,90,60,.4);padding:13px 32px}
.capa.marca .pie{color:#B89A6E;letter-spacing:.18em;font-size:10.5px}
.capa.marca .firma{font:700 30px 'Dancing Script',cursive;color:#C2705F}
.capa.marca .icono img.masc{width:118px}
.capa.marca .pet{position:absolute;top:-30px;width:18px;height:14px;border-radius:14px 2px 14px 2px;background:#F4A7B9;opacity:.75;animation:petalo 9s linear infinite;z-index:1}
.capa.marca .pet:nth-child(2){left:12%;animation-delay:-2s;background:#FFC531;width:12px;height:10px}
.capa.marca .pet:nth-child(3){left:30%;animation-delay:-5s;animation-duration:11s}
.capa.marca .pet:nth-child(4){left:55%;animation-delay:-1s;background:#D2A877}
.capa.marca .pet:nth-child(5){left:75%;animation-delay:-7s;animation-duration:12s;background:#C2705F;width:12px;height:10px}
.capa.marca .pet:nth-child(6){left:90%;animation-delay:-3.5s}
.capa.marca .pet:nth-child(1){left:3%}
@keyframes petalo{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) translateX(40px) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.capa.marca .pet{display:none}}
/* capas: portada, recuerdo, final */
.capa{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px 16px;z-index:10;
  background:rgba(10,5,20,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow-y:auto}
.carta{width:100%;max-width:350px;text-align:center;animation:sube .45s cubic-bezier(.2,.9,.3,1.2);margin:auto}
@keyframes sube{from{transform:translateY(24px) scale(.94);opacity:0}}
.carta h2{font:700 26px/1.15 Fredoka,sans-serif;margin:0 0 8px;text-wrap:balance}
.carta p{margin:0 0 16px;line-height:1.55;color:#E8DCF5;white-space:pre-line}
.para{font:700 29px 'Dancing Script',Caveat,cursive;color:var(--oro)}
.firma{font:700 23px 'Dancing Script',Caveat,cursive;color:var(--oro);margin:-6px 0 16px}
.primario{border:none;border-radius:999px;padding:14px 28px;background:linear-gradient(180deg,#FF93B9,#F0568D);
  color:#2A0716;font:700 17px Fredoka,sans-serif;box-shadow:0 8px 22px rgba(240,86,141,.35)}
.suave{display:block;margin:12px auto 0;border:none;background:none;color:var(--tenue);font:700 13px Nunito,sans-serif;text-decoration:underline}
.icono{font-size:46px;line-height:1;margin-bottom:6px}
.polaroid{background:#FFFDF6;padding:10px 10px 14px;border-radius:6px;transform:rotate(-2deg);margin:4px auto 16px;max-width:270px;
  box-shadow:0 18px 40px rgba(0,0,0,.45)}
.polaroid .foto{aspect-ratio:1/1;border-radius:3px;overflow:hidden;background:linear-gradient(145deg,#FF9A8B,#B79CFF);max-width:100%}
.polaroid img{width:100%;height:100%;object-fit:cover;display:block}
.polaroid b{display:block;font:700 20px/1.25 'Dancing Script',Caveat,cursive;color:#3A2140;margin-top:8px;white-space:pre-line}
.etiqueta{display:inline-block;font:800 11.5px Nunito,sans-serif;letter-spacing:.08em;color:var(--oro);margin-bottom:8px;text-transform:uppercase}
.pie{font-size:11px;letter-spacing:.3em;color:#7F6FA0;text-align:center}

/* marco de los juegos */
.escena{position:fixed;inset:0}
.escena canvas{display:block;width:100%;height:100%}
.hud{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;
  pointer-events:none;z-index:5;padding:0 96px}
.hud h1{margin:0;font:800 23px/1.08 "Baloo 2",Fredoka,sans-serif;color:#FFC531;text-shadow:0 2px 12px rgba(0,0,0,.65);text-align:center;letter-spacing:.01em}   /* la letra de la marca, igual que las portadas */
.hud small{font:700 12px Nunito,sans-serif;color:#D9CCF0;margin-top:5px;text-shadow:0 1px 8px #000;text-align:center}
.puntos{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.puntos i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18);transition:background .3s,transform .3s}
.puntos i.on{background:var(--rosa);transform:scale(1.2);box-shadow:0 0 10px var(--rosa)}
.marcador{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:6;text-align:right;pointer-events:none}
.marcador b{display:block;font:700 26px/1 Fredoka,sans-serif;color:var(--oro);font-variant-numeric:tabular-nums;text-shadow:0 2px 10px #000}
.marcador span{font:700 10.5px Nunito,sans-serif;color:#D9CCF0;letter-spacing:.06em}
.pista{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;
  color:#EFE4FF;text-shadow:0 2px 10px #000;pointer-events:none;z-index:5;transition:opacity .4s;
  left:50%;right:auto;transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;padding:6px 14px;border-radius:99px;background:rgba(20,14,40,.45)}
.pista:empty{display:none}
.pjs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.pj{border:2px solid var(--borde);background:var(--tarjeta);border-radius:16px;padding:6px 4px 8px;color:var(--crema);font:700 12.5px Nunito,sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.pj canvas{width:72px;height:72px}
.pj.on{border-color:var(--rosa);box-shadow:0 0 0 3px rgba(255,122,168,.25)}
.avopc{text-align:left;margin:-2px 0 16px;display:flex;flex-direction:column;gap:9px}
.avopc .fila{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rw-vista{display:flex;flex-direction:column;align-items:center;margin:-4px 0 2px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.14),rgba(255,255,255,0) 70%);border-radius:18px}
.rw-nota{margin:6px 0 2px;font-size:13px;color:#8A7A66;text-align:center}
.rw-vista canvas{width:160px;height:200px}
.rw-vista small{font:700 11px Nunito,sans-serif;color:var(--tenue)}
#elige .carta{max-height:calc(100vh - 40px);overflow-y:auto}
#elige{z-index:12}
.avopc .fila span{width:64px;font:700 12px Nunito,sans-serif;color:var(--tenue)}
.mu{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0}
.mu.on{border-color:#fff;box-shadow:0 0 0 2px var(--rosa)}
.chip{border:1px solid var(--borde);background:var(--tarjeta);color:var(--crema);border-radius:999px;padding:6px 11px;font:700 12px Nunito,sans-serif}
.chip.on{background:var(--rosa);color:#2A0716;border-color:var(--rosa)}
#b-rec{position:fixed;left:14px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:11;height:40px;border-radius:999px;border:1px solid rgba(255,233,168,.35);
  background:rgba(20,11,38,.62);color:#FFF1DA;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;gap:7px;padding:0 14px;font:800 13px Nunito,sans-serif}
#b-rec .punto{width:10px;height:10px;border-radius:50%;background:#FF4D5E;box-shadow:0 0 8px #FF4D5E}
#b-rec.grabando{background:#E53935;border-color:#E53935;color:#fff}
#b-rec.grabando .punto{background:#fff;animation:late 1s ease-in-out infinite}
#video-listo video{width:100%;max-height:52vh;border-radius:14px;background:#000;margin:4px 0 10px;display:block}
.nota-v{font-size:13px}
a.primario{display:inline-block;text-decoration:none}
a.suave{cursor:pointer}
.pad{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;z-index:5;padding:0 16px}
.pad button{flex:1;max-width:170px;height:58px;border:none;border-radius:18px;background:rgba(46,29,80,.82);color:#FFC2D6;font:700 22px Fredoka,sans-serif;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.pad button:active{transform:translateY(2px)}
.cruz{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,50px);gap:6px;justify-content:center}
.cruz button{max-width:none;height:auto}
/* isla de bloques y carrera */
.pad .joy{position:relative;width:124px;height:124px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),rgba(20,11,38,.4));border:2px solid rgba(255,255,255,.35);touch-action:none;flex:none}
.pad .joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,241,218,.9);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.isla-ui #joy{position:fixed;left:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;z-index:6;
  background:radial-gradient(circle,rgba(255,255,255,.18),rgba(20,11,38,.35));border:2px solid rgba(255,255,255,.35);touch-action:none}
.isla-ui #joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,241,218,.85);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.isla-ui #saltar,.isla-ui #b-constr,.isla-ui #b-mis{position:fixed;z-index:6;border:none;border-radius:50%;color:#2A0716;font:700 24px Fredoka,sans-serif;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.isla-ui #saltar{right:22px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:76px;height:76px;background:linear-gradient(180deg,#FF93B9,#F0568D);font-size:30px}
.isla-ui #b-constr{right:30px;bottom:calc(122px + env(safe-area-inset-bottom,0px));width:58px;height:58px;background:#FFF1DA}
.isla-ui #b-romper,.isla-ui #b-volar,.isla-ui #bajar{position:fixed;z-index:6;border:none;border-radius:50%;width:54px;height:54px;background:#FFF1DA;font-size:22px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.isla-ui #b-romper{right:32px;bottom:calc(190px + env(safe-area-inset-bottom,0px))}
.isla-ui #b-volar{left:36px;bottom:calc(156px + env(safe-area-inset-bottom,0px))}
.isla-ui #bajar{right:108px;bottom:calc(36px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#9FD8FF,#4FA3E0);color:#08233A;font:700 26px Fredoka,sans-serif}
.isla-ui #b-romper.on,.isla-ui #b-volar.on{background:#7FD6A0}
#bajo-agua{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at 50% 40%,rgba(80,180,255,.12),rgba(10,60,120,.45));opacity:0;transition:opacity .4s}
#bajo-agua.on{opacity:1}
.isla-ui #b-constr.on{background:#7FD6A0}
.isla-ui #b-mis{right:12px;top:calc(10px + env(safe-area-inset-top,0px));width:44px;height:44px;background:rgba(255,241,218,.9);font-size:20px}
.isla-ui #b-baile{position:fixed;z-index:6;left:36px;bottom:calc(222px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border:none;border-radius:50%;background:#FFF1DA;font-size:24px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.isla-ui #b-baile.on{background:#FFC531}
.isla-ui #bailes{position:fixed;z-index:8;left:12px;bottom:calc(284px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;border-radius:18px;background:rgba(255,251,244,.96);box-shadow:0 10px 28px rgba(0,0,0,.35);width:236px}
.isla-ui #bailes button{border:none;border-radius:12px;padding:9px 6px;background:#fff;box-shadow:0 2px 0 #D2A877;font:800 13px "Baloo 2",Fredoka,sans-serif;color:#23291E}
.isla-ui #bailes button:active{transform:translateY(1px)}
.isla-ui #accion{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(146px + env(safe-area-inset-bottom,0px));z-index:7;border:none;border-radius:999px;
  padding:13px 22px;background:#FFF1DA;color:#3A2140;font:700 16px Fredoka,sans-serif;box-shadow:0 8px 22px rgba(0,0,0,.35);animation:lateC 1.6s ease-in-out infinite;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
@keyframes lateC{50%{transform:translateX(-50%) scale(1.06)}}
.isla-ui #sinc{position:fixed;right:12px;top:calc(60px + env(safe-area-inset-top,0px));z-index:6;font:800 10.5px Nunito,sans-serif;color:#FFF1DA;background:rgba(20,11,38,.5);padding:4px 9px;border-radius:99px;pointer-events:none}
.isla-ui #inv{position:fixed;left:0;right:0;bottom:calc(254px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:6px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}
.isla-ui #inv button{flex:none;width:58px;height:62px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:rgba(20,11,38,.72);color:#FFF1DA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 9.5px Nunito,sans-serif;padding:0}
.isla-ui #inv button.on{border-color:#FFC94A;background:rgba(255,201,74,.3)}
.isla-ui #inv canvas{width:30px;height:30px;image-rendering:pixelated;border-radius:4px}
.isla-ui #inv b{font-size:24px;line-height:30px}
body.isla #b-rec{bottom:auto;left:auto;right:12px;top:calc(88px + env(safe-area-inset-top,0px))}
body.isla .pista{bottom:calc(326px + env(safe-area-inset-bottom,0px))}
ul.mis{list-style:none;padding:0;margin:8px 0 14px;text-align:left}
ul.mis li{padding:9px 12px;border-radius:12px;background:var(--tarjeta);border:1px solid var(--borde);margin-bottom:7px;font-size:14px}
ul.mis li.ok{opacity:.6;text-decoration:line-through}
ul.mis small{color:var(--oro);font-weight:800;text-decoration:none}
.salas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 12px}
.salas button{border:1px solid var(--borde);background:var(--tarjeta);color:var(--crema);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.salas i{font-style:normal;font-size:26px}.salas b{font:700 13px Fredoka,sans-serif}.salas small{font-size:10px;color:var(--tenue);line-height:1.2}
#sala-v:empty{display:none}#sala-v{margin-bottom:12px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dos .foto,.gal .foto{aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:linear-gradient(145deg,#FF9A8B,#B79CFF);border:none;padding:0}
.dos img,.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.peli{background:#000;border-radius:12px;padding:8px 8px 12px;margin:6px 0 14px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.peli .foto{aspect-ratio:1/1;overflow:hidden;border-radius:6px}
.peli img{width:100%;height:100%;object-fit:cover;display:block;animation:ken 2.2s ease-out both}
@keyframes ken{from{transform:scale(1.18);opacity:0}25%{opacity:1}to{transform:scale(1)}}
.peli b{display:block;font:700 19px 'Dancing Script',Caveat,cursive;color:#FFF1DA;margin-top:8px;min-height:26px}
img.masc{width:130px;height:auto;display:block;margin:0 auto 6px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.4))}
.barra-m{position:fixed;left:50%;transform:translateX(-50%);top:calc(74px + env(safe-area-inset-top,0px));width:min(260px,60vw);height:10px;border-radius:99px;background:rgba(20,11,38,.45);z-index:5;pointer-events:none}
.barra-m i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(90deg,#FFC94A,#FF7AA8)}
.barra-m span{position:absolute;right:-8px;top:-8px;font-size:18px}
body.corre .marcador span{font-size:15px;letter-spacing:0}
/* bitácora 3D */
.bita-top{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:5;text-align:center;pointer-events:none;padding:0 96px}
.bita-top .nombres{font-size:34px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.bita-cont{font:700 12.5px Nunito,sans-serif;color:#EFE4FF;margin-top:4px;text-shadow:0 1px 8px #000}
.bita-cont b{color:var(--oro);font:700 16px Fredoka,sans-serif}
.bita-cont{display:inline-block;background:rgba(20,10,45,.45);border:1px solid rgba(255,255,255,.14);padding:5px 14px;border-radius:99px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bita-bot .primario{background:linear-gradient(90deg,#FF6FB1,#9B7BFF);color:#fff;box-shadow:0 8px 30px rgba(155,123,255,.5),inset 0 1px 0 rgba(255,255,255,.35)}

<script>
/* ======================= EL NÚCLEO DE RUWAY =======================
   Lo que TODAS las experiencias comparten, en un solo archivo que cargan
   las dos páginas (u.html: universo, árbol, vela; x.html: los juegos, el
   planeta, la bitácora, las cartas). La experiencia número 20 ya nace con
   todo esto sin escribir nada nuevo:

   · Progreso del regalo: qué recuerdos ya vio, si llegó al final, cuántos
     días distintos lo abrió. Por código de regalo, en el teléfono.
   · Colección (inventario): corazones, estrellas, flores, besos y regalos
     que se juntan en cualquier juego y se suman en la misma mochila.
   · Logros y desbloqueos: la carta secreta se abre al ver todos los
     recuerdos; el álbum se va llenando con lo que se descubre.
   · La mochila 🎒: una sola pantalla para ver el álbum, la carta, la
     colección y los logros, igual en todas las experiencias.
   · El avance llega al servidor (a la misma hoja de Universos) para que la
     app muestre qué experiencias se terminan y cuáles gustan más.
   · El audio: la canción y la nota de voz se traen igual en todas (por
     pedazos, con refuerzo) y quedan guardadas: la segunda vez suenan al
     instante.
   · El video: el mismo formato, la misma hoja de "tu video está listo" y el
     mismo grabador de 30 segundos para los estados.
   · Fluidez: si un juego 3D va lento en ese teléfono, baja la resolución
     sola hasta que corra suave.

   construir.js lo mete DENTRO de cada página (u.html, x.html y el universo de
   Apps Script, como Nucleo.html): no es un archivo aparte que pueda no llegar,
   y hay un solo original, este. Las páginas lo llaman con
   nucleo(function(N){ ... }). */
(function(){
  if(window.Nucleo) return;
  var N={}, D={}, cod='', clave='', P=null, api='', previa=false, fotosFn=null, personaje='', envioT=0, boton=null, cuentaEl=null, exp='', PASE=[], paseEl=null;
  var ITEMS={corazon:['❤️','Corazones'],estrella:['⭐','Estrellas'],flor:['🌸','Flores'],beso:['💋','Besos'],regalo:['🎁','Regalos']};
  var LOGROS=[
    {id:'primero',ic:'📸',nom:'Primer recuerdo',txt:'Abriste tu primer recuerdo'},
    {id:'todos',ic:'💌',nom:'Todos los recuerdos',txt:'Viste todas las fotos y se abrió la carta secreta'},
    {id:'coleccion',ic:'🧺',nom:'Coleccionista',txt:'Juntaste 20 cosas lindas en tu mochila'},
    {id:'fin',ic:'🏁',nom:'Hasta el final',txt:'Llegaste al final de la experiencia'},
    {id:'vuelve',ic:'🔁',nom:'Volviste',txt:'Lo abriste en dos días distintos'},
    {id:'fiel',ic:'💞',nom:'Siempre vuelves',txt:'Lo abriste en cinco días distintos'}];
  function hoy(){ var d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
  /* las experiencias, para nombrarlas en el Pase Ruway (las de u.html se abren allá; las demás en x.html) */
  var EXPS={universo:['🌌','Universo'],arbol:['🎄','Árbol que se enciende'],vela:['🕯️','Vela que no se apaga'],constelaciones:['✨','Constelaciones'],
    planeta:['🪐','Planeta propio'],laberinto:['🧸','Laberinto 3D'],carrito:['🏁','La gran carrera'],isla:['🏝️','Nuestra isla'],match:['💕','El regalo secreto'],
    corre:['🏃','Corre hasta mí'],bitacora:['📖','Nuestra bitácora'],cartas:['💌','Cartas para abrir cuando…']};
  var EN_U=/^(universo|arbol|vela)$/;
  function vacio(){ return {v:1,vistos:{},inv:{},logros:{},fin:0,dias:[],hechas:{},ev:{}}; }
  /* Lo guardado se revisa: un valor raro vuelve a cero en vez de romper la mochila. */
  function leer(){ var p=vacio();
    try{ var x=JSON.parse(localStorage.getItem(clave)||'null'); if(!x||typeof x!=='object') return p;
      if(x.vistos&&typeof x.vistos==='object') Object.keys(x.vistos).slice(0,40).forEach(function(k){ if(/^[\w:\/.\-?=&%]{1,300}$/.test(k)) p.vistos[k]=1; });
      if(x.inv&&typeof x.inv==='object') Object.keys(ITEMS).forEach(function(k){ var n=+x.inv[k]; if(n>0) p.inv[k]=Math.min(9999,Math.floor(n)); });
      if(x.logros&&typeof x.logros==='object') LOGROS.forEach(function(l){ var t=+x.logros[l.id]; if(t>0) p.logros[l.id]=t; });
      p.fin=x.fin?1:0;
      if(Array.isArray(x.dias)) p.dias=x.dias.filter(function(d){ return d===(d|0)&&d>20200101&&d<21000101; }).slice(-30);
      if(x.hechas&&typeof x.hechas==='object') Object.keys(x.hechas).forEach(function(k){ if(EXPS[k]) p.hechas[k]=1; });
      if(x.ev&&typeof x.ev==='object') Object.keys(x.ev).forEach(function(k){ if(!EXPS[k]||!x.ev[k]||typeof x.ev[k]!=='object') return; p.ev[k]={};
        Object.keys(x.ev[k]).slice(0,40).forEach(function(j){ if(/^[\w:\/.\-?=&%]{1,300}$/.test(j)) p.ev[k][j]=1; }); });
    }catch(e){}
    return p; }
  /* ---- Pase Ruway: varias experiencias con el mismo código, que se abren una tras otra ---- */
  function paseDe(d){ var l=[]; (Array.isArray(d&&d.pase)?d.pase:[]).forEach(function(x){ x=String(x||''); if(EXPS[x] && l.indexOf(x)<0 && l.length<4) l.push(x); }); return l.length>1?l:[]; }
  function abierta(l,h,i,d){ return i===0 || !!h[l[i-1]] || !!(d&&(d.vistaPrevia||window.__DEMO)); }
  function hecha(){ if(!P||!exp||P.hechas[exp]) return; P.hechas[exp]=1; guardar();
    var i=PASE.indexOf(exp), sig=i>=0?PASE[i+1]:null;
    if(sig) setTimeout(function(){ toast('🔓','¡Se abrió '+EXPS[sig][1]+'!','Tu Pase Ruway sigue: tócalo en 🎟️'); latir(paseEl); },1800); }
  function guardar(){ if(!P) return; try{ localStorage.setItem(clave,JSON.stringify(P)); }catch(e){} programarEnvio(); pintarBoton(); }
  function totalFotos(){ try{ return (fotosFn&&fotosFn()||[]).length; }catch(e){ return 0; } }
  function vistos(){ return P?Object.keys(P.vistos).length:0; }
  function objetos(){ var s=0; if(P) Object.keys(P.inv).forEach(function(k){ s+=P.inv[k]; }); return s; }

  /* ---- el sonidito y el aviso de los desbloqueos ---- */
  var ac=null;
  function tin(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); [784,988,1319].forEach(function(f,i){ var o=ac.createOscillator(), v=ac.createGain(), t=ac.currentTime+i*.09;
      o.type='sine'; o.frequency.value=f; v.gain.setValueAtTime(.06,t); v.gain.exponentialRampToValueAtTime(.0001,t+.35); o.connect(v); v.connect(ac.destination); o.start(t); o.stop(t+.36); }); }catch(e){} }
  function toast(ic,t,sub){ estilos(); var d=document.createElement('div'); d.className='rn-toast'; d.innerHTML='<i></i><div><b></b><small></small></div>';
    d.querySelector('i').textContent=ic; d.querySelector('b').textContent=t; d.querySelector('small').textContent=sub||''; document.body.appendChild(d);
    requestAnimationFrame(function(){ d.classList.add('on'); }); setTimeout(function(){ d.classList.remove('on'); setTimeout(function(){ d.remove(); },500); },3200); tin(); }
  function logro(id){ if(!P||P.logros[id]) return; var l=LOGROS.filter(function(x){ return x.id===id; })[0]; if(!l) return;
    P.logros[id]=Date.now(); guardar(); toast(l.ic,'¡Desbloqueaste: '+l.nom+'!',l.txt); }

  /* ---- lo que llaman las experiencias ---- */
  N.iniciar=function(o){
    o=o||{}; D=o.datos||{}; var c=String(D.codigo||'').trim().toUpperCase();
    cod=/^[A-Z0-9]{4,10}$/.test(c)?c:'DEMO'; clave='ruway:prog:'+cod; api=typeof o.api==='string'?o.api:''; previa=!!(D.vistaPrevia||window.__DEMO);
    fotosFn=o.fotos||null; personaje=o.personaje||''; P=leer(); exp=EXPS[o.exp]?o.exp:(EXPS[D.tipo]?D.tipo:''); PASE=paseDe(D);
    var h=hoy(); if(P.dias.indexOf(h)<0){ P.dias.push(h); P.dias=P.dias.slice(-30); }
    guardar(); if(P.dias.length>=2) logro('vuelve'); if(P.dias.length>=5) logro('fiel');
    if(o.boton!==false) N.boton(o.dentro||null);
  };
  /* un recuerdo que se vio (la clave es la que use la página: el número o la dirección de la foto) */
  N.vio=function(k){ if(!P||k==null) return; k=String(k).slice(0,300);
    /* en un Pase, cada experiencia lleva su cuenta: ver todos sus recuerdos también la termina */
    if(exp){ var e=P.ev[exp]=P.ev[exp]||{}; if(!e[k]){ e[k]=1; var te=totalFotos(); if(te && Object.keys(e).length>=te) hecha(); guardar(); } }
    if(P.vistos[k]) return; P.vistos[k]=1; guardar();
    var n=vistos(), t=totalFotos(); if(n===1) logro('primero'); if(t&&n>=t) logro('todos'); };
  /* algo que se juntó en un juego: corazon, estrella, flor, beso o regalo */
  N.visto=function(k){ return !!(P && P.vistos[String(k)]); };
  N.gano=function(item,k){ if(!P||!ITEMS[item]) return; P.inv[item]=Math.min(9999,(P.inv[item]||0)+(k||1)); guardar(); latir();
    if(objetos()>=20) logro('coleccion'); };
  N.termino=function(){ if(!P) return; if(!P.fin){ P.fin=1; guardar(); } logro('fin'); hecha(); };
  N.estado=function(){ return {cod:cod,vistos:vistos(),total:totalFotos(),objetos:objetos(),inv:P?JSON.parse(JSON.stringify(P.inv)):{},logros:P?Object.keys(P.logros):[],fin:P?P.fin:0,dias:P?P.dias.length:0,
    exp:exp,pase:N.pase.lista()}; };
  N.pase={
    /* las del pase, con si ya se terminó y si ya se puede abrir */
    lista:function(){ var h=P?P.hechas:{}; return PASE.map(function(x,i){ return {id:x,ic:EXPS[x][0],nom:EXPS[x][1],hecha:!!h[x],abierta:abierta(PASE,h,i,D),actual:x===exp}; }); },
    /* ANTES de iniciar: qué experiencia toca mostrar al abrir el enlace. La pedida (?x=) si ya se
       desbloqueó; si no, la primera que falta terminar. Sin pase, null. */
    destino:function(datos,pedida){ var l=paseDe(datos); if(!l.length) return null; var c=String((datos&&datos.codigo)||'').trim().toUpperCase(), h={};
      try{ var x=JSON.parse(localStorage.getItem('ruway:prog:'+(/^[A-Z0-9]{4,10}$/.test(c)?c:'DEMO'))||'null'); if(x&&x.hechas) Object.keys(x.hechas).forEach(function(k){ h[k]=1; }); }catch(e){}
      var i=l.indexOf(String(pedida||'')); if(i>=0 && abierta(l,h,i,datos)) return l[i];
      for(var j=0;j<l.length;j++) if(!h[l[j]]) return l[j];
      return l[0]; },
    /* la dirección de una experiencia del pase: misma página del regalo, con ?x= */
    url:function(id){ try{ var u=new URL(location.href); u.pathname=u.pathname.replace(/[^\/]*$/,EN_U.test(id)?'u.html':'x.html'); u.searchParams.set('x',id); return u.href; }catch(e){ return ''; } },
    enU:function(id){ return EN_U.test(id); },
    ir:function(id){ var u=N.pase.url(id); if(u) location.href=u; },

        cuerpo.querySelectorAll('.rn-foto').forEach(function(b){ b.onclick=function(){ var f=F[+b.dataset.i]; if(!P.vistos[String(f.clave)]){ toast('🔎','Todavía escondido','Encuéntralo en el juego para verlo aquí'); return; }

})();

var DATOS=null, FOTOS=[], TIPO='', HOY=Date.now();
/* El núcleo común (ruway-nucleo.js): progreso, colección, logros, mochila, audio guardado y
   fluidez, iguales en todas las experiencias. Baja aparte y en paralelo: lo que se le pide
   antes de que llegue espera en fila. Si no llega, todo sigue funcionando sin él. */
function fluido(R){ nucleo(function(N){ N.fluido(R); }); return R; }   /* si el 3D va lento, menos píxeles */
function nucleo(fn){ if(window.Nucleo){ try{ fn(window.Nucleo); }catch(e){} } else (window.__nucleoCola=window.__nucleoCola||[]).push(fn); }

/* ============ traer los datos (igual que u.html) ============ */
function params(){
  var q=new URLSearchParams(location.search), r={};
  Object.keys(MAPA).forEach(function(k){ var v=q.get(k); if(v && !r[MAPA[k]]) r[MAPA[k]]=v; });
  return r;
}
function llave(p){ var c=String(p.rcod||'').trim().toUpperCase(); return 'ruway:uni:'+(/^[A-Z0-9]{4,10}$/.test(c)?c:'-'); }
function guardado(p){ try{ var v=JSON.parse(localStorage.getItem(llave(p))||'null');
  if(v && v.d && (Date.now()-v.t)<30*864e5) return v.d; }catch(e){} return null; }
function guardar(p,d){ if(!d||d.bloqueado||d.vistaPrevia) return; try{ localStorage.setItem(llave(p),JSON.stringify({t:Date.now(),d:d})); }catch(e){} }
var _n=0;
function jsonp(fn,args,ok,mal,espera){
  var hecho=false, vivos=0, muertos=0;
  function intento(ultimo){
    vivos++; var nom='__x'+(++_n), t=document.createElement('script');
    function limpiar(){ clearTimeout(ref); clearTimeout(tope); try{ delete window[nom]; }catch(e){ window[nom]=undefined; } if(t.parentNode) t.parentNode.removeChild(t); }
    function murio(){ limpiar(); muertos++; if(muertos<vivos) return; if(!ultimo){ setTimeout(function(){ intento(true); },900); return; }
      if(!hecho){ hecho=true; mal&&mal(); } }
    window[nom]=function(r){ limpiar(); if(hecho) return; hecho=true; if(r&&r.ok) ok(r.r); else mal&&mal(r&&r.error); };
    t.onerror=murio;
    var ref=ultimo?0:setTimeout(function(){ intento(true); },espera||7000), tope=setTimeout(murio,45000);
    t.src=API+(API.indexOf('?')>=0?'&':'?')+'vista=api&rfn='+fn+'&rcb='+nom+'&rargs='+encodeURIComponent(JSON.stringify(args));
    document.head.appendChild(t);
  }
  intento(false);
}
function espera(t,perdido){ document.getElementById('espera-txt').textContent=t; if(perdido) document.getElementById('espera').classList.add('perdido'); }
(function(){
  /* Solo para la muestra que se enseña a los clientes: datos de ejemplo. */
  if(window.__DEMO){ setTimeout(function(){ listo(window.__DEMO); },0); return; }
  var p=params(), v=guardado(p);
  if(v && v.ok){ setTimeout(function(){ listo(v); },0); jsonp('universo',[p],function(d){ if(d&&d.ok) guardar(p,d); },function(){}); return; }
  var t0=Date.now(), reloj=setInterval(function(){ var s=(Date.now()-t0)/1000;
    if(s>22) espera('Está tardando, pero seguimos'); else if(s>11) espera('Despertando tu regalo'); },1000);
  jsonp('universo',[p],function(d){ clearInterval(reloj);
    if(!d||!d.ok){ espera('No encontramos este regalo.\nRevisa el enlace o escríbenos.',true); return; }
    guardar(p,d); listo(d);
  },function(){ clearInterval(reloj); espera('No pudimos abrirlo.\nRevisa tu conexión.',true); });
})();

/* Cuántas veces se abre y cuánto rato se queda quien lo recibió.
   Una marca al entrar y el tiempo al salir (o al cambiar de app). Va con
   sendBeacon: el teléfono lo manda aunque la página ya se esté cerrando.
   Las vistas previas del taller no cuentan. */
var Visita=(function(){
  var cod='', t0=0;
  function mandar(nueva,seg){
    if(typeof API!=='string' || !API) return;
    var cuerpo=JSON.stringify({fn:'visita',args:[cod,seg,nueva]});
    try{ if(navigator.sendBeacon && navigator.sendBeacon(API,new Blob([cuerpo],{type:'text/plain;charset=utf-8'}))) return; }catch(e){}

    H0.puntos(hechas);
    activa=false;
    var sigue=function(){ activa=true;
      if(hechas>=n){ lineas.push({a:n-1,b:0,u:0}); fin=t; pista('');
        H0.sub('Nuestra constelación'); setTimeout(function(){ final('Esta constelación es nuestra','Mirar el cielo otra vez'); },3200); }
      else pista('Ahora la siguiente'); };
    nucleo(function(N){ N.gano('estrella'); });

  }
  function ventanas(hz){ g.fillStyle='rgba(255,215,106,.85)';
    for(var k=0;k<60;k++){ var x=((k*53-cielo*.06)%W+W)%W, y=hz-6-((k*37)%Math.round(H*.12)); if(k%3) g.fillRect(Math.round(x/4)*4,Math.round(y/4)*4,3,3); } }
  function nieveCumbres(hz){ g.fillStyle='#F6FAFF'; var P=8, off=cielo*.07;
    for(var x=-P;x<=W+P;x+=P){ var u=(x+off)*.009, y=Math.sin(u*1.3+6)*.5+Math.sin(u*3.1+12)*.3+.55;
      if(y>.72){ var top=Math.round((hz-y*H*.16)/4)*4; g.fillRect(x,top,P,Math.round((y-.72)*H*.3/4)*4+4); } } }

  /* ---- los adornos, a escala según la distancia (e = píxeles por cada mil unidades de mundo) ---- */
  var ANCHOS={pino:900,pinoN:900,redondo:1000,cactus:620,roca:760,rocaN:760,arbusto:650,seco:650,flI:640,flD:640,farola:300,muneco:520,edif:2600};
  function adorno(o,x,y,k){
    var e=k*ESC/2*ANCHO/1000;
    if(e<.015) return;

    if(SPR[o.t]){ dib(SPR[o.t],x,y,e*ANCHOS[o.t]);
      if(o.t==='farola' && TEMA.noche){ var gl=g.createRadialGradient(x+e*60,y-e*1330,0,x+e*60,y-e*1330,e*500);
        gl.addColorStop(0,'rgba(255,233,160,.55)'); gl.addColorStop(1,'rgba(255,233,160,0)'); g.fillStyle=gl; g.fillRect(x-e*500,y-e*1830,e*1100,e*1000); }
      return; }
    if(o.t==='flor'){ g.strokeStyle='#3F8E3A'; g.lineWidth=Math.max(1,e*50); g.beginPath(); g.moveTo(x,y); g.lineTo(x,y-e*700); g.stroke();
      g.fillStyle=o.c; for(var p=0;p<6;p++){ var a=p/6*6.283; g.beginPath(); g.ellipse(x+Math.cos(a)*e*150,y-e*700+Math.sin(a)*e*150,e*120,e*60,a,0,6.3); g.fill(); }
      g.fillStyle='#8A4A1C'; g.beginPath(); g.arc(x,y-e*700,e*80,0,6.3); g.fill(); }
    else if(o.t==='cartel'){ g.fillStyle='#5A3A22'; g.fillRect(x-e*420,y-e*500,e*50,e*500); g.fillRect(x+e*370,y-e*500,e*50,e*500);
      g.fillStyle='#FFFBF4'; g.fillRect(x-e*520,y-e*980,e*1040,e*500); g.fillStyle='#5C6B4A'; g.fillRect(x-e*490,y-e*950,e*980,e*440);
      g.fillStyle='#FFC531'; g.font='800 '+Math.max(6,e*230)+'px "Baloo 2", Fredoka, sans-serif'; g.textAlign='center'; g.fillText('RUWAY ♥',x,y-e*660); }
    else if(o.t==='meta'){ var w=e*2400; g.fillStyle='#3B2A5E'; g.fillRect(x-w/2-e*80,y-e*1300,e*80,e*1300); g.fillRect(x+w/2,y-e*1300,e*80,e*1300);
      for(var c=0;c<16;c++){ g.fillStyle=(c%2)?'#fff':'#222'; g.fillRect(x-w/2+c*w/16,y-e*1300,w/16+1,e*180); } }

  }
  function corazon(x,y,s,c){ g.fillStyle=c; g.beginPath(); g.moveTo(x,y+s*.9); g.bezierCurveTo(x-s*1.3,y,x-s*.7,y-s*.95,x,y-s*.35); g.bezierCurveTo(x+s*.7,y-s*.95,x+s*1.3,y,x,y+s*.9); g.fill(); }

    dib(auto(col,modelo,gi,yo),x,y,w); }

  /* ---- el marcador, pintado como en las consolas ---- */
  function lcd(txt,x,y,tam,col){ g.font='700 '+tam+'px "Courier New", monospace'; g.textAlign='right'; g.fillStyle='rgba(0,0,0,.45)'; g.fillText(txt,x+2,y+2); g.fillStyle=col; g.fillText(txt,x,y); }
  function mapaEn(M,ox,oy,mw,mh,grueso){ var esc=Math.min(mw/M.w,mh/M.h), dx=ox+(mw-M.w*esc)/2, dy=oy+(mh-M.h*esc)/2;
    function P(p){ return [dx+(p[0]-M.mx)*esc,dy+(p[1]-M.my)*esc]; }
    g.lineJoin='round'; g.lineCap='round';
    [[grueso+4,'#23291E'],[grueso,'#FFFFFF']].forEach(function(s){ g.strokeStyle=s[1]; g.lineWidth=s[0]; g.beginPath();
      M.p.forEach(function(p,k){ var q=P(p); if(k) g.lineTo(q[0],q[1]); else g.moveTo(q[0],q[1]); }); g.closePath(); g.stroke(); });
    return P; }
  function punto(M,P,d){ var k=Math.floor(((d%LARGO+LARGO)%LARGO)/SEG/M.paso)%M.p.length; return P(M.p[k]); }
  function marcador(){
    var km=Math.round(vel/VMAX*240*(turboT>0?1.1:1)), top=96;
    g.fillStyle='rgba(20,11,38,.55)'; g.fillRect(W-150,top-26,140,70);
    lcd(('00'+km).slice(-3)+' km/h',W-16,top,22,'#FF4040');
    var s=Math.floor(reloj), cs=Math.floor((reloj%1)*100);
    lcd(('0'+Math.floor(s/60)).slice(-2)+"'"+('0'+s%60).slice(-2)+'"'+('0'+cs).slice(-2),W-16,top+28,17,'#FFF1DA');
    for(var k=0;k<14;k++){ g.fillStyle=k<km/240*14?(k<9?'#4CD964':k<12?'#FFC94A':'#FF4040'):'rgba(255,255,255,.15)'; g.fillRect(W-150+k*10,top+38,8,6); }
    /* el mapa: la silueta entera del circuito, la salida, los rivales y yo */
    var mw=104, mh=96, ox=10, oy=top-28;
    g.fillStyle='rgba(20,11,38,.5)'; g.fillRect(ox-4,oy-4,mw+8,mh+8);
    var P=mapaEn(mapa,ox+4,oy+4,mw-8,mh-8,5);
    var sal=P(mapa.p[0]); g.fillStyle='#FFC531'; g.fillRect(sal[0]-5,sal[1]-2,10,4);
    rivales.forEach(function(r){ var q=punto(mapa,P,r.d); g.fillStyle=r.c; g.fillRect(Math.round(q[0])-2,Math.round(q[1])-2,4,4); });
    var yoP=punto(mapa,P,dist); g.fillStyle=(Math.floor(t*4)%2)?'#FF3D7F':'#FFFFFF'; g.fillRect(Math.round(yoP[0])-3,Math.round(yoP[1])-3,7,7);
    var vuelta=Math.min(VUELTAS,Math.floor(dist/LARGO)+1);
    g.textAlign='left'; g.font='800 15px "Baloo 2", Fredoka, sans-serif'; g.fillStyle='#FFF1DA'; g.fillText('VUELTA '+vuelta+'/'+VUELTAS,14,H-118);
    g.textAlign='right'; g.font='800 38px "Baloo 2", Fredoka, sans-serif'; g.fillStyle='rgba(0,0,0,.4)'; g.fillText(lugar+'º',W-12,H-110); g.fillStyle='#FFC94A'; g.fillText(lugar+'º',W-14,H-112);
  }

  function segDe(z){ return segs[Math.floor(z/SEG)%N]; }
  function actualizar(dt){
    giro+=((izq?-1:der?1:0)-giro)*Math.min(1,dt*10);
    if(!jugando){ vel*=.9; if(eligiendo){ pos=(pos+SEG*14*dt)%LARGO; cielo+=segDe(pos).curva*dt*30; } return; }
    reloj+=dt;
    var s=segDe(pos+pZ), pct=vel/VMAX, dx=dt*2*pct;
    if(izq) pX-=dx; if(der) pX+=dx;
    pX-=dx*pct*s.curva*.22;
    var tope=VMAX*(turboT>0?1.25:1);
    if(turboT>0) turboT-=dt;
    vel+=(choque>0?-VMAX*.8:VMAX*.55)*dt; if(choque>0) choque-=dt;
    if((pX<-1||pX>1) && vel>VMAX*.35) vel-=VMAX*1.2*dt;
    vel=Math.max(0,Math.min(vel,tope)); pX=Math.max(-1.7,Math.min(1.7,pX));
    s.obj.forEach(function(o){ if(o.t!=='meta' && o.t!=='edif' && Math.abs(pX-o.x)<.3 && vel>VMAX*.2){ vel=VMAX*.15; pX+=(pX>o.x?.25:-.25); nota(140,.1,'square',.05); } });
    pos=(pos+vel*dt)%LARGO; dist+=vel*dt; cielo+=s.curva*pct*dt*140;
    rivales.forEach(function(r){ r.d+=r.v*dt; r.x+=Math.sin(t*.7+r.v)*dt*.08; r.x=Math.max(-.75,Math.min(.75,r.x));
      var delta=r.d-dist;
      if(delta>0 && delta<SEG*.9 && Math.abs(pX-r.x)<CARW/ANCHO*1.05 && vel>r.v){ vel=r.v*.7; choque=.25; dist=r.d-SEG*.95; pos=(dist%LARGO+LARGO)%LARGO; if(navigator.vibrate) try{ navigator.vibrate(40); }catch(e){} nota(160,.12,'sawtooth',.05); } });
    lugar=1+rivales.filter(function(r){ return r.d>dist; }).length;
    for(var k=0;k<arcos.length;k++){ var a=arcos[k]; if(!a.hecho && dist>=a.d){ a.hecho=true; abrir(k); break; } }
    if(dist>=TOTAL && !fin){ fin=true; jugando=false; terminar(); }
  }
  function abrir(k){ jugando=false; var cuantos=arcos.filter(function(a){return a.hecho;}).length; H0.puntos(cuantos); nucleo(function(N){ N.gano('estrella'); });
    campanita([660,830,990]);
    setTimeout(function(){ recuerdo(k,'Recuerdo '+(k+1)+' de '+n,cuantos>=n?'¡A la meta!':'Seguir manejando',function(){ jugando=true; }); },250); }
  function terminar(){
    for(var k=0;k<30;k++) setTimeout(function(){ nota(700+Math.random()*500,.08,'triangle',.03); },k*40);
    setTimeout(function(){ final(lugar===1?'¡Ganaste la carrera, y a mí también!':'Llegaste '+lugar+'º, pero en mi corazón vas primero','Correr otra vez',function(){
      pintarTurbo(); elegir(); }); },900);
  }
  function pintar(){
    g.setTransform(DPR,0,0,DPR,0,0); g.imageSmoothingEnabled=false;
    fondo();
    var base=segDe(pos), bp=(pos%SEG)/SEG, ps=segDe(pos+pZ), pp=((pos+pZ)%SEG)/SEG;
    var pY=ps.p1.w.y+(ps.p2.w.y-ps.p1.w.y)*pp, maxy=H, x=0, dx=-(base.curva*bp), k, q;
    for(k=0;k<VISTA;k++){ q=segs[(base.i+k)%N]; q.vuelta=q.i<base.i; q.clip=maxy; q.autos.length=0;
      proyectar(q.p1,pX*ANCHO-x,pY+CAMH,pos-(q.vuelta?LARGO:0));
      proyectar(q.p2,pX*ANCHO-x-dx,pY+CAMH,pos-(q.vuelta?LARGO:0));
      x+=dx; dx+=q.curva;
      if(q.p1.c.z<=PROF || q.p2.s.y>=q.p1.s.y || q.p2.s.y>=maxy) continue;
      var f=k/VISTA; tramoPista(q.p1.s.y,q.p1.s.x,q.p1.s.w,q.p2.s.y,q.p2.s.x,q.p2.s.w,q.franja,Math.min(.85,f*f*1.3));
      maxy=q.p1.s.y; }
    /* los rivales van donde está su auto, no donde está la cámara: igual que el mío, pZ más adelante */
    rivales.forEach(function(r){ var z=((r.d+pZ)%LARGO+LARGO)%LARGO, sq=segDe(z); r.f=(z%SEG)/SEG; sq.autos.push(r); });
    var vueltaYo=Math.floor(dist/LARGO);
    for(k=VISTA-1;k>0;k--){ q=segs[(base.i+k)%N]; if(!q.p1.s.k || q.p1.c.z<=PROF) continue;
      g.save(); g.beginPath(); g.rect(0,0,W,q.clip); g.clip();
      q.obj.forEach(function(o){ adorno(o,q.p1.s.x+q.p1.s.w*o.x*(o.t==='meta'?0:1),q.p1.s.y,q.p1.s.k); });
      arcos.forEach(function(a){ if(a.hecho) return; var dA=a.d-vueltaYo*LARGO; if(dA<0||dA>=LARGO) return;
        if(Math.floor(dA/SEG)===q.i) adorno({t:'arco'},q.p1.s.x,q.p1.s.y,q.p1.s.k); });
      q.autos.forEach(function(r){ var f=r.f||0, kk=q.p1.s.k+(q.p2.s.k-q.p1.s.k)*f,
          sx=q.p1.s.x+(q.p2.s.x-q.p1.s.x)*f, sw=q.p1.s.w+(q.p2.s.w-q.p1.s.w)*f, sy=q.p1.s.y+(q.p2.s.y-q.p1.s.y)*f;
        dibAuto(sx+sw*r.x,sy,kk*ESC/2*CARW,r.c,r.m,Math.abs(q.curva)>2?(q.curva>0?1:-1):0,false); });
      g.restore(); }
    /* yo: el mismo tamaño que tendría un rival a mi misma distancia */
    var wy=ESC/2*CARW/CAMH, sube=(ps.p2.w.y-ps.p1.w.y)>0?-3:0, gi=giro>.35?1:giro<-.35?-1:0;
    var yy=HZ+YS+(vel>10?(Math.floor(t*30)%2):0)+sube;
    dibAuto(W/2+giro*6,yy,wy,'#F2628F',0,gi,true);
    if(turboT>0){ for(var fl=0;fl<2;fl++){ var ex=W/2+giro*6+(fl?1:-1)*wy*.26; g.fillStyle=(Math.floor(t*20)+fl)%2?'#FFC531':'#FF8A3D';
        g.fillRect(Math.round(ex-wy*.04),Math.round(yy-wy*.2),Math.round(wy*.08),Math.round(wy*(.12+Math.random()*.1))); } }
    if(TN==='nevado'){ g.fillStyle='rgba(255,255,255,.85)'; copos.forEach(function(c){ var cx=((c[0]*W+t*20*c[2]-cielo*.3*c[2])%W+W)%W, cy=((c[1]*H+t*60*c[2]+vel*.002*t)%H);
        g.fillRect(Math.round(cx),Math.round(cy),Math.ceil(2*c[2]),Math.ceil(2*c[2])); }); }
    if(eligiendo) return;
    marcador();
    if(reloj<1.6 && jugando){ g.textAlign='center'; g.font='900 64px "Baloo 2", Fredoka, sans-serif'; g.fillStyle='rgba(0,0,0,.35)'; g.fillText(reloj<.8?'¡LISTOS!':'¡YA!',W/2+3,H*.42+3); g.fillStyle='#FFC531'; g.fillText(reloj<.8?'¡LISTOS!':'¡YA!',W/2,H*.42); }
  }

  /* ---- elegir pista: cuatro tarjetas con la silueta de cada circuito ---- */
  var sel=document.createElement('div'); sel.id='pistas'; sel.hidden=true;
  sel.innerHTML='<div class="pi-c"><h2>Elige tu pista</h2><p>Cada una tiene su paisaje y su trazado</p><div class="pi-g"></div></div>';
  document.body.appendChild(sel);
  if(!document.getElementById('pi-css')){ var st=document.createElement('style'); st.id='pi-css';
    st.textContent='#pistas{position:fixed;inset:0;z-index:11;display:flex;align-items:center;justify-content:center;background:rgba(35,41,30,.35);padding:16px}'+
    '#pistas[hidden]{display:none}#pistas .pi-c{background:#FFFBF4;border-radius:26px;padding:18px 16px 16px;max-width:380px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.35);text-align:center;font-family:"Baloo 2",Fredoka,sans-serif}'+
    '#pistas h2{margin:0;color:#5C6B4A;font-size:28px;line-height:1.1}#pistas p{margin:2px 0 12px;color:#8A7A66;font-size:14px}'+
    '#pistas .pi-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}'+
    '#pistas button{border:0;border-radius:18px;padding:0 0 8px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:0 3px 0 #D2A877,0 6px 14px rgba(0,0,0,.12);font:800 16px "Baloo 2",Fredoka,sans-serif;color:#23291E}'+
    '#pistas button:active{transform:translateY(2px);box-shadow:0 1px 0 #D2A877}#pistas canvas{display:block;width:100%;height:92px;image-rendering:pixelated;margin-bottom:6px}';
    document.head.appendChild(st); }
  var grilla=sel.querySelector('.pi-g');
  ORDEN.forEach(function(nom){ var T=PISTAS[nom], b=document.createElement('button'); b.setAttribute('data-pista',nom);
    var c=document.createElement('canvas'); c.width=320; c.height=184; b.appendChild(c); b.appendChild(document.createTextNode(T.ic+' '+T.nom));
    var x=c.getContext('2d'), gv=x.createLinearGradient(0,0,0,184); gv.addColorStop(0,T.cielo[0]); gv.addColorStop(.55,T.cielo[1]); gv.addColorStop(.56,T.pasto[0]); gv.addColorStop(1,T.pasto[1]);
    x.fillStyle=gv; x.fillRect(0,0,320,184);
    var gAnt=g; g=x; mapaEn(trazar(curvasDe(T.tramos),4),60,14,200,156,9); g=gAnt;
    b.addEventListener('click',function(){ empezar(nom); });
    grilla.appendChild(b); });
  function elegir(){ jugando=false; eligiendo=true; sel.hidden=false; pad.style.visibility='hidden'; }
  function empezar(nom){ try{ localStorage.setItem('ruway:pista',nom); }catch(e){}
    montar(nom); sel.hidden=true; eligiendo=false; pad.style.visibility=''; pintarTurbo(); jugando=true;
    pista('Mantén ◀ ▶ para moverte · 🔥 turbo'); setTimeout(function(){ pista(''); },4000); }
  var guardada='desierto'; try{ guardada=localStorage.getItem('ruway:pista')||'desierto'; }catch(e){}
  montar(guardada); elegir();

  var antes=0;
  (function cuadro(ahora){ requestAnimationFrame(cuadro); var dt=antes?Math.min(.05,(ahora-antes)/1000):0; antes=ahora; t+=dt; actualizar(dt); pintar(); })(0);

  function pintarTurbo(){ var b=document.getElementById('turbo'); b.textContent='🔥 ×'+turbo; b.disabled=!turbo; }
  function usarTurbo(){ if(!turbo || !jugando) return; turbo--; turboT=2.2; pintarTurbo(); nota(520,.25,'sawtooth',.05); }
  function mantener(id,fn){ var b=document.getElementById(id);
    b.addEventListener('pointerdown',function(e){ e.preventDefault(); fn(true); });
    ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ b.addEventListener(ev,function(){ fn(false); }); }); }
  mantener('izq',function(v){ izq=v; }); mantener('der',function(v){ der=v; });
  document.getElementById('turbo').addEventListener('pointerdown',function(e){ e.preventDefault(); usarTurbo(); });
  cv.addEventListener('pointerdown',function(e){ if(e.clientX<W/2) izq=true; else der=true; });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ cv.addEventListener(ev,function(){ izq=der=false; }); });
  addEventListener('keydown',function(e){ if(e.key==='ArrowLeft') izq=true; if(e.key==='ArrowRight') der=true; if(e.key===' '){ e.preventDefault(); usarTurbo(); } });
  addEventListener('keyup',function(e){ if(e.key==='ArrowLeft') izq=false; if(e.key==='ArrowRight') der=false; });
  window.__carro={elegir:empezar,estado:function(){ return {tema:TN,N:N,jugando:jugando,eligiendo:eligiendo,dist:dist,lugar:lugar,pX:pX,mapa:mapa.p.length}; },
    saltar:function(d){ dist+=d; pos=(dist%LARGO+LARGO)%LARGO; }, lado:function(v){ pX=v; }};
}
