<!DOCTYPE html>
<!-- Las experiencias del llavero con NFC. construir.js la copia a GitHub como
     x.html y le pone la dirección del servidor. Se llega desde u.html cuando
     el regalo es un juego, un planeta, una constelación, una bitácora o
     cartas. Usa los mismos datos que el universo: fotos con su frase,
     dedicatoria, canción y nota de voz. -->
<html lang="es">
<head>
<!-- GENERADO POR construir.js desde Experiencias.html · NO EDITAR A MANO -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tu regalo Ruway</title>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&family=Caveat:wght@600;700&display=swap">
<style>
:root{color-scheme:dark;--noche:#140B26;--tarjeta:#231540;--borde:#3A2766;--crema:#FFF1DA;--rosa:#FF7AA8;
  --oro:#FFC94A;--lila:#B79CFF;--tenue:#A893C9}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--noche);color:var(--crema);font-family:Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
body.juego{overflow:hidden;touch-action:none}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--oro);outline-offset:2px}

/* la espera */
#espera{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;
  background:radial-gradient(ellipse at 50% 45%,#3a1f5e 0%,var(--noche) 70%);transition:opacity .6s}
#espera.fuera{opacity:0;pointer-events:none}
#espera .lazo{width:54px;height:54px;border-radius:50%;border:3px solid rgba(255,201,74,.25);border-top-color:var(--oro);animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
#espera p{margin:0;font:600 15px Nunito,sans-serif;color:#E8DCF5;text-align:center;padding:0 24px;white-space:pre-line}
#espera button{display:none;border:1px solid rgba(255,233,168,.4);background:none;color:var(--crema);border-radius:22px;padding:9px 20px}
#espera.perdido .lazo{display:none}#espera.perdido button{display:block}

/* los botones de sonido, arriba a la izquierda */
.sonidos{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;display:flex;gap:8px;z-index:6}
.sonidos button{min-width:42px;height:38px;border-radius:20px;border:1px solid rgba(255,233,168,.3);background:rgba(20,11,38,.6);
  color:var(--crema);font-size:15px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sonidos button.suena{background:var(--rosa);color:#2A0716;border-color:var(--rosa)}

/* capas: portada, recuerdo, final */
.capa{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px 16px;z-index:10;
  background:rgba(10,5,20,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow-y:auto}
.carta{width:100%;max-width:350px;text-align:center;animation:sube .45s cubic-bezier(.2,.9,.3,1.2);margin:auto}
@keyframes sube{from{transform:translateY(24px) scale(.94);opacity:0}}
.carta h2{font:700 26px/1.15 Fredoka,sans-serif;margin:0 0 8px;text-wrap:balance}
.carta p{margin:0 0 16px;line-height:1.55;color:#E8DCF5;white-space:pre-line}
.para{font:700 32px Caveat,cursive;color:var(--oro)}
.firma{font:700 26px Caveat,cursive;color:var(--oro);margin:-6px 0 16px}
.primario{border:none;border-radius:999px;padding:14px 28px;background:linear-gradient(180deg,#FF93B9,#F0568D);
  color:#2A0716;font:700 17px Fredoka,sans-serif;box-shadow:0 8px 22px rgba(240,86,141,.35)}
.suave{display:block;margin:12px auto 0;border:none;background:none;color:var(--tenue);font:700 13px Nunito,sans-serif;text-decoration:underline}
.icono{font-size:46px;line-height:1;margin-bottom:6px}
.polaroid{background:#FFFDF6;padding:10px 10px 14px;border-radius:6px;transform:rotate(-2deg);margin:4px auto 16px;max-width:270px;
  box-shadow:0 18px 40px rgba(0,0,0,.45)}
.polaroid .foto{aspect-ratio:1/1;border-radius:3px;overflow:hidden;background:linear-gradient(145deg,#FF9A8B,#B79CFF);max-width:100%}
.polaroid img{width:100%;height:100%;object-fit:cover;display:block}
.polaroid b{display:block;font:700 23px/1.2 Caveat,cursive;color:#3A2140;margin-top:8px;white-space:pre-line}
.etiqueta{display:inline-block;font:800 11.5px Nunito,sans-serif;letter-spacing:.08em;color:var(--oro);margin-bottom:8px;text-transform:uppercase}
.pie{font-size:11px;letter-spacing:.3em;color:#7F6FA0;text-align:center}

/* marco de los juegos */
.escena{position:fixed;inset:0}
.escena canvas{display:block;width:100%;height:100%}
.hud{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;
  pointer-events:none;z-index:5;padding:0 96px}
.hud h1{margin:0;font:700 25px/1.05 Caveat,cursive;color:var(--oro);text-shadow:0 2px 14px rgba(0,0,0,.7);text-align:center}
.hud small{font:700 12px Nunito,sans-serif;color:#D9CCF0;margin-top:5px;text-shadow:0 1px 8px #000;text-align:center}
.puntos{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.puntos i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18);transition:background .3s,transform .3s}
.puntos i.on{background:var(--rosa);transform:scale(1.2);box-shadow:0 0 10px var(--rosa)}
.marcador{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:6;text-align:right;pointer-events:none}
.marcador b{display:block;font:700 26px/1 Fredoka,sans-serif;color:var(--oro);font-variant-numeric:tabular-nums;text-shadow:0 2px 10px #000}
.marcador span{font:700 10.5px Nunito,sans-serif;color:#D9CCF0;letter-spacing:.06em}
.pista{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;
  color:#EFE4FF;text-shadow:0 2px 10px #000;pointer-events:none;z-index:5;transition:opacity .4s}
.pad{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;z-index:5;padding:0 16px}
.pad button{flex:1;max-width:170px;height:58px;border:none;border-radius:18px;background:rgba(46,29,80,.82);color:#FFC2D6;font:700 22px Fredoka,sans-serif;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.pad button:active{transform:translateY(2px)}
.cruz{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,50px);gap:6px;justify-content:center}
.cruz button{max-width:none;height:auto}
.cruz .ar{grid-column:2}.cruz .iz{grid-column:1;grid-row:2}.cruz .ab{grid-column:2;grid-row:2}.cruz .de{grid-column:3;grid-row:2}

/* bitácora */
.hoja{max-width:460px;margin:0 auto;padding:calc(62px + env(safe-area-inset-top,0px)) 16px 60px}
.nombres{font:700 44px/1.05 Caveat,cursive;color:var(--oro);text-align:center;text-wrap:balance}
.nombres em{font-style:normal;color:var(--rosa);display:inline-block;animation:late 1.2s ease-in-out infinite}
@keyframes late{50%{transform:scale(1.25)}}
.desde{font-size:13px;color:var(--tenue);margin-top:6px;text-align:center}
.contador{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
.contador div{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:12px 4px;text-align:center}
.contador b{display:block;font:700 26px/1 Fredoka,sans-serif;font-variant-numeric:tabular-nums}
.contador span{font-size:10.5px;color:var(--tenue);letter-spacing:.08em;text-transform:uppercase}
.frase{text-align:center;font:700 24px/1.25 Caveat,cursive;color:#FFD9E6;padding:14px 12px;border-radius:18px;margin-top:6px;
  background:linear-gradient(135deg,rgba(255,122,168,.14),rgba(183,156,255,.12));border:1px dashed rgba(255,122,168,.35);cursor:pointer}
.frase small{display:block;font:700 10.5px Nunito,sans-serif;color:var(--tenue);letter-spacing:.08em;margin-top:6px}
.hoja h2{font:700 20px Fredoka,sans-serif;margin:28px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hoja h2 small{font:600 12px Nunito,sans-serif;color:var(--tenue)}
.linea{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:22px}
.linea::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--rosa),var(--lila))}
.mom{position:relative;background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:10px;display:flex;gap:12px;
  align-items:center;cursor:pointer;text-align:left;color:inherit;width:100%}
.mom::before{content:"";position:absolute;left:-21px;top:24px;width:12px;height:12px;border-radius:50%;background:var(--rosa);box-shadow:0 0 0 4px var(--noche)}
.mom img,.mom .sin{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:linear-gradient(145deg,#FF9A8B,#B79CFF)}
.mom b{font:600 15px/1.3 Fredoka,sans-serif;display:block}
.mom span{font-size:12px;color:var(--tenue)}
.cupones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cupon{position:relative;border-radius:16px;padding:14px 12px;min-height:92px;background:#FFF1DA;color:#3A2140;overflow:hidden;
  border:2px dashed #E8B98A;text-align:left}
.cupon b{display:block;font:700 15px/1.2 Fredoka,sans-serif}
.cupon span{font-size:12px;color:#7A5A68}
.cupon canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:14px;touch-action:none}
.cupon.usado{opacity:.55}
.cupon.usado::after{content:"CANJEADO";position:absolute;right:-26px;top:14px;transform:rotate(35deg);background:#F0568D;color:#fff;
  font:800 10px Nunito,sans-serif;letter-spacing:.1em;padding:3px 30px}
.dedicatoria{background:var(--tarjeta);border:1px solid var(--borde);border-radius:18px;padding:16px;line-height:1.6;white-space:pre-line}
.aviso{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#FFF1DA;color:#3A2140;
  padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:12;white-space:nowrap}

/* cartas */
.sobres{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.sobre{position:relative;aspect-ratio:4/3;border:none;border-radius:10px;background:#F4E1C1;color:#5A3420;padding:0;cursor:pointer;
  box-shadow:0 10px 24px rgba(0,0,0,.35);perspective:600px;overflow:visible}
.sobre::before{content:"";position:absolute;inset:0;border-radius:10px;
  background:linear-gradient(35deg,transparent 49.5%,rgba(90,52,32,.14) 50%,transparent 51%),linear-gradient(-35deg,transparent 49.5%,rgba(90,52,32,.14) 50%,transparent 51%)}
.sobre .tapa{position:absolute;left:0;right:0;top:0;height:58%;background:#E8C99A;clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;transition:transform .6s;border-radius:10px 10px 0 0}
.sobre .sello{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#FF6A88,#C2185B);box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;
  justify-content:center;color:#FFE0EA;font-size:15px;transition:opacity .3s}
.sobre span{position:absolute;left:8px;right:8px;bottom:8px;font:700 17px/1.1 Caveat,cursive;text-align:center}
.sobre.abierto .tapa{transform:rotateX(180deg)}
.sobre.abierto .sello{opacity:0}
.sobre.abierto{background:#FBEEDC}
.sobre.oro{grid-column:1/-1;aspect-ratio:auto;height:120px;background:linear-gradient(135deg,#FFE08A,#E8A73A)}
.sobre.oro .tapa{background:#F2C25C}
.papel{background:#FFFDF6;color:#3A2140;border-radius:6px;padding:18px 16px;box-shadow:0 18px 40px rgba(0,0,0,.45);text-align:left;
  background-image:repeating-linear-gradient(transparent 0 27px,rgba(90,52,32,.1) 27px 28px);max-width:330px;margin:0 auto 16px}
.papel .foto{aspect-ratio:4/3;border-radius:4px;overflow:hidden;margin-bottom:12px;background:linear-gradient(145deg,#FF9A8B,#B79CFF)}
.papel img{width:100%;height:100%;object-fit:cover;display:block}
.papel p{font:700 23px/28px Caveat,cursive;margin:0;white-space:pre-line}
.papel .de{text-align:right;margin-top:10px}
@media (prefers-reduced-motion:reduce){.carta,.nombres em{animation:none}}
</style>
</head>
<body>
<div id="espera"><div class="lazo"></div><p id="espera-txt">Abriendo tu regalo</p><button onclick="location.reload()">Reintentar</button></div>
<div class="sonidos" id="sonidos" hidden>
  <button id="b-son" aria-label="Música" hidden>♪</button>
  <button id="b-voz" aria-label="Mensaje de voz" hidden>🎙️</button>
</div>

  <div class="para" id="p-para"></div><div class="icono" id="p-ic"></div>

</div></div>

  <span class="etiqueta" id="r-et"></span>
  <div class="polaroid"><div class="foto" id="r-foto"></div><b id="r-txt"></b></div>

</div></div>
<div class="capa" id="final" hidden><div class="carta">
  <div class="para" id="f-para"></div>
  <h2 id="f-tit"></h2><p id="f-txt"></p><div class="firma" id="f-de"></div>
  <button class="primario" id="f-bt">Volver a empezar</button>
</div></div>
<div class="aviso" id="aviso" hidden></div>

<script>
var API = "https://script.google.com/macros/s/AKfycbym_HuTN7HjpEy3IkKwvdamuJtExLvVnUJt83-vWxhhUR1kNx_hfNzd6GC53nNc-jYOGQ/exec";
var MAPA = { c:'rcod', cod:'rcod', rcod:'rcod', para:'rpara', rpara:'rpara',
                msg:'rmsg', rmsg:'rmsg', de:'rde', rde:'rde',
                tit:'rtit', rtit:'rtit', tem:'rtem', rtem:'rtem',
                v:'rver', rver:'rver' };
var DATOS=null, FOTOS=[], TIPO='', HOY=Date.now();

/* ============ traer los datos (igual que u.html) ============ */
function params(){
  var q=new URLSearchParams(location.search), r={};
  Object.keys(MAPA).forEach(function(k){ var v=q.get(k); if(v && !r[MAPA[k]]) r[MAPA[k]]=v; });
  return r;
}
function llave(p){ var c=String(p.rcod||'').trim().toUpperCase(); return 'ruway:uni:'+(/^[A-Z0-9]{4,10}$/.test(c)?c:'-'); }
function guardado(p){ try{ var v=JSON.parse(localStorage.getItem(llave(p))||'null');
  if(v && v.d && (Date.now()-v.t)<30*864e5) return v.d; }catch(e){} return null; }
function guardar(p,d){ if(!d||d.bloqueado||d.vistaPrevia) return; try{ localStorage.setItem(llave(p),JSON.stringify({t:Date.now(),d:d})); }catch(e){} }
var _n=0;
function jsonp(fn,args,ok,mal,espera){
  var hecho=false, vivos=0, muertos=0;
  function intento(ultimo){
    vivos++; var nom='__x'+(++_n), t=document.createElement('script');
    function limpiar(){ clearTimeout(ref); clearTimeout(tope); try{ delete window[nom]; }catch(e){ window[nom]=undefined; } if(t.parentNode) t.parentNode.removeChild(t); }
    function murio(){ limpiar(); muertos++; if(muertos<vivos) return; if(!ultimo){ setTimeout(function(){ intento(true); },900); return; }
      if(!hecho){ hecho=true; mal&&mal(); } }
    window[nom]=function(r){ limpiar(); if(hecho) return; hecho=true; if(r&&r.ok) ok(r.r); else mal&&mal(r&&r.error); };
    t.onerror=murio;
    var ref=ultimo?0:setTimeout(function(){ intento(true); },espera||7000), tope=setTimeout(murio,45000);
    t.src=API+(API.indexOf('?')>=0?'&':'?')+'vista=api&rfn='+fn+'&rcb='+nom+'&rargs='+encodeURIComponent(JSON.stringify(args));
    document.head.appendChild(t);
  }
  intento(false);
}
function espera(t,perdido){ document.getElementById('espera-txt').textContent=t; if(perdido) document.getElementById('espera').classList.add('perdido'); }
(function(){
  var p=params(), v=guardado(p);
  if(v && v.ok){ setTimeout(function(){ listo(v); },0); jsonp('universo',[p],function(d){ if(d&&d.ok) guardar(p,d); },function(){}); return; }
  var t0=Date.now(), reloj=setInterval(function(){ var s=(Date.now()-t0)/1000;
    if(s>22) espera('Está tardando, pero seguimos'); else if(s>11) espera('Despertando tu regalo'); },1000);
  jsonp('universo',[p],function(d){ clearInterval(reloj);
    if(!d||!d.ok){ espera('No encontramos este regalo.\nRevisa el enlace o escríbenos.',true); return; }
    guardar(p,d); listo(d);
  },function(){ clearInterval(reloj); espera('No pudimos abrirlo.\nRevisa tu conexión.',true); });
})();

var NUEVOS=/^(constelaciones|planeta|laberinto|carrito|bitacora|cartas)$/;
function listo(d){
  /* Lo cerrado hasta una fecha y los universos de siempre los enseña u.html. */
  if(d.bloqueado || !NUEVOS.test(String(d.tipo||''))){ location.replace('u.html'+location.search); return; }
  DATOS=d; TIPO=d.tipo;
  FOTOS=(d.fotos||[]).slice(0,8).map(function(f){ var im=new Image(); im.src=f.url; return {src:f.url,cors:f.cors,txt:f.txt||''}; });
  var e=document.getElementById('espera'); e.classList.add('fuera'); setTimeout(function(){ e.remove(); },700);
  portada();
}

/* ============ lo que comparten todas ============ */
var TXT={
  constelaciones:{ic:'✨',tit:'Un cielo que es solo nuestro',txt:'Toca las estrellas en orden. Cada una guarda un recuerdo, y juntas dibujan algo.',bt:'Mirar el cielo'},
  planeta:{ic:'🪐',tit:'Te regalo un planeta entero',txt:'Gíralo con el dedo. Cada banderita es un recuerdo nuestro: encuéntralas todas.',bt:'Aterrizar'},
  laberinto:{ic:'🧸',tit:'Ayuda al osito a encontrar nuestros recuerdos',txt:'En el laberinto hay regalitos escondidos. Cada uno guarda una foto. Con todos, se abre el corazón del final.',bt:'Empezar'},
  carrito:{ic:'🚗',tit:'Maneja hasta nuestros recuerdos',txt:'Esquiva los carros y junta corazones. Cada meta de puntos abre una foto nuestra.',bt:'Arrancar'},
  bitacora:{ic:'📖',tit:'Nuestra bitácora',txt:'Todo lo nuestro en un solo lugar: el tiempo juntos, nuestros momentos y unos cupones para ti.',bt:'Abrir'},
  cartas:{ic:'💌',tit:'Cartas para abrir cuando…',txt:'Una carta para cada momento. Ábrelas cuando toque (o todas ahora, no le diré a nadie).',bt:'Ver mis cartas'}
};
function nombrePara(){ return String(DATOS.para||'').trim(); }
function nombreDe(){ var d=String(DATOS.de||'').trim(); return d.length<=18?d:''; }
function portada(){
  var t=TXT[TIPO];
  document.getElementById('p-para').textContent=nombrePara()?'Para '+nombrePara():'Un regalo para ti';
  document.getElementById('p-ic').textContent=t.ic;
  document.getElementById('p-tit').textContent=t.tit;
  document.getElementById('p-txt').textContent=t.txt;
  document.getElementById('p-bt').textContent=t.bt;
  document.getElementById('portada').hidden=false;
  document.getElementById('p-bt').onclick=function(){
    document.getElementById('portada').hidden=true;
    Sonido.empezar();                      /* dentro del toque: el iPhone lo exige */
    ({constelaciones:constelaciones,planeta:planeta,laberinto:laberinto,carrito:carrito,bitacora:bitacora,cartas:cartas})[TIPO]();
  };
}
function fotoEn(el,f){
  el.innerHTML='';
  if(!f||!f.src) return;
  var im=document.createElement('img'); im.alt=''; im.src=f.src; el.appendChild(im);
}
/* Un recuerdo en grande. `luego` corre al cerrarlo. */
function recuerdo(i,etiqueta,boton,luego){
  var f=FOTOS[i]||{};
  document.getElementById('r-et').textContent=etiqueta||'';
  fotoEn(document.getElementById('r-foto'),f);
  document.getElementById('r-txt').textContent=f.txt||'';
  var b=document.getElementById('r-bt'); b.textContent=boton||'Seguir';
  document.getElementById('recuerdo').hidden=false; b.focus();
  campanita([660,830,990]);
  b.onclick=function(){ document.getElementById('recuerdo').hidden=true; if(luego) luego(); };
}
/* La dedicatoria del cliente, al final de cada experiencia. */
function final(titulo,boton,luego){
  document.getElementById('f-para').textContent=nombrePara()?'Para '+nombrePara():'';
  document.getElementById('f-tit').textContent=titulo;
  document.getElementById('f-txt').textContent=String(DATOS.msg||'').trim()||'Gracias por existir.';
  document.getElementById('f-de').textContent=String(DATOS.de||'').trim()?'— '+String(DATOS.de).trim():'';
  var b=document.getElementById('f-bt'); b.textContent=boton||'Volver a empezar';

      }
      for(i=chispas.length-1;i>=0;i--){ var s=chispas[i]; s.userData.t-=dt*1.2; s.position.addScaledVector(s.userData.v,dt); s.userData.v.y-=9*dt;
        s.scale.setScalar(Math.max(.01,s.userData.t)); if(s.userData.t<=0){ E.remove(s); chispas.splice(i,1); } }
      R.render(E,C); })(0);
  });
}
</script>
